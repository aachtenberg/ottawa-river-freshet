---
# Script ConfigMap — kept in sync with ingesters/hq-ingest/ingest.py.
# If you edit the source, regenerate with:
#   kubectl create configmap hq-ingest-script \
#     --from-file=ingest.py=../../ingesters/hq-ingest/ingest.py \
#     -n freshet --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: ConfigMap
metadata:
  name: hq-ingest-script
  namespace: freshet
data:
  ingest.py: |
    """
    Hydro-Québec open-data ingester.

    Pulls two JSON feeds linked from
    https://www.hydroquebec.com/production/debits-niveaux-eau.html and writes:

      dam_releases   -- hourly total / turbined / spilled discharge per centrale
      dam_inflows    -- daily filtered local inflow (apport filtré) per centrale
      dam_levels     -- hourly water level per station (amont, aval, river, weather)
      dam_sites      -- combined metadata for centrales + stations

    Filtered to the Ottawa basin window (lat 45-48, lon -80 to -74) so we don't
    ingest the entire Quebec hydro fleet. Adjust BBOX env vars to widen scope.

    Feed-degradation handling
    -------------------------
    Hydro-Québec degrades specific egress IPs by serving them a frozen copy of the
    JSON (see cloudflare/hq-feed-relay/). To survive that automatically each feed
    is fetched through a three-step chain, taking the freshest result:

      1. the Cloudflare relay                        (HQ_*_URL)
      2. the relay again with the edge cache bypassed (?nocache=1)
      3. a GitHub-Actions mirror on independent egress (HQ_*_FALLBACK_URL)

    If every path is still stale, the run ingests the freshest data it found and
    posts a one-shot ntfy alert (fired only on the transition into/out of the
    stale state, so a multi-hour HQ outage produces one alert, not one per run).
    """

    import os, json, sys, ssl, urllib.request
    from collections import defaultdict
    from datetime import datetime, timezone

    # hydroquebec.com's CDN refuses Python's default TLS handshake on alpine images
    # (SSLV3_ALERT_HANDSHAKE_FAILURE). Lowering the OpenSSL security level to 1
    # allows the legacy cipher suites the CDN advertises.
    SSL_CTX = ssl.create_default_context()
    SSL_CTX.set_ciphers('DEFAULT:@SECLEVEL=1')

    CENTRALES_URL = os.environ.get(
        'HQ_CENTRALES_URL',
        'https://www.hydroquebec.com/data/documents-donnees/donnees-ouvertes/json/Donnees_VUE_CENTRALES_ET_OUVRAGES.json',
    )
    STATIONS_URL = os.environ.get(
        'HQ_STATIONS_URL',
        'https://www.hydroquebec.com/data/documents-donnees/donnees-ouvertes/json/Donnees_VUE_STATIONS_ET_TARAGES.json',
    )
    # Independent-egress fallback (GitHub Actions release mirror). Empty = no
    # fallback, so the ingester still runs fine before Tier 2 is deployed.
    CENTRALES_FALLBACK_URL = os.environ.get('HQ_CENTRALES_FALLBACK_URL', '')
    STATIONS_FALLBACK_URL = os.environ.get('HQ_STATIONS_FALLBACK_URL', '')

    POSTGREST = os.environ.get('POSTGREST_URL', 'http://postgrest.data.svc.cluster.local:3000')

    # Ottawa basin bounding box. Première-Chute (47.6, -79.45) is the upper limit;
    # Carillon (45.57, -74.38) is the lower. A small margin avoids edge drops.
    LAT_MIN = float(os.environ.get('HQ_LAT_MIN', '45.0'))
    LAT_MAX = float(os.environ.get('HQ_LAT_MAX', '48.0'))
    LON_MIN = float(os.environ.get('HQ_LON_MIN', '-80.0'))
    LON_MAX = float(os.environ.get('HQ_LON_MAX', '-74.0'))

    POST_BATCH = int(os.environ.get('HQ_POST_BATCH', '2000'))

    # A healthy feed's newest point lags real time by ~3 h. STALE_HOURS is the
    # threshold past which we stop trusting a path and try the next one;
    # ALERT_HOURS is when we conclude HQ itself is degraded and notify.
    STALE_HOURS = float(os.environ.get('HQ_STALE_HOURS', '6'))
    ALERT_HOURS = float(os.environ.get('HQ_ALERT_HOURS', '10'))

    NTFY_URL = os.environ.get('NTFY_URL', 'http://ntfy.infrastructure.svc.cluster.local')
    NTFY_TOPIC = os.environ.get('NTFY_TOPIC', 'freshet-mansfield')


    def fetch_json(url):
        req = urllib.request.Request(url, headers={
            'Accept': 'application/json',
            'User-Agent': 'freshet-hq-ingest/1.0',
        })
        with urllib.request.urlopen(req, timeout=60, context=SSL_CTX) as r:
            return json.load(r)


    def post_rows(path, rows):
        if not rows:
            return 0
        sent = 0
        for i in range(0, len(rows), POST_BATCH):
            chunk = rows[i:i + POST_BATCH]
            body = json.dumps(chunk).encode('utf-8')
            req = urllib.request.Request(
                f'{POSTGREST}/{path}',
                data=body,
                method='POST',
                headers={
                    'Content-Type': 'application/json',
                    'Prefer': 'resolution=ignore-duplicates',
                },
            )
            with urllib.request.urlopen(req, timeout=60) as r:
                sent += len(chunk)
                print(f'  POST /{path} -> HTTP {r.status} ({len(chunk)} rows, cumulative {sent}/{len(rows)})')
        return sent


    def in_basin(site):
        try:
            lat = float(site.get('ycoord') or 0)
            lon = float(site.get('xcoord') or 0)
        except (TypeError, ValueError):
            return False
        return LAT_MIN <= lat <= LAT_MAX and LON_MIN <= lon <= LON_MAX


    def normalize_ts(ts):
        # HQ timestamps look like "2026/05/02T19:00:00Z" — slashes in the date.
        return ts.replace('/', '-')


    def parse_date(s):
        if not s:
            return None
        s = s.replace('/', '-')
        for fmt in ('%Y-%m-%d', '%Y-%m-%dT%H:%M:%SZ'):
            try:
                return datetime.strptime(s, fmt).date().isoformat()
            except ValueError:
                continue
        return None


    def _numeric(v):
        try:
            return float(v) if v not in (None, '') else None
        except (TypeError, ValueError):
            return None


    def site_meta_row(site, kind):
        return {
            'site_id':     site['identifiant'],
            'nom':         site.get('nom'),
            'kind':        kind,
            'region':      site.get('RegionQC'),
            'region_code': site.get('CodeRegionQC'),
            'lat':         _numeric(site.get('ycoord')),
            'lon':         _numeric(site.get('xcoord')),
            'date_debut':  parse_date(site.get('date debut')),
            'date_fin':    parse_date(site.get('date fin')),
        }


    def upsert_sites(rows):
        """dam_sites is a regular table (not a hypertable); we want true upsert
        so name/coord changes propagate. Use Prefer: resolution=merge-duplicates."""
        if not rows:
            return 0
        body = json.dumps(rows).encode('utf-8')
        req = urllib.request.Request(
            f'{POSTGREST}/dam_sites',
            data=body,
            method='POST',
            headers={
                'Content-Type': 'application/json',
                'Prefer': 'resolution=merge-duplicates',
            },
        )
        with urllib.request.urlopen(req, timeout=30) as r:
            print(f'  POST /dam_sites -> HTTP {r.status} ({len(rows)} sites)')
        return len(rows)


    # --- feed freshness + degradation handling --------------------------------

    def feed_max_ts(payload, collection_key):
        """Newest observation timestamp anywhere in a feed, as a normalized
        'YYYY-MM-DDTHH:MM:SSZ' string (lexically sortable). '' if the feed is
        empty."""
        newest = ''
        for site in payload.get(collection_key, []):
            for comp in site.get('Composition', []):
                for ts in (comp.get('Donnees') or {}):
                    n = normalize_ts(ts)
                    if n > newest:
                        newest = n
        return newest


    def age_hours(ts_str):
        """Hours between now and a timestamp string. Accepts both the feed's
        'YYYY-MM-DDTHH:MM:SSZ' form and PostgREST's ISO '+00:00' form. inf when
        missing or unparseable."""
        if not ts_str:
            return float('inf')
        s = ts_str.replace('Z', '+00:00')
        try:
            t = datetime.fromisoformat(s)
        except ValueError:
            return float('inf')
        if t.tzinfo is None:
            t = t.replace(tzinfo=timezone.utc)
        return (datetime.now(timezone.utc) - t).total_seconds() / 3600.0


    def fetch_freshest(label, primary_url, fallback_url, collection_key):
        """Fetch a feed through the relay → relay-nocache → GitHub-mirror chain.
        Returns (payload, source, age_hours) for the freshest feed found,
        short-circuiting as soon as one is within STALE_HOURS."""
        sep = '&' if '?' in primary_url else '?'
        attempts = [
            ('relay',         primary_url),
            ('relay/nocache', f'{primary_url}{sep}nocache=1'),
        ]
        if fallback_url:
            attempts.append(('github-mirror', fallback_url))

        best = None  # (age, payload, source)
        for source, url in attempts:
            try:
                payload = fetch_json(url)
            except Exception as e:
                print(f'  {label}: {source} fetch failed: {e}', file=sys.stderr)
                continue
            mx = feed_max_ts(payload, collection_key)
            age = age_hours(mx)
            print(f'  {label}: {source} newest={mx or "n/a"} age={age:.1f}h')
            if best is None or age < best[0]:
                best = (age, payload, source)
            if mx and age <= STALE_HOURS:
                return payload, source, age

        if best is None:
            raise RuntimeError(f'{label}: every feed source failed')
        print(f'  {label}: all sources stale — using freshest ({best[2]}, {best[0]:.1f}h)',
              file=sys.stderr)
        return best[1], best[2], best[0]


    def db_max_ts(table, time_col='time'):
        """Newest timestamp already stored in a PostgREST table, or None."""
        url = f'{POSTGREST}/{table}?select={time_col}&order={time_col}.desc&limit=1'
        try:
            rows = fetch_json(url)
        except Exception as e:
            print(f'  db_max_ts({table}) failed: {e}', file=sys.stderr)
            return None
        return rows[0][time_col] if rows else None


    def ntfy_alert(title, body, priority='4', tags='warning'):
        req = urllib.request.Request(
            f'{NTFY_URL}/{NTFY_TOPIC}',
            data=body.encode('utf-8'),
            headers={'Title': title, 'Priority': priority, 'Tags': tags},
        )
        try:
            with urllib.request.urlopen(req, timeout=15) as r:
                print(f'  ntfy alert sent ({r.status}): {title}')
        except Exception as e:
            print(f'  ntfy alert failed: {e}', file=sys.stderr)


    # --- ingest ---------------------------------------------------------------

    def ingest_centrales(payload):
        sites = [s for s in payload.get('Site', []) if in_basin(s)]
        print(f'centrales: {len(sites)} basin sites in window')

        site_rows = [site_meta_row(s, 'centrale') for s in sites]

        release_rows = []   # one row per (site_id, time), columns total/turbined/spilled
        inflow_rows = []    # one row per (site_id, day)

        for s in sites:
            site_id = s['identifiant']
            # Group hourly series by timestamp so we emit one row per (site, time)
            # carrying total/turbined/spilled together. Multiple "déversé"/"turbiné"
            # streams (e.g. multi-spillway sites) are summed.
            per_time = defaultdict(lambda: {'total': None, 'turbined': 0.0, 'spilled': 0.0,
                                            'has_turb': False, 'has_spill': False})
            for c in s.get('Composition', []):
                tpd = c.get('type_point_donnee') or ''
                unit = c.get('nom_unite_mesure') or ''
                if unit != 'm³/s':
                    continue
                data = c.get('Donnees') or {}
                if tpd == 'Apport filtré':
                    for ts, val in data.items():
                        try:
                            v = float(val)
                        except (TypeError, ValueError):
                            continue
                        inflow_rows.append({
                            'time': normalize_ts(ts),
                            'site_id': site_id,
                            'inflow_cms': v,
                        })
                    continue
                if tpd == 'Débit total':
                    for ts, val in data.items():
                        try:
                            v = float(val)
                        except (TypeError, ValueError):
                            continue
                        per_time[ts]['total'] = v
                elif tpd.startswith('Débit turbiné'):
                    for ts, val in data.items():
                        try:
                            v = float(val)
                        except (TypeError, ValueError):
                            continue
                        per_time[ts]['turbined'] += v
                        per_time[ts]['has_turb'] = True
                elif tpd.startswith('Débit déversé'):
                    for ts, val in data.items():
                        try:
                            v = float(val)
                        except (TypeError, ValueError):
                            continue
                        per_time[ts]['spilled'] += v
                        per_time[ts]['has_spill'] = True

            for ts, vals in per_time.items():
                release_rows.append({
                    'time': normalize_ts(ts),
                    'site_id': site_id,
                    'total_cms':    vals['total'],
                    'turbined_cms': vals['turbined'] if vals['has_turb']  else None,
                    'spilled_cms':  vals['spilled']  if vals['has_spill'] else None,
                })

        print(f'  releases: {len(release_rows)} rows; inflows: {len(inflow_rows)} rows')
        upsert_sites(site_rows)
        post_rows('dam_releases', release_rows)
        post_rows('dam_inflows', inflow_rows)


    def ingest_stations(payload):
        stations = [s for s in payload.get('Station', []) if in_basin(s)]
        print(f'stations: {len(stations)} basin sites in window')

        site_rows = [site_meta_row(s, 'station') for s in stations]

        level_rows = []
        for s in stations:
            sid = s['identifiant']
            for c in s.get('Composition', []):
                if c.get('type_point_donnee') != 'Niveau':
                    continue
                for ts, val in (c.get('Donnees') or {}).items():
                    try:
                        v = float(val)
                    except (TypeError, ValueError):
                        continue
                    level_rows.append({
                        'time': normalize_ts(ts),
                        'station_id': sid,
                        'level_m': v,
                    })

        print(f'  levels: {len(level_rows)} rows')
        upsert_sites(site_rows)
        post_rows('dam_levels', level_rows)


    def main():
        started = datetime.now(timezone.utc)

        # Snapshot DB freshness before the run so we can alert only on the
        # transition into / out of a stale state (no per-run alert spam).
        age_before = age_hours(db_max_ts('dam_releases'))

        try:
            cen_payload, cen_src, cen_age = fetch_freshest(
                'centrales', CENTRALES_URL, CENTRALES_FALLBACK_URL, 'Site')
            ingest_centrales(cen_payload)
        except Exception as e:
            print(f'centrales ingest failed: {e}', file=sys.stderr)
            raise

        try:
            sta_payload, sta_src, sta_age = fetch_freshest(
                'stations', STATIONS_URL, STATIONS_FALLBACK_URL, 'Station')
            ingest_stations(sta_payload)
        except Exception as e:
            print(f'stations ingest failed: {e}', file=sys.stderr)
            raise

        age_after = age_hours(db_max_ts('dam_releases'))
        print(f'feed freshness: centrales {cen_age:.1f}h via {cen_src}, '
              f'stations {sta_age:.1f}h via {sta_src}; '
              f'dam_releases in DB now {age_after:.1f}h old')

        if age_after > ALERT_HOURS and age_before <= ALERT_HOURS:
            ntfy_alert(
                '⚠️ HQ Operations feed stale',
                f'Hydro-Québec release feed has not advanced in {age_after:.0f}h.\n'
                f'Tried the relay, a cache-bypass and the GitHub mirror — all '
                f'stale. The dashboard Operations tab will lag until HQ recovers.',
                priority='4', tags='warning')
        elif age_after <= ALERT_HOURS and age_before > ALERT_HOURS and age_before != float('inf'):
            ntfy_alert(
                '✅ HQ Operations feed recovered',
                f'Hydro-Québec release feed is fresh again ({age_after:.1f}h old).',
                priority='3', tags='white_check_mark')

        elapsed = (datetime.now(timezone.utc) - started).total_seconds()
        print(f'HQ ingest complete in {elapsed:.1f}s')


    if __name__ == '__main__':
        main()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hq-ingest
  namespace: freshet
spec:
  # HQ refreshes the open-data JSON twice daily; we run hourly to keep lag low.
  # Offset from river-history (:12) and reservoir (:30) so the API hits stagger.
  schedule: "27 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingest
              image: python:3.12-alpine
              command: ["python", "/app/ingest.py"]
              env:
                - name: POSTGREST_URL
                  value: http://postgrest.freshet.svc.cluster.local:3000
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits:   { cpu: 500m, memory: 256Mi }
          volumes:
            - name: script
              configMap: { name: hq-ingest-script }
