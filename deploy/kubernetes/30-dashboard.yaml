      <div class="section-title" style="margin-top: 4px;">Wave propagation — three views</div>
      <div class="section-subtitle">
        The Ottawa is a system, not a place. A freshet pulse that hits Témiscaming arrives at Carillon several days later — the river carries the wave downstream as a physical signal. Each panel below tells the same story with a different visual grammar; this page exists so the community can tell us which is most useful.
        <br><br>
        Source: <strong>mean daily discharge (m³/s)</strong> from the ORRPB main stem (Témiscaming → Carillon), backfilled from <a href="https://www.ottawariver.ca/conditions/?display=river" target="_blank">ORRPB's per-location archive</a> for the past year. Pick a window below — short windows show the current 2026 freshet, longer windows include the 2025 freshet and summer/fall recession for context.
