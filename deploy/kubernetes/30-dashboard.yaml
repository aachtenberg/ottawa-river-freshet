      <strong>Live data</strong> from Quebec MSP <a href="https://vigilance.geo.securite.gouv.qc.ca/stations/1195" target="_blank">Vigilance</a> (Lac Coulonge, Coulonge River, Waltham + regional gauges); the property gauge is cross-checked against <a href="https://www.hydroquebec.com/generation/water-flow-management.html" target="_blank">Hydro-Québec open data</a> (Fort-Coulonge, 1-2983). Regional Ontario gauges from Environment Canada (WSC).
      Auto-refreshes every 10 minutes.
      Property thresholds from personal 2019 flood observations; 20-yr / 100-yr lines from the 2019 Lebel land survey (geodetic, ≈gauge datum ±5 cm).
      All timestamps shown in Eastern (America/Toronto).
      <br><strong>Unofficial dashboard</strong> — for official guidance consult <a href="https://www.ottawariver.ca/forecasts" target="_blank">ORRPB</a> and local authorities.
      <br><strong>Case file</strong> — this dashboard is paired with a multi-year analytical case file on the post-2017 freshet regime change at Lac Coulonge: <a href="https://github.com/aachtenberg/ottawa-river-freshet/blob/main/docs/exhibits/Exhibit_0_Plain_Language.html" target="_blank">plain-language story</a> · <a href="https://github.com/aachtenberg/ottawa-river-freshet/tree/main/data/daily-briefs" target="_blank">daily briefs</a> · <a href="https://github.com/aachtenberg/ottawa-river-freshet" target="_blank">full repository</a>.
    </div>

    <script>
    // Primary `inedit` host, NOT the `inedit-ro` read-only replica — the -ro
    // mirror freezes post-freshet (serves stale rows for days with no error),
    // while this primary host the official Vigilance site uses stays live.
    // Switched 2026-05-29.
    // MSP moved to the securite.gouv.qc.ca domain and deleted the
    // geo.msp.gouv.qc.ca records on 2026-10-27; same API, new host.
    const API_BASE = 'https://inedit.geo.securite.gouv.qc.ca';
    // Hydro-Québec Bryson headpond (amont). Distinct from Lac Coulonge 1195 —
    // the dam pond sits well downstream of the Mansfield/Fort-Coulonge reach.
    const BRYSON_AMONT_ID = '1-2964';
    const BRYSON_CEILING_M = 104.67;
    const BRYSON_BAND_LOW_M = 104.20;
    // Hydro Météo gauges that sit on the Overview as local heroes when transmitting.
    const LOCAL_HYDRO_METEO_IDS = [1279, 1004];
    const HERO_SLOTS = {
      upstream: { chartId: 'waChart', infoId: 'wa-info', legendId: 'wa-legend', titleId: 'wa-title', color: '#7A5ED8' },
      lake:     { chartId: 'lcChart', infoId: 'lc-info', legendId: 'lc-legend', titleId: 'lc-title', color: '#378ADD' },
      third:    { chartId: 'crChart', infoId: 'cr-info', legendId: 'cr-legend', titleId: 'cr-title', color: '#D85A30' }
    };
    // Bound to the three Overview canvases. Default is the live-substitute
    // layout (Mattawa / Lac Coulonge / Bryson headpond); bindHeroCharts() swaps
    // back to Waltham + Coulonge River when Hydro Météo is transmitting again.
    let STATIONS = {
      545: { ...HERO_SLOTS.upstream },
      1195: { ...HERO_SLOTS.lake },
      [BRYSON_AMONT_ID]: { ...HERO_SLOTS.third }
    };

    // Property thresholds. `histCount` = number of years out of HISTORICAL_RECORD_YEARS
    // where the annual daily max equalled or exceeded `level`. Sourced from
    // data/lac-coulonge-monthly-1972-2025.csv.
    // The 109.05 / 109.34 m rows are NOT personal observations: they are the
    // surveyed 20-yr / 100-yr flood-recurrence elevations from the 2019 Lebel
    // land survey (geodetic MSL). The property sits on Lac Coulonge itself, so
    // the gauge datum and survey datum align to within ~5 cm (the surveyed 20-yr
    // line lands 4 cm above the personally-observed "water inside" level), which
    // is why they can be read directly off this gauge. The histCount cross-check
    // is a real signal: the surveyor's "20-yr" line has been reached only once in
    // 54 years of record and the "100-yr" line never.
    const PROPERTY_THRESHOLDS = [
      { level: 108.30, desc: 'Water approaching property (2019: Apr 25)',     histCount: 6 },
      { level: 108.48, desc: 'Water in backyard, driveway, big tree (2019: Apr 26)', histCount: 4 },
      { level: 108.52, desc: 'Crawl space to floor joists (2017 peak)',       histCount: 4 },
      { level: 108.75, desc: 'Water at end of bricks on cottage (2019: Apr 27)', histCount: 3 },
      { level: 109.01, desc: 'WATER INSIDE cottage, garage, RV (2019: Apr 28)', histCount: 1 },
      { level: 109.05, desc: '20-year flood line (2019 Lebel land survey)',   histCount: 1 },
      { level: 109.17, desc: '2019 record — all-time high',                   histCount: 1 },
      { level: 109.34, desc: '100-year flood line — whole lot below (2019 survey)', histCount: 0 }
    ];
    const HISTORICAL_RECORD_YEARS = 54; // 1972-2025

    // All 54 annual daily-maximum levels, sorted descending. Used to rank the
    // current season's peak against history.
    const HISTORICAL_ANNUAL_MAX_DESC = [
      109.17, 108.85, 108.77, 108.52, 108.40, 108.32, 108.27, 108.16, 108.15, 108.01,
      107.96, 107.88, 107.87, 107.85, 107.84, 107.79, 107.78, 107.72, 107.72, 107.64,
      107.63, 107.61, 107.60, 107.58, 107.55, 107.52, 107.50, 107.49, 107.49, 107.46,
      107.46, 107.44, 107.44, 107.38, 107.36, 107.27, 107.23, 107.21, 107.20, 107.15,
      107.05, 107.02, 107.01, 107.00, 106.94, 106.78, 106.77, 106.74, 106.67, 106.66,
      106.65, 106.64, 106.61, 106.60
    ];

    function rankPeak(level) {
      // 1-indexed rank: number of historical years with peak > level, plus 1.
      let above = 0;
      for (const p of HISTORICAL_ANNUAL_MAX_DESC) {
        if (p > level) above++;
        else break;
      }
      return above + 1;
    }
    function ordinal(n) {
      const s = ['th', 'st', 'nd', 'rd'];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    const THRESHOLD_COLORS = {
      'simaj-niv': { label: 'Major flood', color: '#E24B4A' },
      'simoy-niv': { label: 'Moderate flood', color: '#EF9F27' },
      'sim-niv': { label: 'Minor flood', color: '#F0A030' },
      'spa-niv': { label: 'Pre-alert', color: '#888' }
    };

    // Historical Lac Coulonge peaks (1195) for chart overlay
    const HISTORICAL_PEAKS = [
      { year: 2019, level: 109.17 },
      { year: 2023, level: 108.77 },
      { year: 2017, level: 108.52 },
      { year: 2025, level: 108.15 }
    ];

    // Weather stations for the basin panel (open-meteo forecasts). Two groups:
    //   upstream  — drives the basin-wide freeze-night counter (snowmelt signal)
    //   downstream — context-only forecast for visitors watching the lower corridor
    const FREEZE_STATIONS = [
      // Upstream — used in the freeze-night basin summary
      { name: "Val-d'Or, QC",           role: 'Far-north headwaters',           group: 'upstream',   lat: 48.77, lon: -77.79 },
      { name: 'Rouyn-Noranda, QC',      role: 'North basin',                    group: 'upstream',   lat: 48.10, lon: -79.02 },
      { name: 'Temiskaming Shores, ON', role: 'Lake Timiskaming · north shore', group: 'upstream',   lat: 47.49, lon: -79.72,
        note: 'North-shore microclimate — chosen for upper-basin snowmelt sensing. Témiscaming QC at the south end is lake-moderated and warmer.' },
      { name: 'Pembroke, ON',           role: 'Local · upstream of Mansfield',  group: 'upstream',   lat: 45.82, lon: -77.11 },
      // Downstream — forecast context only
      { name: 'Ottawa-Gatineau',        role: 'Britannia / Hull / Aylmer area', group: 'downstream', lat: 45.42, lon: -75.70 },
      { name: 'Hawkesbury, ON',         role: 'Thurso / Masson / Carillon area',group: 'downstream', lat: 45.61, lon: -74.61 }
    ];

    // Regional context — Vigilance stations up- and downstream of Lac Coulonge.
    // Ordered upstream → downstream along the Ottawa River's flow.
    const REGIONAL_STATIONS = [
      { id: 951,  name: 'Temiscaming', subtitle: 'Lake Timiskaming village gauge · headwaters' },
      { id: 545,  name: 'Mattawa',     subtitle: 'Otto Holden tailwater · earliest northern pulse' },
      { id: 1279, name: 'Waltham',     subtitle: 'Route 148 · immediate upstream' },
      // Buckhams Bay is the local gauge for Constance Bay residents (MVCA, 2022+).
      // It sits at the NW (upstream) end of Lac Deschênes, with Aylmer mid-lake
      // and Britannia at the downstream/SE end. Buckhams reads ~10–30 cm higher
      // than Britannia during freshet — the two are routinely confused in local
      // media despite being 15+ km apart on the same lake.
      { id: 99001, name: 'Buckhams Bay', subtitle: 'Constance Bay · MVCA (~15 km upstream of Britannia)',
        source: 'mvca', tsId: 48242042, label: 'MVCA' },
      { id: 984,  name: 'Aylmer',      subtitle: 'Marina · Lac Deschenes (just upstream of Britannia)' },
      { id: 548,  name: 'Britannia',   subtitle: 'Ottawa · Lake Deschenes' },
      { id: 550,  name: 'Hull',        subtitle: 'Gatineau marina' },
      { id: 981,  name: 'Masson',      subtitle: 'Thurso area · traversier' },
      { id: 1264, name: 'Rigaud',      subtitle: 'Baie de Rigaud · downstream tail' }
    ];

    const charts = {};
    let lastDataTimestamp = null;
    let lastData = null;
    let lastYearRanges = {};
    let forecastData = null;     // ORRPB forecast snapshot — see loadForecast()
    let forecastLoading = null;
    let forecastFetchedAt = 0;   // perf clock of the last *successful* forecast load
    const FORECAST_TTL_MS = 30 * 60 * 1000;  // re-pull on long-open tabs every 30 min

    // ---- Page-level i18n + theme (persisted) ---------------------------------
    let pageLang = (typeof localStorage !== 'undefined' && localStorage.getItem('pageLang')) || 'en';
    const PAGE_STRINGS = {
      refresh:        { en: 'Refresh',                          fr: 'Actualiser' },
      map:            { en: 'Map',                              fr: 'Carte' },
      window:         { en: 'Window',                           fr: 'Période' },
      loading:        { en: 'Loading live data…',               fr: 'Chargement des données en direct…' },
      brief:          { en: 'Daily brief',                      fr: 'Bulletin du jour' },
      watch_points:   { en: 'Watch points',                     fr: 'Points de surveillance' },
      corridor:       { en: 'The corridor right now',           fr: 'Le corridor en ce moment' },
      corridor_sub:   { en: 'Change, not elevation, shows a pulse moving downstream. Colour only ever means flood state; arrows and bars are plain ink.',
                        fr: 'C\'est la variation, et non l\'élévation, qui révèle une onde se déplaçant vers l\'aval. La couleur indique uniquement l\'état de crue; les flèches et les barres sont à l\'encre neutre.' },
      corridor_orrpb: { en: 'The 14 stations of the bar chart posted to Facebook each morning. Source: ORRPB "Water levels at 24:00h in metres" table at <a href="https://www.ottawariver.ca/conditions/" target="_blank">ottawariver.ca/conditions</a>, scraped daily. Constance Bay (MVCA) and Below Carillon (CEHQ) come from the live feeds since ORRPB doesn\'t publish them.',
                        fr: 'Les 14 stations du graphique diffusé sur Facebook chaque matin. Source : table « Niveaux d\'eau à 24:00h en mètres » du CPRBO à <a href="https://www.ottawariver.ca/conditions/" target="_blank">ottawariver.ca/conditions</a>, extraction quotidienne. Constance Bay (CVRM) et Aval-Carillon (CEHQ) proviennent des flux en direct car le CPRBO ne les publie pas.' },
      property_t:     { en: 'Property thresholds & surveyed flood lines', fr: 'Seuils de la propriété et cotes de crue relevées' },
      forecast_t:     { en: 'Season-end forecast — chance of crossing each threshold', fr: 'Prévision de fin de saison — probabilité de franchir chaque seuil' },
      forecast_sub:   { en: "Bayesian posterior (V3): this winter's seasonal prior, continuously updated by the lake's day-to-day trajectory. The bar is today's chance the annual peak crosses each line; the tick marks where the pre-freshet prior started, so the bar visibly tightens as the season resolves.", fr: "Postérieure bayésienne (V3) : l'a priori saisonnier de l'hiver, mis à jour en continu par la trajectoire quotidienne du lac. La barre indique la probabilité actuelle que le pic annuel franchisse chaque cote; le repère montre l'a priori d'avant-crue, de sorte que la barre se resserre à mesure que la saison se précise." },
      freeze_h:       { en: 'Basin freeze & precipitation outlook', fr: 'Aperçu du gel et précipitations dans le bassin' },
      freeze_sub:     { en: 'Overnight lows + 48 h precipitation across the basin. The freeze-night counter uses upstream stations only (snowmelt signal); downstream rows are local forecast for visitors watching the lower-corridor gauges.',
                        fr: 'Minimums nocturnes + précipitations sur 48 h dans le bassin. Le compteur de nuits de gel n\'utilise que les stations en amont (signal de fonte); les stations en aval sont des prévisions locales pour les visiteurs surveillant les jauges du corridor inférieur.' },
      corr_live:      { en: 'Live gauges',   fr: 'Jauges en direct' },
      corr_orrpb_btn: { en: 'ORRPB 24:00 h', fr: 'CPRBO 24 h 00' },
      ops_all:        { en: 'Hydro-Québec generating stations', fr: 'Centrales d\'Hydro-Québec' },
      ops_all_sub:    { en: 'Upstream to downstream within each cascade. Release now, how it splits between turbines and spillway, and the same split over the selected window.',
                        fr: 'D\'amont en aval dans chaque cascade. Débit évacué actuel, sa répartition entre turbines et évacuateur, et la même répartition sur la période choisie.' },
      freeze_foot:    { en: 'Shaded cells are overnight lows below 0 °C. Last night is observed; later nights are forecast (Open-Meteo).',
                        fr: 'Les cases ombrées sont des minimums nocturnes sous 0 °C. La nuit dernière est observée; les nuits suivantes sont des prévisions (Open-Meteo).' }
    };
    // Inline bilingual text for markup built in JS: L('Level', 'Niveau').
    const L = (en, fr) => (pageLang === 'fr' ? fr : en);
    const MONTHS_SHORT = {
      en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
      fr: ['janv.','févr.','mars','avr.','mai','juin','juill.','août','sept.','oct.','nov.','déc.'],
    };
    function tPage(key) { return (PAGE_STRINGS[key] && PAGE_STRINGS[key][pageLang]) || (PAGE_STRINGS[key] && PAGE_STRINGS[key].en) || key; }

    function applyPageLang() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.dataset.i18n;
        if (!PAGE_STRINGS[k]) return;
        const val = tPage(k);
        // Allow markup (coloured legend chips, links) in i18n values when present.
        // Plain-text values still render identically via innerHTML.
        if (val.includes('<')) el.innerHTML = val;
        else                   el.textContent = val;
      });
      document.querySelectorAll('#page-lang-toggle button').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === pageLang);
        b.setAttribute('aria-pressed', String(b.dataset.lang === pageLang));
      });
      document.documentElement.lang = pageLang;
      // Station names in the corridor table follow the page language.
      if (lastData && typeof renderCorridor === 'function') renderCorridor();
      // Tables built in JS carry their own bilingual text; repaint the visible ones.
      if (typeof lastWeatherCache !== 'undefined' && lastWeatherCache) renderFreezePanel(lastWeatherCache);
      if (typeof refreshBrysonTurbine === 'function' && document.querySelector('.bryson-turbine')) refreshBrysonTurbine();
      if (document.querySelector('.tab-panel[data-tab="tributaries"].active') && typeof renderTributariesTab === 'function') renderTributariesTab();
      if (document.querySelector('.tab-panel[data-tab="operations"].active') && typeof renderOperationsTab === 'function') renderOperationsTab();
      // Keep the map drawer in sync.
      if (mapLang !== pageLang) {
        mapLang = pageLang;
        if (typeof applyMapLang === 'function') applyMapLang();
        if (mapInstance) renderMapMarkers();
      }
    }
    document.addEventListener('click', e => {
      const btn = e.target.closest('#page-lang-toggle button');
      if (!btn || btn.dataset.lang === pageLang) return;
      pageLang = btn.dataset.lang;
      try { localStorage.setItem('pageLang', pageLang); } catch (_) {}
      applyPageLang();
    });

    // ---- Theme (light / dark / OS-default) -----------------------------------
    function isDarkMode() {
      const t = document.documentElement.dataset.theme;
      if (t === 'light') return false;
      if (t === 'dark')  return true;
      return matchMedia('(prefers-color-scheme: dark)').matches;
    }
    const THEME_ICON_ATTRS = 'width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
    const THEME_ICONS = {
      moon: `<svg ${THEME_ICON_ATTRS}><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>`,
      sun:  `<svg ${THEME_ICON_ATTRS}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
    };
    function applyThemeIcon() {
      const btn = document.getElementById('theme-toggle');
      if (!btn) return;
      const dark = isDarkMode();
      btn.innerHTML = dark ? THEME_ICONS.sun : THEME_ICONS.moon;
      btn.setAttribute('aria-label', dark ? 'Light mode' : 'Dark mode');
    }
    // Phone header: refresh / language / theme / source collapse behind "More".
    function toggleHeaderMore(force) {
      const panel = document.getElementById('header-overflow');
      const btn = document.getElementById('more-btn');
      const open = typeof force === 'boolean' ? force : !panel.classList.contains('open');
      panel.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', String(open));
    }
    document.addEventListener('click', e => {
      if (!e.target.closest('#header-overflow, #more-btn')) toggleHeaderMore(false);
    });
    function toggleTheme() {
      const next = isDarkMode() ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch (_) {}
      applyThemeIcon();
      // Re-render anything that uses isDarkMode() at draw-time.
      if (lastData) {
        if (typeof renderHeroCharts === 'function') renderHeroCharts();
      }
      // The Reservoirs-tab storage chart keeps its own cache (not part of lastData).
      if (typeof renderStorageProxyChart === 'function' && typeof storageProxyCache !== 'undefined' && storageProxyCache) renderStorageProxyChart();
    }
    // Apply persisted theme on load (must happen before paint to avoid flash).
    (function bootTheme() {
      try {
        const t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (_) {}
    })();
    const historyCache = {}; // { "1195:168": [{valeur, date_prise_valeur}, ...] }
    let windowHours = 72;
    // Minimum y-axis span (m) for the hero station charts; see heroYBounds().
    const HERO_MIN_SPAN_M = 0.12;
    // Hero stations fed by a Hydro-Québec gauge at 1 cm resolution: the caption
    // and tooltip show cm for these. The others (WSC, Hydro Météo) publish mm.
    const HERO_CM_STATIONS = new Set([1195, BRYSON_AMONT_ID]);
    function heroLevelDecimals(stationId) { return HERO_CM_STATIONS.has(stationId) ? 2 : 3; }

    // Y-axis bounds for a hero chart, or null to let Chart.js fit the data.
    // Overlays widen the range first (Lac Coulonge historical peaks within
    // 0.5 m, the Bryson operating band), then the span is floored: the gauges
    // report in 1 cm steps, and on a quiet week the lake moves ~4 cm in three
    // days — an axis fitted to that turned each step into a quarter-height riser
    // (2026-10-24). The floor runs LAST so an overlay can't shrink the axis back
    // under it. Pure; covered by tests/test_dashboard_heroaxis.mjs.
    function heroYBounds(plotted, stationId) {
      const dataMin = Math.min(...plotted);
      const dataMax = Math.max(...plotted);
      let lo = dataMin, hi = dataMax, bounded = false;
      if (stationId === 1195) {
        const nearby = HISTORICAL_PEAKS.filter(p => p.level >= dataMin - 0.5 && p.level <= dataMax + 0.5);
        if (nearby.length) {
          lo = Math.min(dataMin, ...nearby.map(p => p.level)) - 0.03;
          hi = Math.max(dataMax, ...nearby.map(p => p.level)) + 0.03;
          bounded = true;
        }
      }
      if (stationId === BRYSON_AMONT_ID) {
        lo = Math.min(dataMin, BRYSON_BAND_LOW_M) - 0.05;
        hi = Math.max(dataMax, BRYSON_CEILING_M) + 0.05;
        bounded = true;
      }
      if (hi - lo < HERO_MIN_SPAN_M) {
        const mid = (hi + lo) / 2;
        lo = mid - HERO_MIN_SPAN_M / 2;
        hi = mid + HERO_MIN_SPAN_M / 2;
        bounded = true;
      }
      return bounded ? { suggestedMin: lo, suggestedMax: hi } : null;
    }

    // Vigilance emits UTC in naked ISO form (e.g. "2026-04-21T17:00:00" = 17:00 UTC = 13:00 EDT).
    function parseVigilance(iso) {
      if (!iso) return null;
      const s = String(iso);
      const withZ = (s.endsWith('Z') || /[+\-]\d{2}:?\d{2}$/.test(s)) ? s : s + 'Z';
      const d = new Date(withZ);
      return isNaN(d) ? null : d;
    }

    // open-meteo, requested with timezone=America/Toronto, emits naked ISO as Eastern wall-clock.
    function parseEastern(iso) {
      if (!iso) return null;
      const clean = String(iso).replace(/[Zz]|[+\-]\d{2}:?\d{2}$/, '');
      const naive = new Date(clean + 'Z');
      if (isNaN(naive)) return null;
      const fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Toronto', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
      const parts = Object.fromEntries(fmt.formatToParts(naive).map(p => [p.type, p.value]));
      const easternAsUTC = Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour % 24, +parts.minute, +parts.second);
      return new Date(naive.getTime() + (naive.getTime() - easternAsUTC));
    }

    function easternDateKey(d = new Date()) {
      const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Toronto', year: 'numeric', month: '2-digit', day: '2-digit' });
      const parts = Object.fromEntries(fmt.formatToParts(d).map(p => [p.type, p.value]));
      return `${parts.year}-${parts.month}-${parts.day}`;
    }

    // timeLabel formats a Vigilance timestamp (UTC) as Eastern wall-clock.
    function timeLabel(iso) {
      const d = parseVigilance(iso);
      if (!d) return '';
      const fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Toronto',
        day: 'numeric', month: 'short', hour: '2-digit', hour12: false
      });
      const parts = Object.fromEntries(fmt.formatToParts(d).map(p => [p.type, p.value]));
      return `${parts.day} ${parts.month} ${String(parts.hour).padStart(2, '0')}h`;
    }
    // "20 Apr" — Eastern calendar day of a Vigilance (UTC) timestamp.
    function dayMonth(iso) {
      const d = parseVigilance(iso);
      if (!d) return '';
      return new Intl.DateTimeFormat('en-GB', { timeZone: 'America/Toronto', day: 'numeric', month: 'short' }).format(d);
    }
    // Change over time is always ink: a glyph plus a signed number, never colour.
    function changeArrow(cm) { return cm > 0.5 ? '↑' : cm < -0.5 ? '↓' : '→'; }
    function signedCm(cm) {
      const r = Math.round(cm * 10) / 10;
      return `${r < 0 ? '−' : '+'}${Math.abs(r).toFixed(1)}`;
    }
    // Flood state is the one coloured scale, and it is always labelled.
    const ETAT_LABELS = { 6: 'Major', 5: 'Near major', 4: 'Moderate', 3: 'Minor', 2: 'Pre-alert', 1: 'Normal', 0: 'No threshold' };
    const ETAT_CHIP_CLASS = { 6: 's6', 5: 's4', 4: 's4', 3: 's3', 2: 's2', 1: 's1', 0: 's0' };
    const ETAT_LABELS_FR = { 6: 'Majeure', 5: 'Près de majeure', 4: 'Modérée', 3: 'Mineure', 2: 'Pré-alerte', 1: 'Normal', 0: 'Aucun seuil' };
    function stateChip(etat, synthetic) {
      const k = ETAT_LABELS[etat] ? etat : 0;
      const est = synthetic && k !== 0
        ? ` <span title="${L('No official threshold — estimated from the ORRPB / ECCC historical record', 'Aucun seuil officiel — estimé à partir des données historiques du CPRBO / ECCC')}">(est.)</span>` : '';
      return `<span class="chip ${ETAT_CHIP_CLASS[k]}">${L(ETAT_LABELS[k], ETAT_LABELS_FR[k])}${est}</span>`;
    }
    function formatTrend(t) {
      if (t === null || t === undefined || Math.abs(t) < 0.001) return { text: '<span class="arrow">→</span>', cls: 'flat' };
      if (t < 0) return { text: `<span class="arrow">↓</span> ${Math.abs(t*100).toFixed(1)} cm/h`, cls: 'down' };
      return { text: `<span class="arrow">↑</span> ${(t*100).toFixed(1)} cm/h`, cls: 'up' };
    }

    // Render a "Q: 4,866 m³/s" secondary row, or empty string if flow data missing.
    // Vigilance only surfaces discharge on a subset of stations (notably Britannia).
    function flowRow(metadata) {
      const q = metadata?.dern_valeur_deb;
      if (q === null || q === undefined) return '';
      const formatted = Math.round(q).toLocaleString('en-CA');
      const td = metadata.trend_deb;
      let trendHtml = '';
      if (td !== null && td !== undefined && Math.abs(td) >= 0.5) {
        const arrow = td > 0 ? '↑' : '↓';
        const cls = td > 0 ? 'up' : 'down';
        trendHtml = ` <span class="trend ${cls}"><span class="arrow">${arrow}</span> ${Math.abs(td).toFixed(0)} m³/s/h</span>`;
      }
      return `<div class="value-secondary">Q: ${formatted}<span class="unit">m³/s</span>${trendHtml}</div>`;
    }
    function ago(iso) {
      const d = parseVigilance(iso);
      if (!d) return '';
      const m = Math.round((Date.now() - d.getTime()) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return `${m} min ago`;
      if (m < 1440) return `${Math.round(m/60)} h ago`;
      return `${Math.floor(m/1440)} d ago`;
    }

    function etaToThreshold(current, target, ratePerHour) {
      if (current >= target) return null;
      if (!ratePerHour || ratePerHour <= 0.00005) return null;
      const hours = (target - current) / ratePerHour;
      if (hours > 72) return null;
      if (hours < 1) return `~${Math.max(5, Math.round(hours * 60 / 5) * 5)} min`;
      if (hours < 24) return `~${hours.toFixed(1)} h`;
      return `~${Math.floor(hours / 24)}d ${Math.round(hours % 24)}h`;
    }

    // Open-meteo accepts comma-separated lat/lon and returns an array, one entry
    // per location. One call covers all stations and avoids the per-IP rate limit
    // (HTTP 429) we were hitting with parallel single-location requests.
    async function fetchWeather() {
      const lats = FREEZE_STATIONS.map(s => s.lat).join(',');
      const lons = FREEZE_STATIONS.map(s => s.lon).join(',');
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&hourly=temperature_2m,precipitation&past_days=1&forecast_days=7&timezone=America%2FToronto`;
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error(`weather HTTP ${r.status}`);
      const j = await r.json();
      const items = Array.isArray(j) ? j : [j];
      return FREEZE_STATIONS.map((s, i) => ({ station: s, hourly: items[i]?.hourly }));
    }

    // Sum precipitation over the next N hours from now
    function next48hPrecip(hourly) {
      const now = Date.now();
      const horizon = now + 48 * 3600 * 1000;
      let total = 0;
      for (let i = 0; i < hourly.time.length; i++) {
        const t = parseEastern(hourly.time[i]);
        if (!t) continue;
        const ms = t.getTime();
        if (ms < now || ms > horizon) continue;
        const p = hourly.precipitation?.[i];
        if (p != null) total += p;
      }
      return total;
    }

    // Compute overnight lows keyed by the "morning" date (20:00 prev → 08:00 current)
    // open-meteo is requested with timezone=America/Toronto; parse string parts directly.
    function overnightLows(hourly) {
      const byMorning = {};
      for (let i = 0; i < hourly.time.length; i++) {
        const m = String(hourly.time[i]).match(/^(\d{4})-(\d{2})-(\d{2})T(\d{2})/);
        if (!m) continue;
        const hour = parseInt(m[4], 10);
        let morningKey;
        if (hour >= 20) {
          // roll to the next calendar day (Eastern)
          const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
          d.setUTCDate(d.getUTCDate() + 1);
          morningKey = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
        } else if (hour < 8) {
          morningKey = `${m[1]}-${m[2]}-${m[3]}`;
        } else continue;
        const temp = hourly.temperature_2m[i];
        if (temp == null) continue;
        if (!byMorning[morningKey] || temp < byMorning[morningKey].temp) {
          byMorning[morningKey] = { temp, time: hourly.time[i] };
        }
      }
      return Object.keys(byMorning).sort().map(date => ({ date, temp: byMorning[date].temp }));
    }

    function renderFreezePanel(weather) {
      const todayKey = easternDateKey();
      const grid = document.getElementById('freeze-grid');
      grid.classList.remove('skeleton');

      let basinFreezeNights = 0;  // nights where every station goes sub-zero
      let trackedNights = 0;
      const perStation = weather.map(({ station, hourly }) => {
        const lows = overnightLows(hourly);
        const week = lows.filter(l => {
          const diff = (new Date(l.date) - new Date(todayKey)) / 86400000;
          return diff >= 0 && diff <= 6;
        });
        return { station, nights: week, precipMm: next48hPrecip(hourly) };
      });

      // Tally basin-wide freezes across the 7-day window (last night + 6 forward).
      // Only upstream stations count — downstream stations rarely freeze in late
      // freshet and would always read "0 freeze nights" otherwise.
      const upstream = perStation.filter(p => (p.station.group || 'upstream') === 'upstream');
      const dates = Array.from(new Set(upstream.flatMap(p => p.nights.map(n => n.date)))).sort();
      for (const d of dates) {
        const diff = (new Date(d) - new Date(todayKey)) / 86400000;
        if (diff < 0 || diff > 6) continue;
        trackedNights++;
        const allSubZero = upstream.every(p => {
          const n = p.nights.find(x => x.date === d);
          return n && n.temp < 0;
        });
        if (allSubZero) basinFreezeNights++;
      }

      const sumBox = document.getElementById('freeze-summary');
      sumBox.className = 'freeze-lede';
      const tally = L(`<strong>${basinFreezeNights} of ${trackedNights}</strong> nights freeze basin-wide in the 7-day outlook.`,
        `<strong>${basinFreezeNights} nuits sur ${trackedNights}</strong> avec gel dans tout le bassin selon l'aperçu de 7 jours.`);
      sumBox.innerHTML = basinFreezeNights >= 3
        ? `${tally} ${L('Snowmelt paused or expected to pause — conditions favour a capped freshet.', 'Fonte interrompue ou sur le point de l\'être — conditions favorables à une crue plafonnée.')}`
        : basinFreezeNights >= 1
          ? `${tally} ${L('Partial melt slowdown — watch forecast for additional freezes.', 'Ralentissement partiel de la fonte — surveiller les prévisions pour d\'autres nuits de gel.')}`
          : `${tally} ${L('Active snowmelt ongoing or expected — monitor river rise rate closely.', 'Fonte active en cours ou prévue — surveiller de près le rythme de montée de la rivière.')}`;

      // One column per night, so a cold snap reads down the basin as well as
      // across the week. Columns come from every station's nights, not just the
      // first row's, so one station missing a night leaves a gap, not a shift.
      const MONTHS = MONTHS_SHORT[pageLang] || MONTHS_SHORT.en;
      const cols = Array.from(new Set(perStation.flatMap(p => p.nights.map(n => n.date)))).sort();
      const nightLabel = date => {
        const diff = (new Date(date) - new Date(todayKey)) / 86400000;
        const d = new Date(date);
        return diff === 0 ? L('Last night', 'Nuit dernière') : diff === 1 ? L('Tonight', 'Cette nuit') : diff === 2 ? L('Tomorrow', 'Demain') : `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`;
      };
      const degrees = t => {
        const r = Math.round(t);
        return `${t < 0 ? '−' : r > 0 ? '+' : ''}${Math.abs(r)}°`;
      };
      let lastGroup = null;
      const rows = perStation.map(({ station, nights, precipMm }) => {
        const groupKey = station.group || 'upstream';
        const groupHeader = lastGroup !== groupKey
          ? `<tr class="group"><th colspan="${cols.length + 2}" scope="colgroup">${groupKey === 'upstream' ? L('Upstream — drives freeze-night counter', 'Amont — alimente le compteur de nuits de gel') : L('Downstream — local forecast', 'Aval — prévisions locales')}</th></tr>`
          : '';
        lastGroup = groupKey;
        const cells = cols.map(date => {
          const n = nights.find(x => x.date === date);
          if (!n) return '<td class="night"><span>—</span></td>';
          return `<td class="night${n.temp < 0 ? ' freeze' : ''}"><span title="${n.temp.toFixed(1)} °C">${degrees(n.temp)}</span></td>`;
        }).join('');
        const role = station.note
          ? `<span class="corr-role has-note" title="${station.note}">${station.role}</span>`
          : `<span class="corr-role">${station.role}</span>`;
        return `${groupHeader}<tr>
          <td><span class="corr-name" style="cursor:default">${station.name}</span>${role}</td>
          ${cells}
          <td class="num${precipMm >= 20 ? ' heavy' : ''}" title="${L('Forecast precipitation, next 48 hours', 'Précipitations prévues, 48 prochaines heures')}">${precipMm.toFixed(1)}</td>
        </tr>`;
      }).join('');
      grid.innerHTML = `<table class="corr-table freeze-table">
        <thead><tr>
          <th scope="col">${L('Weather station', 'Station météo')}</th>
          ${cols.map(c => `<th scope="col" class="night">${nightLabel(c)}</th>`).join('')}
          <th scope="col" class="num">${L('48 h precip, mm', 'Précip. 48 h, mm')}</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    // Fire all regional fetches in parallel and return an array of per-station
    // promises that each resolve to {meta, ok, data, error}. Callers can attach a
    // per-station `.then` so cards render as each fetch settles, rather than
    // blocking on the slowest (MVCA/KiWIS in particular has an 8s timeout).
    function regionalFetchPromises() {
      return REGIONAL_STATIONS.map(s => {
        const p = s.source === 'mvca' ? fetchKiwisStation(s) : fetchStation(s.id);
        return p
          .then(data => ({ meta: s, ok: true, data }))
          .catch(err => ({ meta: s, ok: false, error: err?.message || 'error' }));
      });
    }

    // MVCA's Buckhams Bay gauge is published via Kisters KiWIS (same backend the
    // MVCA water-levels site uses). The endpoint is open and CORS-permissive, so
    // we fetch it directly from the browser. We shape the response to match
    // Vigilance's {metadata, readings} so the existing card / bar-chart / map
    // renderers don't need an MVCA-specific branch.
    const KIWIS_BASE = 'https://waterdata.quinteconservation.ca/KiWIS/KiWIS';
    // The KiWIS host occasionally goes unreachable (TCP black-hole, not a 5xx), in
    // which case a plain fetch() hangs until the browser's multi-minute network
    // timeout — leaving the Buckhams Bay card stuck on "Loading…". Cap it so the
    // card resolves to its unavailable state promptly.
    const KIWIS_TIMEOUT_MS = 8000;
    function latLonToWm(lat, lon) {
      const x = lon * Math.PI / 180 * 6378137;
      const y = Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) * 6378137;
      return [x, y];
    }
    async function fetchKiwisStation(spec) {
      const since = new Date(Date.now() - 72 * 3600 * 1000).toISOString();
      const url = `${KIWIS_BASE}?service=kisters&type=queryServices&request=getTimeseriesValues&datasource=0&format=json`
        + `&ts_id=${spec.tsId}&header=true&metadata=true`
        + '&md_returnfields=station_name,parametertype_name,station_latitude,station_longitude'
        + `&dateformat=UNIX&from=${encodeURIComponent(since)}`;
      let r;
      try {
        r = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(KIWIS_TIMEOUT_MS) });
      } catch (e) {
        throw new Error(e.name === 'TimeoutError' ? 'KiWIS timeout' : `KiWIS unreachable: ${e.message}`);
      }
      if (!r.ok) throw new Error(`KiWIS HTTP ${r.status}`);
      const arr = await r.json();
      if (!Array.isArray(arr) || !arr[0] || !Array.isArray(arr[0].data)) throw new Error('KiWIS empty');
      const ts = arr[0];
      const readings = ts.data
        .filter(row => Array.isArray(row) && row[1] != null && Number.isFinite(row[1]))
        .map(([t, v]) => ({ valeur: v, date_prise_valeur: new Date(t).toISOString() }));
      if (!readings.length) throw new Error('KiWIS no values');
      const last = readings[readings.length - 1];

      // Trend in m/h, derived from the last ~3 hours of readings (Vigilance's
      // trend_niv unit). Falls back to null if we don't have enough samples.
      const lastMs = new Date(last.date_prise_valeur).getTime();
      const recent = readings.filter(r => lastMs - new Date(r.date_prise_valeur).getTime() <= 3 * 3600 * 1000);
      let trend_niv = null;
      if (recent.length >= 2) {
        const a = recent[0], b = recent[recent.length - 1];
        const hours = (new Date(b.date_prise_valeur) - new Date(a.date_prise_valeur)) / 3600000;
        if (hours > 0) trend_niv = (b.valeur - a.valeur) / hours;
      }

      const lat = parseFloat(ts.station_latitude);
      const lon = parseFloat(ts.station_longitude);
      const geom = (Number.isFinite(lat) && Number.isFinite(lon))
        ? { type: 'Point', coordinates: latLonToWm(lat, lon) } : null;

      return {
        metadata: {
          id: spec.id,
          label: spec.label || 'MVCA',
          description: ts.station_name,
          plan_deau: 'Ottawa River',
          fournisseur_nom: 'MVCA',
          dern_valeur_niv: last.valeur,
          dern_valeur_deb: null,
          etat_niv: null,           // MVCA doesn't publish flood-state buckets
          trend_niv,
          trend_deb: null,
          derniere_lecture: last.date_prise_valeur,
          geom_p: geom
        },
        readings
      };
    }

    // WSC adapter: read from the local wsc_readings hypertable (populated hourly
    // by the wsc-ingest cronjob from wateroffice.ec.gc.ca). Reshapes into the
    // same { metadata, readings } envelope the rest of the dashboard expects
    // from Vigilance. Window matches the dashboard-wide windowHours so 7d / 30d
    // / 90d selections deepen the chart without re-pulling from the WSC API.
    async function fetchWscStation(spec) {
      const since = new Date(Date.now() - Math.max(72, windowHours) * 3600 * 1000).toISOString();
      // Use the hourly continuous-aggregate view rather than the raw 5-min table —
      // ~12× fewer rows, ~10× smaller payload, ~4× faster postgrest serialization.
      // TimescaleDB's real-time aggregation auto-combines materialized buckets
      // with newer raw data, so the latest hour is still up-to-date.
      const url = `/history/wsc_readings_hourly?station_code=eq.${spec.wscCode}`
        + `&time=gte.${since}&order=time.asc&select=time,level_m,flow_cms`;
      let r;
      try {
        r = await fetch(url, { cache: 'no-store' });
      } catch (e) {
        throw new Error(`WSC unreachable: ${e.message}`);
      }
      if (!r.ok) throw new Error(`WSC HTTP ${r.status}`);
      const rows = await r.json();
      if (!rows.length) throw new Error('WSC no rows in window');

      // Level series for the sparkline. We capture the most recent non-null
      // DISCHARGE separately so the Q line on the card works.
      const readings = [];
      let latestQ = null;
      for (const row of rows) {
        if (row.level_m != null && Number.isFinite(row.level_m)) {
          readings.push({ valeur: row.level_m, date_prise_valeur: row.time });
        }
        if (row.flow_cms != null && Number.isFinite(row.flow_cms)) {
          latestQ = row.flow_cms;
        }
      }
      if (!readings.length) throw new Error('WSC no level data');
      const last = readings[readings.length - 1];

      // 3-hour trend in m/h (matches Vigilance trend_niv units).
      const lastMs = new Date(last.date_prise_valeur).getTime();
      const recent = readings.filter(r => lastMs - new Date(r.date_prise_valeur).getTime() <= 3 * 3600 * 1000);
      let trend_niv = null;
      if (recent.length >= 2) {
        const a = recent[0], b = recent[recent.length - 1];
        const hours = (new Date(b.date_prise_valeur) - new Date(a.date_prise_valeur)) / 3600000;
        if (hours > 0) trend_niv = (b.valeur - a.valeur) / hours;
      }

      return {
        metadata: {
          id: spec.id,
          label: spec.wscCode,
          description: spec.name,
          plan_deau: spec.river || 'Ottawa basin tributary',
          fournisseur_nom: 'Water Survey of Canada',
          fournisseur_url: 'https://wateroffice.ec.gc.ca/',
          dern_valeur_niv: last.valeur,
          dern_valeur_deb: latestQ,
          etat_niv: null,
          etat_deb: null,
          etat_max: null,
          trend_niv,
          trend_deb: null,
          derniere_lecture: last.date_prise_valeur,
          date_prise_valeur: last.date_prise_valeur,
          geom_p: null,
        },
        readings,
      };
    }

    // Distinguish a true post-peak decline from "still rising / at session high."
    // A reading is "peaked" only when the window max is at least PEAK_AGE_MIN_HOURS
    // old AND the latest is at least PEAK_DROP_MIN_M below it. Below that bar we
    // haven't actually turned — the value is just a session high.
    const PEAK_AGE_MIN_HOURS = 6;
    const PEAK_DROP_MIN_M = 0.02;
    function classifyPeak(readings, latest) {
      if (!readings || !readings.length || !latest) {
        return { peak: latest || null, isPeaked: false, dropCm: 0 };
      }
      const peak = readings.reduce((p, v) => v.valeur > p.valeur ? v : p, readings[0]);
      const ageH = (new Date(latest.date_prise_valeur) - new Date(peak.date_prise_valeur)) / 3600000;
      const drop = peak.valeur - latest.valeur;
      return {
        peak,
        isPeaked: ageH >= PEAK_AGE_MIN_HOURS && drop >= PEAK_DROP_MIN_M,
        dropCm: drop * 100,
      };
    }

    // ---- ORRPB historical peaks (from "Know Your Levels" PDF, 2025-05-06) ---------
    // Source: ottawa-river-vigilance/data/orrpb-historic-peaks-1972-2025.csv
    // datumOffset = MASL_value - API_gauge_value. Quebec stations report MASL
    // natively (offset 0); Ontario stations via ECCC mirror use an "assumed datum"
    // 100 m below MASL. Stations not listed here aren't in the ORRPB PDF.
    const ORRPB_HISTORIC_PEAKS = {
      // Temiscaming village gauge — ECCC 02JE025 uses an assumed datum referenced
      // to lake-floor; offset to MASL ≈ 173.65 (calibrated against Contributor B's
      // 2026-04-29 reading of 178.65 m vs. the gauge's 5.00 raw value). No ORRPB
      // peak data published for this gauge.
      951:  { datumOffset: 173.65, peaks: {} },
      545:  { datumOffset: 100, peaks: { 2017: 153.95, 2019: 155.55, 2023: 154.69 } }, // Mattawa
      548:  { datumOffset: 0,   peaks: { 2017: 60.44,  2019: 60.68,  2023: 60.35  } }, // Britannia
      // Buckhams Bay (MVCA, CGVD28) — datum matches MASL; only operational since
      // 2022 so no 2017/2019 peaks. 2023 freshet peak from MVCA KiWIS: 60.40 m
      // (vs. Britannia's 60.35 m the same year — the two stations are close but
      // not identical, hence the value of tracking both).
      99001:{ datumOffset: 0,   peaks: { 2023: 60.40 } }, // Buckhams Bay (MVCA)
      550:  { datumOffset: 0,   peaks: { 2017: 45.20,  2019: 45.17,  2023: 44.68  } }, // Hull
      981:  { datumOffset: 0,   peaks: { 2017: 43.69,  2019: 43.66,  2023: 43.19  } }, // Masson/Thurso
      1195: { datumOffset: 0,   peaks: { 2017: 108.52, 2019: 109.17, 2023: 108.77 } }, // Lac Coulonge
      1264: { datumOffset: 0,   peaks: { 2017: 25.11,  2019: 25.11,  2023: 24.71  } }  // Rigaud (below Carillon)
    };

    // Convert a raw API gauge reading to MASL using the per-station datum offset.
    // Stations whose Vigilance label reports MASL natively have offset 0.
    function displayLevel(meta, raw) {
      if (raw == null) return null;
      return raw + (ORRPB_HISTORIC_PEAKS[meta?.id]?.datumOffset || 0);
    }

    // Returns { etat, context } where etat is 4-6 if current ≥ at least one
    // reference year, null if below all three; context is a human-readable label
    // like "above 2023, 81 cm below 2019 record".
    function getOrrpbContext(meta) {
      const o = ORRPB_HISTORIC_PEAKS[meta?.id];
      if (!o || meta.dern_valeur_niv == null) return null;
      if (!o.peaks || Object.keys(o.peaks).length === 0) return null;
      const masl = meta.dern_valeur_niv + o.datumOffset;
      const refs = Object.entries(o.peaks)
        .map(([year, level]) => ({ year: Number(year), level }))
        .sort((a, b) => b.level - a.level); // descending
      const recordYear = refs[0];
      // refs may have <3 entries (e.g. MVCA-only stations with limited history),
      // so each rung is guarded.
      let etat = null;
      if      (refs[0] && masl >= refs[0].level) etat = 6;
      else if (refs[1] && masl >= refs[1].level) etat = 5;
      else if (refs[2] && masl >= refs[2].level) etat = 4;
      // Context label
      let context;
      if (etat === 6) {
        const dCm = Math.round((masl - refs[0].level) * 100);
        context = dCm < 5 ? `at ${recordYear.year} record` : `${dCm} cm above ${recordYear.year} record`;
      } else if (etat === 5 || etat === 4) {
        const lower = refs.filter(r => masl >= r.level).slice(-1)[0];
        const higher = refs.filter(r => r.level > masl).slice(-1)[0];
        const dHigher = Math.round((higher.level - masl) * 100);
        context = `above ${lower.year}, ${dHigher} cm below ${higher.year}`;
      } else {
        const lowest = refs[refs.length - 1];
        const dCm = Math.round((lowest.level - masl) * 100);
        context = `${dCm} cm below ${lowest.year} freshet peak`;
      }
      return { etat, context };
    }

    // ---- ECCC HYDAT fallback for Ontario stations without Vigilance thresholds ----
    // Vigilance returns etat_niv=0 for Ontario stations it mirrors but doesn't
    // classify (Mattawa is the obvious case). We fetch the station's historical
    // annual peaks from ECCC and bucket the current reading by percentile —
    // the same intuition as USGS's "much above normal" classification.
    const eccPeakCache = {};
    const WSC_ID_PATTERN = /^\d{2}[A-Z]{2}\d{3}$/;

    async function ensureEcccPeaks(wscId) {
      if (eccPeakCache[wscId] !== undefined) return eccPeakCache[wscId];
      try {
        const url = `https://api.weather.gc.ca/collections/hydrometric-annual-statistics/items?STATION_NUMBER=${wscId}&limit=200&f=json`;
        const r = await fetch(url);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        const peaks = (data.features || [])
          .filter(f => f.properties?.DATA_TYPE_EN === 'Water Level')
          .map(f => f.properties.MAX_VALUE)
          .filter(Number.isFinite)
          .sort((a, b) => b - a);
        eccPeakCache[wscId] = peaks.length ? peaks : null;
      } catch (e) {
        console.warn(`ECCC peaks ${wscId}: ${e.message}`);
        eccPeakCache[wscId] = null;
      }
      return eccPeakCache[wscId];
    }

    function getEffectiveEtat(meta) {
      // Vigilance's official etat wins when it's defined (>0).
      if (meta?.etat_niv != null && meta.etat_niv > 0) return meta.etat_niv;
      // Then ORRPB-published reference years (PDF) — directly tied to memorable floods.
      const orrpb = getOrrpbContext(meta);
      if (orrpb && orrpb.etat) return orrpb.etat;
      // Finally, ECCC long-record percentile fallback.
      if (!meta?.label || !WSC_ID_PATTERN.test(meta.label)) return meta?.etat_niv;
      if (meta.dern_valeur_niv == null) return meta.etat_niv;
      const peaks = eccPeakCache[meta.label];
      if (!peaks) return meta.etat_niv;
      const above = peaks.filter(p => meta.dern_valeur_niv >= p).length;
      const pctl = (above / peaks.length) * 100;
      if (pctl >= 99) return 6;
      if (pctl >= 95) return 5;
      if (pctl >= 90) return 4;
      if (pctl >= 75) return 3;
      if (pctl >= 50) return 2;
      return 1;
    }

    function isEffectiveEtatSynthetic(meta) {
      if (meta?.etat_niv != null && meta.etat_niv > 0) return false;
      const orrpb = getOrrpbContext(meta);
      if (orrpb && orrpb.etat) return true;
      return !!meta?.label && WSC_ID_PATTERN.test(meta.label) && !!eccPeakCache[meta.label];
    }

    async function precomputeEcccPeaks(metas) {
      const ids = [...new Set(metas
        .filter(m => m && (m.etat_niv == null || m.etat_niv === 0) && m.label && WSC_ID_PATTERN.test(m.label))
        .map(m => m.label))];
      await Promise.all(ids.map(ensureEcccPeaks));
    }

    // Vigilance station -> cluster-side same-gauge source, used to keep each card
    // live independent of Quebec MSP's public Vigilance feed.
    //
    // Two modes (see `onStall`):
    //   - default       : the cluster source is PRIMARY for its window and
    //                      Vigilance backfills only the older history. Used for the
    //                      WSC-native regional gauges, where WSC is the canonical
    //                      source anyway.
    //   - onStall: true : Vigilance (fetched from the inedit primary host) is
    //                      PRIMARY; the cluster source is spliced in ONLY when the
    //                      Vigilance series goes stale, so a Vigilance regression
    //                      can't blank the card. Lac Coulonge runs this way: the
    //                      inedit-primary ingester is reliable, and cluster-primary
    //                      caps the card at the HQ open-data batch cadence (seen
    //                      2026-07-06: card frozen at 08h EDT through a 6 h HQ
    //                      batch lag, plus a bogus 0.00 reading Vigilance skipped).
    //
    // Datum verified ±0.02 m at overlapping timestamps for every mapping below
    // (probed 2026-05-29). The dashboard's per-station datumOffset applies
    // after the splice, so display values stay consistent.
    const FALLBACK_SOURCES = {
      // Vigilance ID -> { path, key, value, note, onStall? }
      //   path:    PostgREST endpoint (under /history/)
      //   key:     query param name that selects the station
      //   value:   station id within that endpoint
      //   note:    human note for logs
      //   onStall: Vigilance-primary; splice this source only when Vigilance stale
      1195: { path: 'dam_levels',   key: 'station_id',   value: '1-2983',  note: 'HQ Fort Coulonge — property gauge', onStall: true },
      545:  { path: 'wsc_readings', key: 'station_code', value: '02JE013', note: 'WSC Mattawa, ON (Otto Holden tailwater)' },
      951:  { path: 'wsc_readings', key: 'station_code', value: '02JE025', note: 'WSC Témiscaming' },
      548:  { path: 'wsc_readings', key: 'station_code', value: '02KF005', note: 'WSC Britannia / Ottawa' },
      550:  { path: 'wsc_readings', key: 'station_code', value: '02LA015', note: 'WSC Hull marina — Carillon directive trigger' },
      [BRYSON_AMONT_ID]: { path: 'dam_levels', key: 'station_id', value: '1-2964', note: 'HQ Bryson headpond / amont' },
    };
    // Last-resort tier for EVERY Vigilance station (see fetchStation): when the
    // live feed and any explicit fallback above both come up empty, splice
    // last-known rows from the cluster's own Vigilance mirror (river_readings).
    // Same upstream data, so it only matters when the public Vigilance API itself
    // breaks — e.g. the 2026-08-10 MSP platform migration, which nulled
    // valeurs_niv platform-wide and blanked every Vigilance-native card.
    // 240 h bound: a gauge dark longer than that (Rigaud 1264 since Jul 31)
    // honestly stays "No recent data" instead of resurrecting ancient readings.
    const MIRROR_LOOKBACK_H = 240;
    // A live series shorter than this can't draw a usable trace — `showPoints`
    // already treats <=12 values as too sparse to line up, and a single point is
    // just a dot. Below this the mirror tier fills in the surrounding history
    // rather than standing aside (see fetchStation).
    const MIRROR_MIN_POINTS = 12;
    const FALLBACK_LOOKBACK_H = 72;
    // A Vigilance series is "stale" if its most recent point is older than this.
    // Vigilance/HQ both publish ~hourly, so 6 h tolerates a few missed cycles
    // before the onStall fallback reaches for the cluster source.
    const FALLBACK_STALE_H = 6;

    function latestReadingMs(d) {
      const latest = d?.readings?.length ? d.readings[d.readings.length - 1] : null;
      return latest ? (parseVigilance(latest.date_prise_valeur)?.getTime() || 0) : 0;
    }
    function isSeriesStale(d) {
      if (!d?.readings?.length) return true;
      return (Date.now() - latestReadingMs(d)) > FALLBACK_STALE_H * 3600 * 1000;
    }
    // Hydro Météo local heroes are "live" only when the hourly series is fresh
    // AND Vigilance is publishing a flood state (null etat_niv = deactivated).
    function isLocalHeroLive(id) {
      const d = lastData?.[id];
      if (isSeriesStale(d)) return false;
      return d.metadata?.etat_niv != null;
    }
    function localHeroesLive() {
      return LOCAL_HYDRO_METEO_IDS.every(isLocalHeroLive);
    }
    function heroStationIds() {
      return localHeroesLive() ? [1279, 1195, 1004] : [545, 1195, BRYSON_AMONT_ID];
    }
    function destroyHeroCharts() {
      for (const id of Object.keys(charts)) {
        try { charts[id].destroy(); } catch (_) {}
        delete charts[id];
      }
    }
    function bindHeroCharts() {
      const live = localHeroesLive();
      const next = live
        ? { 1279: { ...HERO_SLOTS.upstream }, 1195: { ...HERO_SLOTS.lake }, 1004: { ...HERO_SLOTS.third } }
        : { 545: { ...HERO_SLOTS.upstream }, 1195: { ...HERO_SLOTS.lake }, [BRYSON_AMONT_ID]: { ...HERO_SLOTS.third } };
      const prevKeys = Object.keys(STATIONS).join(',');
      const nextKeys = Object.keys(next).join(',');
      if (prevKeys !== nextKeys) destroyHeroCharts();
      STATIONS = next;
    }
    function renderHeroCharts() {
      bindHeroCharts();
      updateChartTitles();
      for (const id of heroStationIds()) renderWindow(id);
      renderLocalGaugeStrip();
    }

    function trendFromReadings(readings) {
      if (!readings || readings.length < 2) return null;
      const last = readings[readings.length - 1];
      const lastMs = parseVigilance(last.date_prise_valeur)?.getTime() || 0;
      const target = lastMs - 3 * 3600 * 1000;
      let best = readings[0], bestDiff = Infinity;
      for (const r of readings) {
        const t = parseVigilance(r.date_prise_valeur)?.getTime() || 0;
        const d = Math.abs(t - target);
        if (d < bestDiff) { best = r; bestDiff = d; }
      }
      const dtH = (lastMs - (parseVigilance(best.date_prise_valeur)?.getTime() || 0)) / 3600000;
      if (dtH < 0.5) return null;
      return (last.valeur - best.valeur) / dtH;
    }

    async function fetchBrysonAmont(hours = FALLBACK_LOOKBACK_H) {
      const since = new Date(Date.now() - hours * 3600 * 1000).toISOString();
      const r = await fetch(`/history/dam_levels?station_id=eq.${BRYSON_AMONT_ID}&time=gte.${since}&order=time.asc&select=time,level_m`, { cache: 'no-store' });
      if (!r.ok) throw new Error(`Bryson amont HTTP ${r.status}`);
      const rows = (await r.json()).filter(row => row.level_m != null && row.level_m > 0);
      const readings = rows.map(row => ({ valeur: row.level_m, date_prise_valeur: row.time, _source: 'dam_levels' }));
      const last = readings[readings.length - 1];
      return {
        metadata: {
          id: BRYSON_AMONT_ID,
          label: '1-2964',
          description: 'Bryson generating-station headpond (amont) — dam pond, not Lac Coulonge',
          dern_valeur_niv: last ? last.valeur : null,
          date_prise_valeur: last ? last.date_prise_valeur : null,
          etat_niv: null,
          trend_niv: trendFromReadings(readings),
          seuils_niv: [],
          fournisseur_nom: 'Hydro-Québec',
        },
        readings
      };
    }

    async function fetchYearRangeDamLevel(stationId) {
      const since = new Date(Date.UTC(new Date().getUTCFullYear(), 0, 1)).toISOString();
      const q = dir => `/history/dam_levels?station_id=eq.${stationId}&time=gte.${since}`
        + `&level_m=gt.0&order=level_m.${dir}&limit=1&select=time,level_m`;
      const [hiR, loR] = await Promise.all([
        fetch(q('desc'), { cache: 'no-store' }),
        fetch(q('asc'), { cache: 'no-store' }),
      ]);
      if (!hiR.ok || !loR.ok) throw new Error(`year-range dam_levels HTTP ${hiR.status}/${loR.status}`);
      const [hi, lo] = await Promise.all([hiR.json(), loR.json()]);
      const row = rows => rows.length
        ? { valeur: rows[0].level_m, date_prise_valeur: rows[0].time } : null;
      const max = row(hi), min = row(lo);
      if (!max || !min) return null;
      return { max, min, wholeYear: true };
    }

    function hydroMeteoDeactivatedChip(id) {
      if (!LOCAL_HYDRO_METEO_IDS.includes(Number(id)) && !LOCAL_HYDRO_METEO_IDS.includes(id)) return '';
      // Same deactivated signal as isLocalHeroLive / the last-known strip:
      // stale series OR Vigilance publishing null etat_niv.
      if (isLocalHeroLive(id)) return '';
      return `<span class="badge" style="background:var(--amber-light);color:var(--amber)">Hydro Météo deactivated</span>`;
    }

    function readingsInWindow(readings, hours) {
      if (!readings?.length) return [];
      const sinceMs = Date.now() - hours * 3600 * 1000;
      const inWin = readings.filter(v => (parseVigilance(v.date_prise_valeur)?.getTime() || 0) >= sinceMs);
      return inWin.length ? inWin : readings.slice(-Math.max(1, hours));
    }

    async function fetchStation(id) {
      const [mdR, rdR] = await Promise.all([
        fetch(`${API_BASE}/station_details_metadata_api?id=eq.${id}`, { cache: 'no-store' }),
        fetch(`${API_BASE}/station_details_readings_api?id=eq.${id}`, { cache: 'no-store' })
      ]);
      if (!mdR.ok || !rdR.ok) throw new Error(`HTTP ${mdR.status}/${rdR.status}`);
      const [md, rd] = await Promise.all([mdR.json(), rdR.json()]);
      // 200-with-[] (station delisted) and per-entry null valeur are both real
      // outage shapes from the 2026-08 MSP migration — never assume rd[0] or a
      // reading's valeur exists. Null-valeur entries would defeat the downstream
      // !latest guards while carrying fresh timestamps that suppress the splice.
      let readings = (rd[0]?.valeurs_niv || []).filter(v => v && v.valeur != null);

      // Same-gauge cluster source (HQ open-data or WSC). Behaviour depends on the
      // entry's `onStall` flag (see FALLBACK_SOURCES). Datum verified ±0.02 m at
      // overlapping timestamps; the per-station datumOffset applies after.
      const fb = FALLBACK_SOURCES[id];
      if (fb) {
        // For onStall sources Vigilance is primary, so only reach for the cluster
        // source when the Vigilance series has actually gone stale — otherwise skip
        // the request entirely and serve pure Vigilance.
        const latestVigMs = readings.reduce(
          (m, v) => Math.max(m, parseVigilance(v.date_prise_valeur)?.getTime() || 0), 0);
        const vigStale = (Date.now() - latestVigMs) > FALLBACK_STALE_H * 3600 * 1000;
        if (!fb.onStall || vigStale) {
          try {
            const since = new Date(Date.now() - FALLBACK_LOOKBACK_H * 3600 * 1000).toISOString();
            const r = await fetch(`/history/${fb.path}?${fb.key}=eq.${fb.value}&time=gte.${since}&order=time.asc&select=time,level_m`, { cache: 'no-store' });
            if (r.ok) {
              const rows = await r.json();
              // level_m > 0 also drops upstream glitch readings (HQ published a
              // literal 0.00 for 1-2983 on 2026-07-06); every mapped gauge is an
              // elevation far above 0 m, so 0/negative is never a real level.
              const cluster = rows
                .filter(row => row.level_m != null && row.level_m > 0)
                .map(row => ({ valeur: row.level_m, date_prise_valeur: row.time, _source: fb.path }));
              if (cluster.length) {
                if (fb.onStall) {
                  // Vigilance stale: keep the full Vigilance series and append only
                  // the cluster rows newer than the last Vigilance point, so the
                  // card stays current without overwriting good Vigilance history.
                  const newer = cluster.filter(c => (parseVigilance(c.date_prise_valeur)?.getTime() || 0) > latestVigMs);
                  if (newer.length) {
                    readings = readings.concat(newer);
                    console.info(`Vigilance ${id} stale (>${FALLBACK_STALE_H}h); spliced ${newer.length} rows from ${fb.note}`);
                  }
                } else {
                  // Cluster owns its window; keep only Vigilance points older than
                  // the earliest cluster row so a stale Vigilance value never leaks.
                  const clusterStartMs = parseVigilance(cluster[0].date_prise_valeur)?.getTime() || 0;
                  const older = readings.filter(v => (parseVigilance(v.date_prise_valeur)?.getTime() || 0) < clusterStartMs);
                  readings = older.concat(cluster);
                }
              }
            }
          } catch (e) {
            // Best-effort; never break on the cluster source.
            console.warn(`Cluster source for ${id} (${fb.note}) failed:`, e);
          }
        }
      }

      // Last-resort mirror tier (see MIRROR_LOOKBACK_H): the live feed can't carry
      // the card on its own — empty, or too short to plot — and the explicit
      // fallback is either absent or dry (Temiscaming's WSC code had no ingested
      // rows; Aylmer/Masson have no same-gauge source at all).
      //
      // Gating this on `!readings.length` alone was a bug (found 2026-09-08): a
      // provider returning from a multi-day outage republishes ONE point, which is
      // non-empty and so suppressed the splice entirely. The card went from a full
      // mirror-served trace to a bare dot at the moment upstream *recovered* —
      // Hydro Météo's eight stations (Waltham, Coulonge River, Aylmer, Masson,
      // Rigaud, 982, 983, 1007), dark Sep 1-8, all did this in the same tick. So
      // treat "degenerate" like "empty", and MERGE rather than replace so the fresh
      // live tip survives the splice instead of being overwritten by mirror rows.
      if (readings.length < MIRROR_MIN_POINTS) {
        try {
          const since = new Date(Date.now() - MIRROR_LOOKBACK_H * 3600 * 1000).toISOString();
          const r = await fetch(`/history/river_readings?station_id=eq.${id}&time=gte.${since}&order=time.asc&select=time,level_m`, { cache: 'no-store' });
          if (r.ok) {
            const rows = (await r.json()).filter(row => row.level_m != null && row.level_m > 0);
            if (rows.length) {
              // Union by timestamp. The mirror is our own ingest of this same
              // Vigilance series, so the two agree on the hours they share; live
              // wins a collision as the authoritative publisher (it can carry a
              // correction to a value we ingested earlier). Sorted ascending —
              // every consumer downstream reads the tail as the newest reading.
              const byMs = new Map();
              for (const row of rows) {
                const ms = parseVigilance(row.time)?.getTime();
                if (ms) byMs.set(ms, { valeur: row.level_m, date_prise_valeur: row.time, _source: 'river_readings' });
              }
              for (const v of readings) {
                const ms = parseVigilance(v.date_prise_valeur)?.getTime();
                if (ms) byMs.set(ms, v);
              }
              const merged = [...byMs.keys()].sort((a, b) => a - b).map(ms => byMs.get(ms));
              console.info(`Live feed for ${id} had ${readings.length} point(s); merged with the cluster Vigilance mirror to ${merged.length} rows`);
              readings = merged;
            }
          }
        } catch (e) {
          console.warn(`Mirror tier for ${id} failed:`, e);
        }
      }

      return { metadata: md[0] || null, readings };
    }

    function renderStatus(type, message) {
      const el = document.getElementById('status');
      const cls = type === 'live' ? 'live' : type === 'stale' ? 'stale' : 'error';
      el.innerHTML = `<span class="dot ${cls}"></span><span>${message}</span>`;
    }

    function liveStatusHTML(iso) {
      return `Live · <span class="status-long">Lac Coulonge </span>read ${ago(iso)}<span class="status-long"> · refreshes every 10 min</span>`;
    }

    function renderBanner(type, html) {
      const b = document.getElementById('banner');
      if (!html) { b.classList.remove('show'); return; }
      b.className = `banner show ${type}`;
      b.innerHTML = html;
    }

    // "ORRPB down? data here is direct-from-source" banner. ORRPB's public site
    // periodically goes down or stops updating (e.g. the June 2026 weekend outage).
    // This dashboard pulls levels & flows DIRECT from the source agencies
    // (MVCA / WSC / Québec Vigilance / Hydro-Québec), so it stays current
    // regardless — surface that reassurance whenever our mirror of ORRPB's OWN
    // daily series falls behind. Fires only when the latest ORRPB row is >48 h old
    // (ORRPB publishes ~daily, so 48 h clears the normal afternoon-publish lag and
    // avoids false positives). Best-effort; never blocks the dashboard.
    async function checkOrrpbStatus() {
      try {
        const r = await fetch('/history/orrpb_river_levels?order=time.desc&limit=1', { cache: 'no-store' });
        if (!r.ok) return;
        const rows = await r.json();
        const t = rows && rows[0] && rows[0].time;
        if (!t) return;
        const ageH = (Date.now() - new Date(t).getTime()) / 3600000;
        if (ageH > 48) {
          const d = new Date(t).toLocaleDateString('en-CA', { month: 'short', day: 'numeric', timeZone: 'America/Toronto' });
          renderBanner('', `<strong>ORRPB's data feed looks delayed</strong> — their latest update is ${d}. The levels and flows shown here come <strong>direct from the source agencies</strong> (MVCA, Water Survey of Canada, Québec Vigilance, Hydro-Québec) and stay current regardless of ORRPB's site.`);
        }
      } catch (_) { /* best-effort */ }
    }

    function brysonCeilingDelta(levelM) {
      const aboveCm = Math.round((levelM - BRYSON_CEILING_M) * 100);
      const cm = Math.abs(aboveCm);
      const dir = aboveCm >= 0 ? 'above' : 'below';
      return {
        aboveCm,
        text: `${cm} cm ${dir} ${BRYSON_CEILING_M.toFixed(2)} m operating ceiling`,
      };
    }

    // Bryson's turbine state for its watch point: whether the units are running,
    // and since when. Three one-row queries rather than the year-long log the Dam
    // operations tab reads, because this runs on every Overview load.
    let brysonTurbine = null;   // { off, sinceMs, at }
    async function refreshBrysonTurbine() {
      if (!brysonTurbine || Date.now() - brysonTurbine.at > 10 * 60 * 1000) {
        try {
          const q = f => fetch(`/history/dam_releases?site_id=eq.3-46&turbined_cms=${f}&order=time.desc&limit=1&select=time,turbined_cms`, { cache: 'no-store' })
            .then(r => r.ok ? r.json() : []).then(rows => rows[0] || null);
          const [latest, lastOn, lastOff] = await Promise.all([q('not.is.null'), q(`gte.${TURBINE_OFF_CMS}`), q(`lt.${TURBINE_OFF_CMS}`)]);
          if (latest) {
            const off = latest.turbined_cms < TURBINE_OFF_CMS;
            // The current run began the hour after the last reading in the other state.
            const other = off ? lastOn : lastOff;
            brysonTurbine = { off, at: Date.now(), nowMs: new Date(latest.time).getTime(),
              sinceMs: other ? new Date(other.time).getTime() + 3600000 : null };
          }
        } catch (e) { console.warn(`Bryson turbine state: ${e.message}`); }
      }
      document.querySelectorAll('.bryson-turbine').forEach(el => { el.innerHTML = brysonTurbineText(); });
    }
    function brysonTurbineText() {
      const t = brysonTurbine;
      if (!t) return '';
      const dur = t.sinceMs ? ` ${L('for', 'depuis')} ${opDuration(t.nowMs - t.sinceMs + 3600000)}` : '';
      const link = `<a href="#operations">${L('Turbine log', 'Journal des turbines')}</a>.`;
      return t.off
        ? `<strong>${L('Turbines off', 'Turbines à l\'arrêt')}${dur}</strong>${L(', all flow over the spillway.', ', tout le débit passe par l\'évacuateur.')} ${link}`
        : `${L('Turbines running', 'Turbines en marche')}${dur}. ${link}`;
    }

    // Watch points: the supporting gauges under the Lac Coulonge hero.
    function renderCards(data, yearRanges = {}) {
      const container = document.getElementById('cards');
      // Matches the 72h charts: local Hydro Météo pair when live, otherwise
      // Mattawa (upstream) + Bryson headpond (downstream) so the row fills.
      const items = localHeroesLive()
        ? [
            { id: 1279, name: 'Waltham',        subtitle: 'Ottawa River · upstream (Route 148)' },
            { id: 1004, name: 'Coulonge River', subtitle: 'Route 148 bridge · unregulated' },
            { id: 545,  name: 'Mattawa',        subtitle: 'Otto Holden tailwater · earliest upstream pulse' },
          ]
        : [
            { id: 545, name: 'Mattawa', subtitle: 'Otto Holden tailwater · earliest upstream pulse' },
            { id: BRYSON_AMONT_ID, name: 'Bryson headpond', subtitle: 'Dam pond at Bryson, not the lake' },
          ];
      const cardHTML = (item) => {
        const d = data[item.id];
        const m = d.metadata;
        const latest = d.readings[d.readings.length - 1];
        const idChip = m?.label ? `<span class="station-id">${m.label}</span>` : '';
        // No readings (the 2026-08 MSP outage nulled valeurs_niv and no fallback
        // source had rows) or no metadata (200-with-[] delisting; the card body
        // needs m for etat/label): render a graceful no-data card. Without this,
        // the null derefs below throw, which aborts fetchData and error-banners
        // the whole page.
        if (!latest || !m) {
          return `
          <article class="card watch" data-station-id="${item.id}">
            <div class="watch-head"><h3>${item.name}${idChip}</h3></div>
            <p class="watch-sub">${item.subtitle}</p>
            <p class="watch-note">No recent data published — source feed outage</p>
          </article>
          `;
        }
        const c24 = changeCm(d.readings, 24);
        const change = c24 == null ? ''
          : Math.abs(c24) <= 0.5 ? '→ steady'
          : `${changeArrow(c24)} ${signedCm(c24)} cm / 24 h`;
        let chip, note;
        if (item.id === BRYSON_AMONT_ID) {
          const { aboveCm } = brysonCeilingDelta(latest.valeur);
          const side = aboveCm >= 0 ? 'above' : 'below';
          chip = `<span class="chip ${aboveCm >= 0 ? 's2' : 's1'}">${aboveCm >= 0 ? 'Above ceiling' : 'Below ceiling'}</span>`;
          note = `${Math.abs(aboveCm)} cm ${side} the ${BRYSON_CEILING_M.toFixed(2)} m operating ceiling. <span class="bryson-turbine">${brysonTurbineText()}</span>`;
        } else {
          chip = stateChip(getEffectiveEtat(m), isEffectiveEtatSynthetic(m));
          const windowPk = classifyPeak(d.readings, latest);
          // Prefer the season-to-date peak from history if it's higher than the
          // live buffer's max. A higher season peak is by definition a true past
          // peak (older than the 72h live buffer), so it always counts as "peaked."
          const yearMax = yearRanges[item.id] && yearRanges[item.id].max;
          const yearWins = yearMax && yearMax.valeur > windowPk.peak.valeur;
          const peak = yearWins ? yearMax : windowPk.peak;
          const dropCm = Math.round((peak.valeur - latest.valeur) * 100);
          const peakWord = yearWins ? 'high' : (windowPk.isPeaked ? 'peak' : 'high so far');
          note = dropCm >= 1 ? `${dropCm} cm below its ${dayMonth(peak.date_prise_valeur)} ${peakWord}.` : '';
          const orrpb = getOrrpbContext(m);
          if (orrpb) note += ` ORRPB ref: ${orrpb.context}.`;
        }
        return `
          <article class="card watch" data-station-id="${item.id}">
            <div class="watch-head"><h3>${item.name}${idChip}</h3>${chip}</div>
            <p class="watch-sub">${item.subtitle}</p>
            <div class="watch-value">${displayLevel(m, latest.valeur).toFixed(2)} m <span class="chg">${change}</span></div>
            ${flowRow(m)}
            <p class="watch-note">${note} Read ${ago(latest.date_prise_valeur)}.</p>
          </article>
        `;
      };
      container.innerHTML = items.filter(item => data[item.id]).map(cardHTML).join('');
      if (container.querySelector('.bryson-turbine')) refreshBrysonTurbine();
    }

    function renderChart(stationId, d) {
      const cfg = STATIONS[stationId];
      if (!cfg) return;
      const m = d.metadata;
      const vals = readingsInWindow(d.readings, windowHours);
      const latest = vals[vals.length - 1];
      // Guard BEFORE touching metadata — a 200-with-[] metadata row makes m null.
      // Clear the legend too: nothing else ever rewrites it, so a stale threshold
      // legend would otherwise persist beside the blanked chart.
      if (!latest || !m) {
        document.getElementById(cfg.infoId).innerHTML = 'No recent data published — source feed outage';
        document.getElementById(cfg.legendId).innerHTML = '';
        if (charts[stationId]) { charts[stationId].destroy(); delete charts[stationId]; }
        return;
      }
      const isBryson = stationId === BRYSON_AMONT_ID;
      const dp = heroLevelDecimals(stationId);
      const thresholds = isBryson
        ? [
            { val: BRYSON_CEILING_M, label: 'Operating ceiling', color: '#E24B4A' },
            { val: BRYSON_BAND_LOW_M, label: 'Band floor', color: '#888' },
          ]
        : (m.seuils_niv || []).map(s => ({
            val: s.valeur,
            label: THRESHOLD_COLORS[s.type]?.label || s.type,
            color: THRESHOLD_COLORS[s.type]?.color || '#888'
          }));
      const pk = classifyPeak(vals, latest);
      const peak = pk.peak;
      const peakLbl = pk.isPeaked ? 'Peak' : 'High so far';
      const dispLatest = displayLevel(m, latest.valeur);
      const dispPeak = displayLevel(m, peak.valeur);
      // Mirror-spliced rows can be days old (lookbackH); never present a stale
      // reading as "Currently" — label it with its age instead.
      const latestMs = parseVigilance(latest.date_prise_valeur)?.getTime() || 0;
      const chartStale = Date.now() - latestMs > FALLBACK_STALE_H * 3600 * 1000;
      const nowLbl = chartStale
        ? `Last known <strong>${dispLatest.toFixed(dp)} m</strong> (reading ${ago(latest.date_prise_valeur)})`
        : `Currently <strong>${dispLatest.toFixed(dp)} m</strong>`;
      // Year-to-date range. The chart already shows the window's shape, so the
      // range is the part a reader can't see — how today sits against the year.
      const yr = lastYearRanges[stationId];
      const yrScope = yr && yr.wholeYear
        ? `${new Date().getUTCFullYear()}` : `since ${LIVE_TIER_START_LABEL}`;
      const yrLbl = (yr && yr.max && yr.min)
        ? ` · ${yrScope} range <strong>${displayLevel(m, yr.max.valeur).toFixed(2)}</strong>–<strong>${displayLevel(m, yr.min.valeur).toFixed(2)} m</strong>`
        : '';
      const statusLbl = isBryson
        ? brysonCeilingDelta(latest.valeur).text
        : `Quebec status ${m.etat_niv}/6`;
      document.getElementById(cfg.infoId).innerHTML =
        `${nowLbl} · ${peakLbl} <strong>${dispPeak.toFixed(dp)} m</strong> at ${timeLabel(peak.date_prise_valeur)}${yrLbl} · ${statusLbl}`;
      
      const isDark = isDarkMode();
      const grid = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
      const txt = isDark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.55)';
      const plotted = vals.map(v => displayLevel(m, v.valeur));
      
      if (charts[stationId]) charts[stationId].destroy();
      const showPoints = vals.length <= 12;
      charts[stationId] = new Chart(document.getElementById(cfg.chartId), {
        type: 'line',
        data: {
          labels: vals.map(v => timeLabel(v.date_prise_valeur)),
          datasets: [{
            data: plotted,
            borderColor: cfg.color,
            backgroundColor: cfg.color + '15',
            borderWidth: 2,
            pointRadius: showPoints ? 4 : 0,
            pointHoverRadius: 6,
            pointHoverBackgroundColor: cfg.color,
            pointHoverBorderColor: isDark ? '#1e1e1e' : '#fff',
            pointHoverBorderWidth: 2,
            pointBackgroundColor: cfg.color,
            // Monotone, not bezier tension: the gauge reports in 1 cm steps, and
            // tension overshoots each riser so flat plateaus read as waves.
            cubicInterpolationMode: 'monotone',
            fill: true
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false, axis: 'x' },
          hover: { mode: 'index', intersect: false, axis: 'x' },
          plugins: {
            legend: { display: false },
            tooltip: {
              mode: 'index',
              intersect: false,
              backgroundColor: isDark ? 'rgba(30,30,30,0.95)' : 'rgba(255,255,255,0.98)',
              titleColor: isDark ? '#f0f0f0' : '#1a1a1a',
              bodyColor: isDark ? '#f0f0f0' : '#1a1a1a',
              borderColor: isDark ? '#444' : '#ddd',
              borderWidth: 1,
              padding: 8,
              displayColors: false,
              callbacks: {
                title: (items) => items.length ? items[0].label : '',
                label: (c) => `${c.parsed.y.toFixed(dp)} m`
              }
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: txt, font: { size: 10 }, maxTicksLimit: 7, maxRotation: 0 } },
            y: (() => {
              const cfgY = { grid: { color: grid }, ticks: { color: txt, font: { size: 11 }, callback: v => v.toFixed(2) } };
              const bounds = heroYBounds(plotted, stationId);
              if (bounds) Object.assign(cfgY, bounds);
              return cfgY;
            })()
          }
        },
        plugins: [{
          id: 'thresholdLines',
          afterDraw: (chart) => {
            const { ctx, scales: { x: xA, y: yA } } = chart;
            thresholds.forEach(t => {
              const y = yA.getPixelForValue(t.val);
              if (y < yA.top || y > yA.bottom) return;
              ctx.save();
              ctx.beginPath();
              ctx.setLineDash([3, 3]);
              ctx.strokeStyle = t.color;
              ctx.lineWidth = 1;
              ctx.moveTo(xA.left, y);
              ctx.lineTo(xA.right, y);
              ctx.stroke();
              ctx.fillStyle = t.color;
              ctx.font = '10px sans-serif';
              ctx.textAlign = 'right';
              ctx.fillText(`${t.label} ${t.val.toFixed(2)}`, xA.right - 4, y - 3);
              ctx.restore();
            });
            // Historical peaks — only on Lac Coulonge (1195)
            if (stationId === 1195) {
              const peakColor = isDark ? 'rgba(200,200,200,0.55)' : 'rgba(100,100,100,0.6)';
              HISTORICAL_PEAKS.forEach(p => {
                const y = yA.getPixelForValue(p.level);
                if (y < yA.top || y > yA.bottom) return;
                ctx.save();
                ctx.beginPath();
                ctx.setLineDash([2, 5]);
                ctx.strokeStyle = peakColor;
                ctx.lineWidth = 1;
                ctx.moveTo(xA.left, y);
                ctx.lineTo(xA.right, y);
                ctx.stroke();
                ctx.fillStyle = peakColor;
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(`${p.year} peak ${p.level.toFixed(2)}`, xA.left + 4, y - 3);
                ctx.restore();
              });
            }
          }
        }]
      });
      
      document.getElementById(cfg.legendId).innerHTML = thresholds.map(t => 
        `<span class="thresh-item" style="color: ${t.color}"><span class="thresh-line"></span>${t.label}</span>`
      ).join('');
    }

    function renderProperty(lcLatest, trendPerHour) {
      const el = document.getElementById('thresh-list');
      el.classList.remove('skeleton');
      el.innerHTML = PROPERTY_THRESHOLDS.map(t => {
        let status, cls;
        if (lcLatest >= t.level) { status = 'Exceeded'; cls = 'flooded'; }
        else if (lcLatest >= t.level - 0.05) { status = 'Very close'; cls = 'close'; }
        else if (lcLatest >= t.level - 0.15) { status = `${((t.level - lcLatest) * 100).toFixed(0)} cm below`; cls = 'close'; }
        else { status = `${((t.level - lcLatest) * 100).toFixed(0)} cm below`; cls = 'safe'; }
        const eta = etaToThreshold(lcLatest, t.level, trendPerHour);
        let etaHtml = '';
        if (cls !== 'flooded') {
          if (eta) etaHtml = `<span class="eta rising">ETA ${eta}</span>`;
          else if (trendPerHour != null && trendPerHour < -0.00005) etaHtml = `<span class="eta">↓ declining</span>`;
          else if (trendPerHour != null && Math.abs(trendPerHour) <= 0.00005) etaHtml = `<span class="eta">→ stable</span>`;
        }
        const rate = ((t.histCount / HISTORICAL_RECORD_YEARS) * 100).toFixed(t.histCount < 4 ? 1 : 0);
        const baseRate = `<span class="base-rate" title="Annual peak ≥ this level in ${t.histCount} of ${HISTORICAL_RECORD_YEARS} years on record (1972–2025)">${t.histCount}/${HISTORICAL_RECORD_YEARS} yrs · ${rate}%</span>`;
        return `<div class="thresh-row"><span class="level">${t.level.toFixed(2)} m</span><span class="desc">${t.desc} ${baseRate}</span><span class="status ${cls}">${status}${etaHtml}</span></div>`;
      }).join('');
    }

    // ---- V3 Bayesian season-end forecast -------------------------------------
    // Static JSON regenerated daily by ingesters/climate-history/freshet_posterior.py
    // (`--asof latest --json`) and committed to the public mirror. Fetched from the
    // mirror's raw URL (same pattern as FORECAST_URL) so the daily data refresh
    // needs no image rebuild. Schema:
    //   { asof, season_resolved, actual_peak_m, state:{level_m,...},
    //     thresholds:[ {threshold_m,label,prior,likelihood,posterior}, ... ] }
    const FRESHET_FORECAST_URL = 'https://raw.githubusercontent.com/aachtenberg/ottawa-river-freshet/main/dashboard/freshet-forecast.json';
    let freshetForecastLoaded = false;

    async function renderFreshetForecast() {
      const el = document.getElementById('freshet-forecast');
      if (!el) return;
      let d;
      try {
        const r = await fetch(FRESHET_FORECAST_URL, { cache: 'no-store' });
        if (!r.ok) throw new Error('http ' + r.status);
        d = await r.json();
      } catch (e) {
        // Don't blank a previously-rendered panel on a transient refresh failure.
        if (!freshetForecastLoaded) el.innerHTML = '<span class="skeleton">Forecast unavailable.</span>';
        return;
      }

      const sev = (p) => p >= 0.66 ? 'sev-high' : p >= 0.33 ? 'sev-mid' : 'sev-low';
      const rows = (d.thresholds || []).map(t => {
        const post = Math.round((t.posterior || 0) * 100);
        const prior = Math.max(0, Math.min(100, Math.round((t.prior || 0) * 100)));
        return `<div class="fc-row">
          <span class="fc-label"><span class="lvl">${t.threshold_m.toFixed(2)} m</span> · ${t.label}</span>
          <div class="fc-track">
            <div class="fc-fill ${sev(t.posterior || 0)}" style="width:${post}%"></div>
            <div class="fc-prior" style="left:${prior}%" title="pre-freshet prior: ${prior}%"></div>
          </div>
          <span class="fc-pct">${post}%</span>
        </div>`;
      }).join('');

      const peak = (d.actual_peak_m != null) ? `${d.actual_peak_m.toFixed(2)} m` : '—';
      const lvl = (d.state && d.state.level_m != null) ? `${d.state.level_m.toFixed(2)} m` : '—';
      const crested = d.thresholds && d.thresholds.every(t => t.posterior === 0 || t.posterior === 1);
      const badge = crested
        ? '<span class="resolved-badge" title="Lake has crested and receded — the season peak is settled">SEASON CRESTED</span>'
        : '';
      const subEl = document.getElementById('forecast-sub');
      if (subEl) {
        subEl.innerHTML = `As of <strong>${d.asof}</strong> · level <strong>${lvl}</strong> · `
          + `peak so far <strong>${peak}</strong>${badge}`;
      }
      el.classList.remove('skeleton');
      el.innerHTML = rows
        + `<div class="fc-legend"><span class="prior-key"></span> = pre-freshet seasonal prior (V1). `
        + `Bar = posterior after updating on the lake's trajectory through the freshet (V2). `
        + `Method: <a href="https://github.com/aachtenberg/ottawa-river-freshet/blob/main/ingesters/climate-history/FRESHET_PROBABILITY.md" target="_blank" rel="noopener noreferrer">FRESHET_PROBABILITY.md</a>.</div>`;
      freshetForecastLoaded = true;
    }

    // ---- ORRPB forecast snapshot ---------------------------------------------
    // Fetched once per page-load from the public mirror. Drives the post-peak
    // status text in renderSummary so it reflects the actual current ORRPB
    // forecast rather than hard-coded boilerplate. Schema is documented in
    // freshet-public/routines/freshet-daily-brief.md "Structured forecast snapshot".
    const FORECAST_URL = 'https://raw.githubusercontent.com/aachtenberg/ottawa-river-freshet/main/data/forecast/latest.json';
    const FORECAST_STALE_HOURS = 36;  // older than this → fall back to generic boilerplate

    async function loadForecast() {
      // Serve the cached snapshot only while it's within the in-session TTL. A
      // flood-watch tab stays open for days, so an unconditional cache would
      // freeze the forecast and silently age out to boilerplate after
      // FORECAST_STALE_HOURS. Re-fetch when stale; always retry after a miss
      // (and keep the last good snapshot rather than flapping to null).
      if (forecastData !== null && (Date.now() - forecastFetchedAt) < FORECAST_TTL_MS) {
        return forecastData;
      }
      if (forecastLoading) return forecastLoading;
      forecastLoading = (async () => {
        try {
          const r = await fetch(FORECAST_URL, { cache: 'no-store' });
          if (!r.ok) return null;
          const j = await r.json();
          if (!j || j.schema_version !== 1) return null;
          return j;
        } catch (e) {
          return null;
        }
      })();
      const result = await forecastLoading;
      forecastLoading = null;            // let the next refresh cycle retry
      if (result !== null) {             // preserve last good snapshot on a miss
        forecastData = result;
        forecastFetchedAt = Date.now();
      }
      return forecastData;
    }

    function forecastIsFresh(f) {
      if (!f || !f.fetched_at_iso) return false;
      const ageH = (Date.now() - new Date(f.fetched_at_iso).getTime()) / 3600000;
      return ageH <= FORECAST_STALE_HOURS;
    }

    function formatForecastUpdate(iso) {
      if (!iso) return '';
      try {
        return new Date(iso).toLocaleString(pageLang === 'fr' ? 'fr-CA' : 'en-CA',
          { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      } catch (e) {
        return '';
      }
    }

    // ---- Summary-card copy ----------------------------------------------------
    // Every string the top card can show lives in this table, keyed by the state
    // summaryState() resolves below. Headline and footnote come from the same
    // entry, so the two can't drift apart, and a wording change is one edit here
    // instead of a hunt through two parallel if/else ladders inside renderSummary.
    //
    // `note` is inline HTML, a function of the (fresh) forecast snapshot, or absent
    // when that state carries no footnote (the hero then links ORRPB generically).
    const ORRPB_FORECAST_URL = 'https://www.ottawariver.ca/conditions/?display=forecast';
    const PAST_PEAK_GENERIC = 'Past first peak — second peak still possible';

    // ORRPB is publishing daily through the freshet — quote the notice itself,
    // with the time it was issued and its second-peak verdict.
    function orrpbDailyNote(fcst) {
      const upd = formatForecastUpdate(fcst.source && fcst.source.last_update_iso);
      const reach = fcst.further_increases_reach || 'the basin';
      const verdict = fcst.further_increases_possible === true
        ? `further rise possible from ${reach}`
        : (fcst.further_increases_possible === false
          ? 'continued decline forecast'
          : 'no second-peak signal stated');
      return `ORRPB${upd ? ` (${upd})` : ''}: ${verdict}. <a href="${ORRPB_FORECAST_URL}" target="_blank" rel="noopener noreferrer">Full forecast</a>.`;
    }

    const SUMMARY_COPY = {
      'above-cottage':  { cls: 'danger',  headline: 'At or above cottage threshold — take action' },
      'property-flood': { cls: 'warning', headline: 'Property flooding — water in backyard / driveway' },

      // Past the first peak with a fresh daily ORRPB forecast to quote.
      'rise-here':     { cls: 'good', headline: 'Past first peak — ORRPB flags possible further rise in this reach', note: orrpbDailyNote },
      'rise-upstream': { cls: 'good', headline: 'Past first peak — ORRPB flags possible upstream rise',              note: orrpbDailyNote },
      'decline':       { cls: 'good', headline: 'Past first peak — ORRPB forecasts continued decline',               note: orrpbDailyNote },
      // Daily forecast published but stating no second-peak signal either way:
      // generic headline, footnote still relays the notice and its timestamp.
      'no-signal':     { cls: 'good', headline: PAST_PEAK_GENERIC,                                                   note: orrpbDailyNote },

      // ORRPB stays on weekly notices from the end of the freshet right through
      // the fall, so nothing here may be peak-relative — it would read months
      // stale by September. State the level instead.
      'weekly-notice': {
        cls: 'good',
        headline: 'Below property thresholds — ORRPB on weekly notices',
        note: `ORRPB is on weekly notices for the post-freshet season. Official guidance: <a href="${ORRPB_FORECAST_URL}" target="_blank" rel="noopener noreferrer">ORRPB latest notice</a>.`,
      },

      // No fresh forecast snapshot — fall back to the generic boilerplate.
      'no-forecast': {
        cls: 'good',
        headline: PAST_PEAK_GENERIC,
        note: `Reservoir drawdown upstream can drive a secondary crest weeks after the first — watch <a href="${ORRPB_FORECAST_URL}" target="_blank" rel="noopener noreferrer">ORRPB forecasts</a>. Season's true peak may still be ahead.`,
      },

      'below-thresholds': { cls: 'good', headline: 'Below property thresholds' },
    };

    // Which SUMMARY_COPY entry the card is in. Flood thresholds win over any
    // forecast; below them the post-peak narrative only runs while ORRPB is still
    // publishing for the season — off-season suppresses it entirely, matching
    // what ORRPB itself is saying.
    function summaryState(level, isDeclined, fcst) {
      if (level >= 108.75) return 'above-cottage';
      if (level >= 108.48) return 'property-flood';
      if (!isDeclined || (fcst && fcst.mode === 'off-season')) return 'below-thresholds';
      if (fcst && fcst.mode === 'daily-freshet') {
        if (fcst.further_increases_possible === true) {
          return fcst.further_increases_includes_lac_coulonge ? 'rise-here' : 'rise-upstream';
        }
        if (fcst.further_increases_possible === false) return 'decline';
        return 'no-signal';
      }
      if (fcst && fcst.mode === 'weekly-notice') return 'weekly-notice';
      return 'no-forecast';
    }

    // Overview hero: the Lac Coulonge reading, what it means against the property
    // thresholds, and a staff gauge that places it among the reference levels.
    function renderSummary(lcData, yearRange) {
      const box = document.getElementById('summary-box');
      box.classList.remove('skeleton');
      const latest = lcData.readings[lcData.readings.length - 1];
      if (!latest) {
        box.innerHTML = '<p class="hero-foot">No recent Lac Coulonge readings — the Vigilance and Hydro-Québec feeds are both unavailable right now. Retrying automatically.</p>';
        return;
      }
      const windowPk = classifyPeak(lcData.readings, latest);
      // Prefer the year-to-date max from history (covers freshet crests older than
      // the live buffer). A higher year max is by definition a true past peak (it
      // predates the live 72h buffer) so it always counts as declined.
      const yearMax = yearRange && yearRange.max;
      const yearLow = yearRange && yearRange.min;
      const yearWins = yearMax && yearMax.valeur > windowPk.peak.valeur;
      const peak = yearWins ? yearMax : windowPk.peak;
      const isDeclined = yearWins || windowPk.isPeaked;
      const rangeYear = new Date().getUTCFullYear();
      // Only claim the year when the range actually spans it (see YEAR_SEED).
      const wholeYear = !!(yearRange && yearRange.wholeYear);
      const rangeScope = wholeYear ? `${rangeYear}` : `since ${LIVE_TIER_START_LABEL}`;
      const peakText = yearWins
        ? (wholeYear ? `${rangeYear} peak` : `Peak ${rangeScope}`)
        : (isDeclined ? 'Recent peak' : 'High so far');
      const peakDay = dayMonth(peak.date_prise_valeur);
      const peakCaption = peakDay ? `${peakText}, ${peakDay}` : peakText;
      // Ranks against 54 years of ANNUAL maxima, so it is only meaningful against
      // the year's own crest — which is exactly what yearMax now is.
      const rank = rankPeak(peak.valeur);

      // Forecast-aware messaging. forecastData is loaded by the data pipeline
      // before renderSummary runs (see refreshAll); when fresh, the note beside
      // the chip and the footnote relay ORRPB's actual forecast. One state key
      // drives both — every string it can produce is in SUMMARY_COPY above.
      const fcst = forecastIsFresh(forecastData) ? forecastData : null;
      const copy = SUMMARY_COPY[summaryState(latest.valeur, isDeclined, fcst)];
      const note = typeof copy.note === 'function' ? copy.note(fcst) : (copy.note
        || `Official guidance: <a href="${ORRPB_FORECAST_URL}" target="_blank" rel="noopener noreferrer">ORRPB conditions</a>.`);
      const m = lcData.metadata;
      const chip = m ? stateChip(getEffectiveEtat(m), isEffectiveEtatSynthetic(m)) : '';

      // Change is ink: arrow, word, signed number.
      const c24 = changeCm(lcData.readings, 24);
      const c72 = changeCm(lcData.readings, 72);
      const trendWord = c24 > 0.5 ? 'Rising' : c24 < -0.5 ? 'Falling' : 'Steady';
      const trend = c24 == null ? '' : `<div class="hero-trend"><strong>${changeArrow(c24)} ${trendWord}</strong><span class="muted"> · ${signedCm(c24)} cm in 24 h${c72 == null ? '' : `<span class="wide-only"> · ${signedCm(c72)} cm in 72 h</span>`}</span></div>`;

      // Where the lake sits against the property thresholds, in one sentence.
      const shortDesc = t => t.desc.replace(/\s*\(.*\)$/, '');
      const first = PROPERTY_THRESHOLDS[0];
      const cmTo = lvl => Math.abs(Math.round((lvl - latest.valeur) * 100));
      let lede;
      if (latest.valeur < first.level) {
        lede = `<strong>${cmTo(first.level)} cm</strong> below the first property threshold <span class="muted">(${first.level.toFixed(2)} m, ${shortDesc(first).toLowerCase()})</span>.`;
      } else {
        const crossed = PROPERTY_THRESHOLDS.filter(t => t.level <= latest.valeur).pop();
        const next = PROPERTY_THRESHOLDS.find(t => t.level > latest.valeur);
        lede = `<strong>${cmTo(crossed.level)} cm</strong> above ${crossed.level.toFixed(2)} m <span class="muted">(${shortDesc(crossed)})</span>`
          + (next ? `, <strong>${cmTo(next.level)} cm</strong> below the next line at ${next.level.toFixed(2)} m.` : '.');
      }

      // Stat tiles.
      const BRICKS_M = 108.75;
      const marginRef = isDeclined ? peak.valeur : latest.valeur;
      const marginCm = (BRICKS_M - marginRef) * 100;
      const marginTile = marginCm > 0
        ? { v: `${marginCm.toFixed(0)} cm`, l: isDeclined ? 'Margin to bricks at the peak' : 'Margin to bricks right now' }
        : { v: 'Reached', l: `Water at end of bricks (${BRICKS_M.toFixed(2)} m)` };
      const br = lastData && lastData[BRYSON_AMONT_ID];
      const brLatest = br && br.readings && br.readings[br.readings.length - 1];
      let thirdTile = '';
      if (brLatest) {
        const { aboveCm } = brysonCeilingDelta(brLatest.valeur);
        thirdTile = `<div class="hero-stat wide-only"><div class="v">${Math.abs(aboveCm)} cm</div><div class="l">Bryson headpond ${aboveCm >= 0 ? 'above' : 'below'} its ${BRYSON_CEILING_M.toFixed(2)} m operating ceiling</div></div>`;
      } else if (yearLow) {
        thirdTile = `<div class="hero-stat wide-only"><div class="v">${yearLow.valeur.toFixed(2)} m</div><div class="l">${wholeYear ? `${rangeYear} low` : `Low ${rangeScope}`}</div></div>`;
      }

      // Gauge domain. During active freshet zoom in on the flood band (107.0 m
      // floor). Once the lake drops near/below that floor — weekly-notice /
      // off-season, or the level itself — widen it so the reading and the year's
      // low are on the scale rather than pinned to the bottom.
      const LC_MEDIAN = 106.42;      // long-term median at this gauge (also Dec climatology)
      const FRESHET_MIN = 107.0;
      const G_MAX = 109.5;
      const postFreshet = isDeclined && fcst && (fcst.mode === 'weekly-notice' || fcst.mode === 'off-season');
      const wideBand = postFreshet || latest.valeur < FRESHET_MIN + 0.10;
      const lowest = Math.min(latest.valeur, yearLow ? yearLow.valeur : latest.valeur);
      const G_MIN = wideBand ? Math.min(105.5, Math.floor((lowest - 0.1) * 2) / 2) : FRESHET_MIN;
      // Only mark the peak / low when meaningfully separate from current (>= 1 cm).
      const showPeakSeparate = (peak.valeur - latest.valeur) * 100 >= 1;
      const showLowSeparate = yearLow && (latest.valeur - yearLow.valeur) * 100 >= 1;

      const marks = [
        { v: 109.17, cls: '', text: '2019 record' },
        { v: 109.01, cls: 'prop', text: 'Water inside cottage' },
        { v: 108.75, cls: 'prop', text: 'Water at end of bricks' },
        { v: 108.30, cls: 'prop', text: 'Water approaching property' },
        { v: 107.50, cls: 'minor', text: 'Minor flood (Vigilance)' },
        { v: LC_MEDIAN, cls: '', text: 'Long-term median' },
        { v: latest.valeur, cls: 'now', text: 'Now' },
      ];
      if (showPeakSeparate) marks.push({ v: peak.valeur, cls: 'peak', text: peakCaption });
      if (showLowSeparate) marks.push({ v: yearLow.valeur, cls: '', text: wholeYear ? `${rangeYear} low` : `Low ${rangeScope}` });
      const STAFF_H = 440;
      const LABEL_H = 18;
      const yOf = v => Math.max(0, Math.min(STAFF_H, (G_MAX - v) / (G_MAX - G_MIN) * STAFF_H));
      const placed = marks.filter(k => k.v > G_MIN && k.v < G_MAX).sort((a, b) => b.v - a.v)
        .map(k => ({ ...k, y: yOf(k.v), ly: yOf(k.v) - LABEL_H / 2 }));
      // Labels sit beside their tick; where ticks crowd, nudge labels apart
      // (down first, then back up from the bottom edge) so none overlap.
      for (let i = 1; i < placed.length; i++) placed[i].ly = Math.max(placed[i].ly, placed[i - 1].ly + LABEL_H);
      for (let i = placed.length - 1; i >= 0; i--) {
        const cap = i === placed.length - 1 ? STAFF_H - LABEL_H / 2 : placed[i + 1].ly - LABEL_H;
        placed[i].ly = Math.min(placed[i].ly, cap);
      }
      const staff = placed.map(k => `
          <div class="staff-tick ${k.cls}" aria-hidden="true" style="top:${k.y.toFixed(1)}px"></div>
          <div class="staff-label ${k.cls}" style="top:${k.ly.toFixed(1)}px"><span class="n">${k.v.toFixed(2)}</span><span>${k.text}</span></div>`).join('');
      const scaleText = `${G_MIN.toFixed(1)} to ${G_MAX.toFixed(1)} m`;

      // Phone: same gauge as one horizontal bar; labels drop out before they collide.
      const hp = v => Math.max(0, Math.min(100, (v - G_MIN) / (G_MAX - G_MIN) * 100));
      const nowP = hp(latest.valeur), propP = hp(first.level), peakP = hp(peak.valeur);
      const peakOnBar = showPeakSeparate && peak.valeur < G_MAX;
      const flipPeak = peakP > 82;
      const showPeakLabel = peakOnBar && peakP - nowP > (flipPeak ? 24 : 8)
        && (flipPeak || peakP >= propP || propP - peakP > 32);
      const showPropLabel = (propP - nowP > 22 || nowP - propP > 8)
        && !(showPeakLabel && flipPeak && peakP - propP < 18);
      const hgauge = `
          <div class="hgauge" aria-hidden="true">
            <div class="hg-bar">
              <div class="hg-track"></div>
              <div class="hg-water" style="width:${nowP.toFixed(1)}%"></div>
              <div class="hg-hatch" style="left:${propP.toFixed(1)}%;right:0"></div>
              <div class="hg-now" style="left:${nowP.toFixed(1)}%"></div>
              ${peakOnBar ? `<div class="hg-peak" style="left:${peakP.toFixed(1)}%"></div>` : ''}
            </div>
            <div class="hg-labels">
              <span class="now" style="left:${Math.max(6, Math.min(94, nowP)).toFixed(1)}%">Now<br>${latest.valeur.toFixed(2)}</span>
              ${showPropLabel ? `<span class="prop" style="left:${propP.toFixed(1)}%">Property<br>${first.level.toFixed(2)}</span>` : ''}
              ${showPeakLabel ? `<span class="peak${flipPeak ? ' flip' : ''}" style="left:${peakP.toFixed(1)}%">${peakText}<br>${peak.valeur.toFixed(2)}</span>` : ''}
            </div>
            <p class="hg-cap">Scale ${scaleText}. Hatched = property thresholds.</p>
          </div>`;

      box.innerHTML = `
        <div class="hero-main">
          <div class="hero-head">
            <h2 class="eyebrow">Lac Coulonge<span class="wide-only"> · property gauge</span></h2>
            ${chip}
            <span class="hero-note ${copy.cls}">${copy.headline}</span>
          </div>
          <div class="hero-reading">
            <div class="hero-level">${latest.valeur.toFixed(2)}<span class="unit"> m</span></div>
            ${trend}
          </div>
          <p class="hero-lede">${lede}</p>
          ${hgauge}
          <div class="hero-stats">
            <div class="hero-stat"><div class="v">${peak.valeur.toFixed(2)} m</div><div class="l">${peakCaption}</div><div class="x">${ordinal(rank)} highest of ${HISTORICAL_RECORD_YEARS} years</div></div>
            <div class="hero-stat"><div class="v">${marginTile.v}</div><div class="l">${marginTile.l}</div></div>
            ${thirdTile}
          </div>
          <p class="hero-foot">Read ${ago(latest.date_prise_valeur)}. ${note}</p>
        </div>
        <div class="hero-side">
          <div class="eyebrow">Staff gauge, ${scaleText}</div>
          <div class="staff" role="img" aria-label="Staff gauge from ${scaleText}: Lac Coulonge at ${latest.valeur.toFixed(2)} m; first property threshold at ${first.level.toFixed(2)} m">
            <div class="staff-tube" aria-hidden="true">
              <div class="staff-water" style="top:${yOf(latest.valeur).toFixed(1)}px"></div>
              <div class="staff-hatch" style="top:0;height:${yOf(first.level).toFixed(1)}px"></div>
            </div>${staff}
          </div>
        </div>
      `;
    }

    // Render hours as the same label the range buttons use (24h, 7d, 30d, …).
    function windowLabel(h) {
      if (h >= 24 && h % 24 === 0 && h > 72) return `${h / 24}d`;
      return `${h}h`;
    }

    // ---- Corridor table --------------------------------------------------------
    // Main-stem stations upstream → downstream. Tributary 1004 excluded.
    const CORRIDOR_BAR_STATIONS = [951, 545, 1279, 1195, 99001, 984, 548, 550, 981, 1264];
    const CORRIDOR_ROLES = {
      951:   { en: 'Headwaters',                     fr: 'Tête du bassin' },
      545:   { en: 'Otto Holden tailwater',          fr: 'Aval d\'Otto Holden' },
      1279:  { en: 'Route 148 · immediate upstream', fr: 'Route 148 · amont immédiat' },
      1195:  { en: 'Property gauge',                 fr: 'Jauge de la propriété' },
      99001: { en: 'Lac Deschênes, MVCA',            fr: 'Lac Deschênes, MVCA' },
      984:   { en: 'Lac Deschênes marina',           fr: 'Marina du lac Deschênes' },
      548:   { en: 'Lac Deschênes',                  fr: 'Lac Deschênes' },
      550:   { en: 'Gatineau marina',                fr: 'Marina de Gatineau' },
      981:   { en: 'Thurso area',                    fr: 'Secteur de Thurso' },
      1264:  { en: 'Downstream tail',                fr: 'Extrémité aval' },
    };

    // Level change in cm over the trailing `hours` window, measured against the
    // reading nearest that mark. Returns null when the nearest reading is more
    // than 6 h off-target — avoids misleading deltas on stations with ingest gaps,
    // or whose live buffer is shorter than the requested window (e.g. a 72 h ask
    // on a station with only ~60 h of buffered readings).
    function changeCm(readings, hours) {
      if (!readings || readings.length < 2) return null;
      const latest = readings[readings.length - 1];
      const latestT = new Date(latest.date_prise_valeur).getTime();
      const targetT = latestT - hours * 3600 * 1000;
      let best = readings[0];
      let bestDiff = Math.abs(new Date(best.date_prise_valeur).getTime() - targetT);
      for (const r of readings) {
        const diff = Math.abs(new Date(r.date_prise_valeur).getTime() - targetT);
        if (diff < bestDiff) { best = r; bestDiff = diff; }
      }
      if (bestDiff > 6 * 3600 * 1000) return null;
      return (latest.valeur - best.valeur) * 100;
    }
    function dailyChangeCm(readings) { return changeCm(readings, 24); }

    // Both change columns share one ±20 cm scale so 24 h and 72 h compare
    // directly: 120 px wide, zero at 60 px, 2.5 px per cm.
    const CORRIDOR_SCALE_CM = 20;
    let corridorMode = 'live';          // 'live' | 'orrpb'
    let corridorShape = '';             // mode + language + row keys of the table in the DOM
    const corridorRowCache = {};        // row key → last painted row HTML
    const corridorLevels = {};          // row key → last painted level text
    const regionalSettled = new Set();  // regional station ids whose fetch has resolved

    function corridorDeltaCell(cm, delayMs) {
      const grid = '<i></i><i></i><i class="z"></i><i></i><i></i>';
      if (cm == null) return `<td><div class="dcell"><div class="dbar" aria-hidden="true">${grid}</div><span class="dtext muted">—</span></div></td>`;
      const r = Math.round(cm * 10) / 10;
      let bar = '';
      if (r !== 0) {
        const w = Math.max(1.5, Math.min(CORRIDOR_SCALE_CM, Math.abs(r)) * 2.5);
        const left = r > 0 ? 60 : 60 - w;
        const clip = Math.abs(r) > CORRIDOR_SCALE_CM ? ' clip' : '';
        bar = `<b class="${r > 0 ? 'pos' : 'neg'}${clip}" style="left:${left.toFixed(1)}px;width:${w.toFixed(1)}px;animation-delay:${delayMs}ms"></b>`;
      }
      return `<td><div class="dcell"><div class="dbar" aria-hidden="true">${grid}${bar}</div><span class="dtext">${changeArrow(cm)} ${signedCm(cm)} cm</span></div></td>`;
    }
    // 72 h trace, drawn relative to the latest reading (the dotted line) on the
    // same ±20 cm scale as the change bars: a flat river looks flat, and rows
    // compare directly instead of each auto-scaling a 1 cm wobble into a wave.
    const SPARK_W = 132, SPARK_H = 32, SPARK_HOURS = 72;
    function corridorSpark(readings) {
      const pts = readingsInWindow(readings, SPARK_HOURS)
        .map(r => ({ t: parseVigilance(r.date_prise_valeur)?.getTime(), v: r.valeur }))
        .filter(q => q.t && q.v != null);
      if (pts.length < 2) return '<td><span class="dtext muted">—</span></td>';
      const step = Math.ceil(pts.length / 90);
      const thin = pts.filter((_, i) => i % step === 0 || i === pts.length - 1);
      const end = thin[thin.length - 1];
      const spanMs = SPARK_HOURS * 3600 * 1000;
      const x = t => 2 + Math.max(0, 1 - (end.t - t) / spanMs) * (SPARK_W - 6);
      const half = SPARK_H / 2 - 2;
      const y = v => SPARK_H / 2 - Math.max(-1, Math.min(1, (v - end.v) * 100 / CORRIDOR_SCALE_CM)) * half;
      const line = thin.map(q => `${x(q.t).toFixed(1)},${y(q.v).toFixed(1)}`).join(' ');
      return `<td><svg class="spark" width="${SPARK_W}" height="${SPARK_H}" viewBox="0 0 ${SPARK_W} ${SPARK_H}" aria-hidden="true">
        <line x1="0" y1="${SPARK_H / 2}" x2="${SPARK_W}" y2="${SPARK_H / 2}"/><polyline points="${line}"/><circle cx="${x(end.t).toFixed(1)}" cy="${SPARK_H / 2}" r="2.5"/></svg></td>`;
    }
    function corridorScaleHead(label) {
      const ticks = [-20, -10, 0, 10, 20].map((v, i) =>
        `<span style="left:${10 + i * 25}px">${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v)}</span>`).join('');
      return `<th scope="col">${label}<div class="dscale" aria-hidden="true">${ticks}</div></th>`;
    }
    // One row. `%F%` is where the "level just changed" flash class goes; it is
    // kept out of the cached HTML so a repaint doesn't restart the flash.
    function corridorRowHTML(r, i, withState, withSpark) {
      const name = r.detailId != null
        ? `<button type="button" class="corr-name" onclick="openBarDetail(${r.detailId})" title="References for ${r.name}">${r.name}</button>`
        : `<span class="corr-name${r.level == null ? ' off' : ''}">${r.name}</span>`;
      const first = `<td>${name}<div class="corr-role">${r.role}</div></td>`;
      // data-station-id lets a map marker scroll to (and flash) the row; the home
      // row leaves it to the hero, which carries the same id further up the page.
      const sid = r.stationId != null && !r.home ? ` data-station-id="${r.stationId}"` : '';
      const attrs = `data-row="${r.key}"${sid}${r.home ? ' class="is-home"' : ''}`;
      if (r.level == null) {
        return `<tr ${attrs}>${first}<td colspan="${(withState ? 4 : 3) + (withSpark ? 1 : 0)}"><span class="corr-msg">${r.msg}</span></td></tr>`;
      }
      return `<tr ${attrs}>${first}
        <td><span class="corr-level%F%">${r.level.toFixed(2)}</span><span class="corr-unit"> m</span></td>
        ${withState ? `<td>${r.chip}</td>` : ''}
        ${withSpark ? corridorSpark(r.readings) : ''}
        ${corridorDeltaCell(r.c24, i * 70)}${corridorDeltaCell(r.c72, i * 70)}</tr>`;
    }
    // Paint row by row, touching only rows whose content changed: the regional
    // stations arrive one at a time, and a full rebuild on each arrival would
    // replay every bar animation up to ten times per refresh.
    function paintCorridor(rows, withState, footHtml) {
      const wrap = document.getElementById('corridor-table');
      const foot = document.getElementById('corridor-foot');
      if (!wrap) return;
      const withSpark = corridorMode === 'live';
      const shape = `${corridorMode}|${pageLang}|${rows.map(r => r.key).join(',')}`;
      if (shape !== corridorShape || !wrap.querySelector('tbody')) {
        corridorShape = shape;
        for (const k of Object.keys(corridorRowCache)) delete corridorRowCache[k];
        wrap.innerHTML = `<table class="corr-table${withState ? '' : ' no-state'}${withSpark ? ' has-spark' : ''}"><thead><tr>
          <th scope="col">${L('Station, upstream → downstream', 'Station, amont → aval')}</th><th scope="col">${L('Level', 'Niveau')}</th>
          ${withState ? `<th scope="col">${L('Flood state', 'État de crue')}</th>` : ''}
          ${withSpark ? `<th scope="col">${L('Last 72 h', 'Sur 72 h')}</th>` : ''}
          ${corridorScaleHead(L('24 h change, cm', 'Variation 24 h, cm'))}${corridorScaleHead(L('72 h change, cm', 'Variation 72 h, cm'))}
        </tr></thead><tbody></tbody></table>`;
      }
      const tbody = wrap.querySelector('tbody');
      rows.forEach((r, i) => {
        const html = corridorRowHTML(r, i, withState, withSpark);
        if (corridorRowCache[r.key] === html) return;
        corridorRowCache[r.key] = html;
        const level = r.level == null ? null : r.level.toFixed(2);
        const changed = level != null && corridorLevels[r.key] != null && corridorLevels[r.key] !== level;
        if (level != null) corridorLevels[r.key] = level;
        const tmp = document.createElement('tbody');
        tmp.innerHTML = html.replace('%F%', changed ? ' updated' : '');
        const old = tbody.querySelector(`tr[data-row="${r.key}"]`);
        if (old) old.replaceWith(tmp.firstElementChild);
        else tbody.appendChild(tmp.firstElementChild);
      });
      if (foot) foot.innerHTML = footHtml;
    }

    function renderCorridor() {
      if (corridorMode === 'orrpb') { renderCorridorOrrpb(); return; }
      if (!lastData) return;
      const times = [];
      const rows = CORRIDOR_BAR_STATIONS.map(id => {
        const s = lastData[id];
        const base = {
          key: `live:${id}`, home: id === 1195, stationId: id,
          name: (STATION_NAMES[id] && STATION_NAMES[id][pageLang]) || s?.metadata?.label || `${id}`,
          role: (CORRIDOR_ROLES[id] && CORRIDOR_ROLES[id][pageLang]) || '',
        };
        if (!s) return { ...base, level: null, msg: regionalSettled.has(id) ? L('No current reading.', 'Aucune lecture actuelle.') : L('Loading…', 'Chargement…') };
        const latest = s.readings?.length ? s.readings[s.readings.length - 1] : null;
        const raw = s.metadata?.dern_valeur_niv ?? latest?.valeur;
        if (raw == null) return { ...base, level: null, msg: L('No current reading.', 'Aucune lecture actuelle.') };
        const masl = raw + (ORRPB_HISTORIC_PEAKS[id]?.datumOffset || 0);
        // A stale series has no meaningful "now" or change — say so rather than
        // plot a days-old level beside live ones.
        if (isSeriesStale(s)) {
          const when = latest ? `, ${ago(latest.date_prise_valeur)}` : '';
          const why = LOCAL_HYDRO_METEO_IDS.includes(id) ? L(' Hydro Météo gauge deactivated.', ' Jauge Hydro Météo désactivée.') : '';
          return { ...base, level: null, msg: `${L('No current reading. Last known', 'Aucune lecture actuelle. Dernière valeur connue :')} ${masl.toFixed(2)} m${when}.${why}` };
        }
        times.push(latestReadingMs(s));
        return {
          ...base, level: masl, readings: s.readings,
          detailId: s.metadata?.dern_valeur_niv != null ? id : null,
          chip: stateChip(getEffectiveEtat(s.metadata), isEffectiveEtatSynthetic(s.metadata)),
          c24: dailyChangeCm(s.readings), c72: changeCm(s.readings, 72),
        };
      });
      const et = (ms, opts) => new Intl.DateTimeFormat(L('en-GB', 'fr-CA'), { timeZone: 'America/Toronto', hour12: false, ...opts }).format(new Date(ms));
      const hm = { hour: '2-digit', minute: '2-digit' };
      const dmy = { day: 'numeric', month: 'short', year: 'numeric' };
      let span = '';
      if (times.length) {
        const lo = Math.min(...times), hi = Math.max(...times);
        span = et(lo, dmy) === et(hi, dmy)
          ? ` ${L('Readings', 'Lectures du')} ${et(hi, dmy)}, ${et(lo, hm)} ${L('to', 'à')} ${et(hi, hm)} ${L('ET', 'HE')}.`
          : ` ${L('Readings', 'Lectures du')} ${et(lo, { ...dmy, ...hm })} ${L('to', 'au')} ${et(hi, { ...dmy, ...hm })} ${L('ET', 'HE')}.`;
      }
      paintCorridor(rows, true,
        L(`Both change columns share one ±${CORRIDOR_SCALE_CM} cm scale, so 24 h and 72 h bars compare directly. Left of zero is falling, right is rising; → means under 0.5 cm. A notch at the end marks a change beyond ${CORRIDOR_SCALE_CM} cm. The 72 h trace uses that scale too, drawn against the latest reading (dotted line).${span} (est.) = no official threshold, estimated from ORRPB peaks. Select a station name for its 2017 / 2019 / 2023 references.`,
          `Les deux colonnes de variation partagent une même échelle de ±${CORRIDOR_SCALE_CM} cm : les barres 24 h et 72 h se comparent directement. À gauche de zéro le niveau baisse, à droite il monte; → signifie moins de 0,5 cm. Une encoche au bout indique une variation de plus de ${CORRIDOR_SCALE_CM} cm. Le tracé sur 72 h utilise la même échelle, par rapport à la dernière lecture (ligne pointillée).${span} (est.) = aucun seuil officiel, estimé à partir des pointes du CPRBO. Sélectionnez un nom de station pour ses références 2017 / 2019 / 2023.`));
    }

    document.getElementById('corridor-mode').addEventListener('click', e => {
      const btn = e.target.closest('button[data-mode]');
      if (!btn || btn.dataset.mode === corridorMode) return;
      corridorMode = btn.dataset.mode;
      document.querySelectorAll('#corridor-mode button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      renderCorridor();
    });

    // ---- ORRPB 24:00 h view of the corridor table ------------------------------
    // 14 stations matching the bar chart that the community reposts each morning.
    // 12 ORRPB main-stem stations from orrpb_river_levels (24:00h elevations) +
    // Constance Bay (MVCA station 99001 "Buckhams Bay") and Below Carillon (CEHQ
    // station 1264 "Rigaud") which ORRPB doesn't publish. Order is hydrological
    // upstream → downstream by elevation, identical to Dan's chart.
    const ORRPB_DAILY_BAR_STATIONS = [
      { slug: 'otto-holden',   label: 'Otto Holden',   src: 'orrpb' },
      { slug: 'mattawa',       label: 'Mattawa',       src: 'orrpb' },
      { slug: 'des-joachims',  label: 'Des Joachims',  src: 'orrpb' },
      { slug: 'pembroke',      label: 'Pembroke',      src: 'orrpb' },
      { slug: 'lake-coulonge', label: 'Lake Coulonge', src: 'orrpb' },
      { slug: 'chenaux',       label: 'Chenaux',       src: 'orrpb' },
      { slug: 'chats-lake',    label: 'Chats Lake',    src: 'orrpb' },
      { slug: 'constance-bay', label: 'Constance Bay', src: 'cehq', stationId: 99001 },
      { slug: 'britannia',     label: 'Britannia',     src: 'orrpb' },
      { slug: 'gatineau',      label: 'Gatineau',      src: 'orrpb' },
      { slug: 'thurso',        label: 'Thurso',        src: 'orrpb' },
      { slug: 'grenville',     label: 'Grenville',     src: 'orrpb' },
      { slug: 'carillon',      label: 'Carillon',      src: 'orrpb' },
      { slug: 'below-carillon',label: 'Below Carillon',src: 'cehq', stationId: 1264 },
    ];

    let orrpbDailyLevelsCache = null;

    // Pull the last 3 days of ORRPB level rows once per fetchData cycle. Tiny
    // payload (~36 rows for 12 stations × 3 days); we need 'yesterday' for the
    // daily-change indicator. Cached for the lifetime of the page; refreshed by
    // renderCorridorOrrpb() if it's been more than 30 min.
    async function fetchORRPBDailyLevels(force = false) {
      if (!force && orrpbDailyLevelsCache &&
          Date.now() - orrpbDailyLevelsCache._fetchedAt < 30 * 60 * 1000) {
        return orrpbDailyLevelsCache.rows;
      }
      const since = new Date(Date.now() - 5 * 24 * 3600 * 1000).toISOString().slice(0, 10);
      const r = await fetch(`/history/orrpb_river_levels?time=gte.${since}&order=time.asc`,
                            { cache: 'no-store' });
      if (!r.ok) throw new Error(`orrpb levels HTTP ${r.status}`);
      const rows = await r.json();
      orrpbDailyLevelsCache = { rows, _fetchedAt: Date.now() };
      return rows;
    }

    // Return { latest, prior, deltaM, delta72M } for one ORRPB station given its
    // rows (already sorted ascending by `time`). prior is the most recent row
    // strictly before latest.time; deltaM is null if we don't have both.
    // delta72M compares against the row three days back (±12 h), null if absent.
    function orrpbStationLatest(rows, slug) {
      const series = rows.filter(r => r.station === slug && r.level_m != null);
      if (!series.length) return { latest: null, prior: null, deltaM: null, delta72M: null };
      const latest = series[series.length - 1];
      let prior = null;
      for (let i = series.length - 2; i >= 0; i--) {
        if (series[i].time < latest.time) { prior = series[i]; break; }
      }
      const deltaM = prior ? latest.level_m - prior.level_m : null;
      const target72 = new Date(latest.time).getTime() - 72 * 3600 * 1000;
      const back72 = series.find(r => Math.abs(new Date(r.time).getTime() - target72) <= 12 * 3600 * 1000);
      const delta72M = back72 ? latest.level_m - back72.level_m : null;
      return { latest, prior, deltaM, delta72M };
    }

    // Same idea for the two bonus stations sourced from CEHQ lastData[id].readings.
    // readings come ascending by date_prise_valeur; we pick the latest reading and
    // the reading closest to 24h before it. Returns null if data is unavailable
    // or the 24h-back match is more than 6h off.
    function cehqStationLatest(stationId) {
      const s = lastData?.[stationId];
      if (!s?.readings?.length) return { latest: null, prior: null, deltaM: null };
      const readings = s.readings;
      const latest = readings[readings.length - 1];
      const latestT = new Date(latest.date_prise_valeur).getTime();
      const targetT = latestT - 24 * 3600 * 1000;
      let prior = null, bestDiff = Infinity;
      for (let i = readings.length - 2; i >= 0; i--) {
        const t = new Date(readings[i].date_prise_valeur).getTime();
        if (latestT - t < 12 * 3600 * 1000) continue;
        const dt = Math.abs(t - targetT);
        if (dt < bestDiff) { prior = readings[i]; bestDiff = dt; }
      }
      if (!prior || bestDiff > 6 * 3600 * 1000) {
        return {
          latest: { level_m: latest.valeur, time: latest.date_prise_valeur },
          prior: null, deltaM: null,
        };
      }
      return {
        latest: { level_m: latest.valeur, time: latest.date_prise_valeur },
        prior:  { level_m: prior.valeur,  time: prior.date_prise_valeur },
        deltaM: latest.valeur - prior.valeur,
      };
    }

    async function renderCorridorOrrpb() {
      const wrap = document.getElementById('corridor-table');
      const foot = document.getElementById('corridor-foot');
      if (!wrap) return;
      let levels = [];
      try {
        levels = await fetchORRPBDailyLevels();
      } catch (e) {
        if (corridorMode !== 'orrpb') return;
        corridorShape = '';
        wrap.innerHTML = `<p class="corr-msg" style="padding: 14px 16px;">${L('ORRPB daily levels unavailable:', 'Niveaux quotidiens du CPRBO indisponibles :')} ${e.message}</p>`;
        if (foot) foot.textContent = '';
        return;
      }
      if (corridorMode !== 'orrpb') return;   // toggled back while the fetch was in flight

      const rows = ORRPB_DAILY_BAR_STATIONS.map(cfg => {
        const live = cfg.src !== 'orrpb';
        const res = live ? cehqStationLatest(cfg.stationId) : orrpbStationLatest(levels, cfg.slug);
        const base = {
          key: `orrpb:${cfg.slug}`, name: cfg.label, home: cfg.slug === 'lake-coulonge', live,
          role: live ? L('Live gauge · not published by ORRPB', 'Jauge en direct · non publiée par le CPRBO') : L('ORRPB 24:00 h', 'CPRBO 24 h 00'),
        };
        if (!res.latest) return { ...base, level: null, msg: L('No current reading.', 'Aucune lecture actuelle.') };
        return {
          ...base, level: res.latest.level_m, time: res.latest.time,
          c24: res.deltaM == null ? null : res.deltaM * 100,
          c72: live ? changeCm(lastData?.[cfg.stationId]?.readings, 72)
                    : (res.delta72M == null ? null : res.delta72M * 100),
        };
      });
      const shown = rows.filter(r => r.level != null);
      if (!shown.length) {
        corridorShape = '';
        wrap.innerHTML = `<p class="corr-msg" style="padding: 14px 16px;">${L('No ORRPB daily levels yet — has the scrape run?', 'Aucun niveau quotidien du CPRBO pour l\'instant — l\'extraction a-t-elle été exécutée?')}</p>`;
        if (foot) foot.textContent = '';
        return;
      }
      const orrpbCount = shown.filter(r => !r.live).length;
      const newest = shown.map(r => r.time).filter(Boolean).sort().pop();
      paintCorridor(rows, false,
        `${tPage('corridor_orrpb').replace('target="_blank"', 'target="_blank" rel="noopener noreferrer"')} ${L(`${orrpbCount} ORRPB + ${shown.length - orrpbCount} live · most recent ${newest || '—'}. Same ±${CORRIDOR_SCALE_CM} cm scale as the live view.`,
            `${orrpbCount} CPRBO + ${shown.length - orrpbCount} en direct · plus récent : ${newest || '—'}. Même échelle de ±${CORRIDOR_SCALE_CM} cm que la vue en direct.`)}`);
    }

    // ---- Bar-detail modal: tight-scale view of a single station's references ----
    function openBarDetail(stationId) {
      const station = lastData?.[stationId];
      if (!station) return;
      const meta = station.metadata;
      const offset = ORRPB_HISTORIC_PEAKS[stationId]?.datumOffset || 0;
      const currentMasl = meta.dern_valeur_niv + offset;
      const refs = ORRPB_HISTORIC_PEAKS[stationId]?.peaks || {};
      const change = dailyChangeCm(station.readings);
      const eff = getEffectiveEtat(meta);
      const name = (STATION_NAMES[stationId] && STATION_NAMES[stationId][mapLang]) || meta.label || `${stationId}`;
      const labelChip = meta.label ? ` <span class="station-id">${meta.label}</span>` : '';

      // Build the comparison rows: every reference year + property thresholds (1195 only).
      const rows = [];
      for (const [year, level] of Object.entries(refs)) rows.push({ label: `${year} ORRPB peak`, level: Number(level) });
      if (stationId === 1195) {
        for (const t of PROPERTY_THRESHOLDS) rows.push({ label: t.desc, level: t.level, isProperty: true });
      }
      rows.push({ label: 'Current reading', level: currentMasl, isCurrent: true });
      rows.sort((a, b) => b.level - a.level);

      const ETAT_NAMES = { 6: 'Major flood', 5: 'Near major', 4: 'Moderate', 3: 'Minor', 2: 'Pre-alert', 1: 'Normal', 0: 'No threshold' };
      const stateText = eff != null ? ETAT_NAMES[eff] : '';
      const changeText = change == null ? '' :
        (() => {
          const arrow = change > 0.5 ? '↑' : change < -0.5 ? '↓' : '→';
          const sign = change > 0 ? '+' : '';
          return ` · 24 h: ${arrow} ${sign}${change.toFixed(1)} cm`;
        })();

      const rowHtml = rows.map(r => {
        // Diff is framed as `current vs reference` (matches the dashboard's
        // ubiquitous "X cm below threshold" convention and the red/green
        // .above/.below CSS — current above a reference = alarm = red).
        const diff = currentMasl - r.level;
        const cm = Math.abs(diff) * 100;
        const sign = diff > 0 ? `${cm.toFixed(0)} cm above` : diff < 0 ? `${cm.toFixed(0)} cm below` : 'AT this level';
        const cls = r.isCurrent ? 'current' : '';
        const diffCls = r.isCurrent ? '' : diff > 0 ? 'above' : diff < 0 ? 'below' : '';
        const showDiff = r.isCurrent ? '' : sign;
        return `<div class="bar-detail-row ${cls}">
          <span>${r.label}</span>
          <span class="level-val">${r.level.toFixed(2)} m</span>
          <span class="level-diff ${diffCls}">${showDiff}</span>
        </div>`;
      }).join('');

      const body = `
        <h3 id="bar-detail-title">${name}${labelChip}</h3>
        <div class="now-meta">${stateText}${changeText}</div>
        <div class="now-line">${currentMasl.toFixed(2)}<span class="unit">m MASL</span></div>
        <div class="bar-detail-rows">${rowHtml}</div>
        ${rows.length > 1 ? '<div class="footnote">Sorted by level. Property thresholds (Lac Coulonge only) come from 2019 personal observations; ORRPB peaks from "Know Your Levels" (2025-05-06).</div>' : ''}
      `;
      document.getElementById('bar-detail-body').innerHTML = body;
      const modal = document.getElementById('bar-detail-modal');
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closeBarDetail(e) {
      if (e && e.currentTarget !== e.target) return; // click inside content shouldn't close
      const modal = document.getElementById('bar-detail-modal');
      if (!modal) return;
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.getElementById('bar-detail-modal')?.classList.contains('open')) closeBarDetail();
    });

    // ---- Generic card-detail open helpers (reservoir + operations) ----
    // Both reuse the existing #bar-detail-modal infrastructure but render
    // richer content. They look up data from the cached results of the most
    // recent render of their respective tabs (reservoirSnapshotCache /
    // opByIdCache + reservoirLimitsCache).

    function _openCardDetail(bodyHtml, wide = true) {
      document.getElementById('bar-detail-body').innerHTML = bodyHtml;
      const content = document.querySelector('.bar-detail-content');
      if (content) content.classList.toggle('wide', !!wide);
      const modal = document.getElementById('bar-detail-modal');
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    // Tiny inline SVG sparkline used inside the detail-modal section.
    // Plots a single numeric series (e.g. headpond level over the window).
    function _detailSpark(series, valueFn, opts) {
      const o = Object.assign({ stroke: 'var(--blue)', fill: 'rgba(76,140,224,0.15)', height: 80, width: 660 }, opts || {});
      if (!series || series.length < 2) return '<div class="detail-spark-wrap" style="color:var(--text-faint);font-size:11px;display:flex;align-items:center;justify-content:center;">no series data</div>';
      const vals = series.map(valueFn).filter(v => v != null && !isNaN(v));
      if (vals.length < 2) return '<div class="detail-spark-wrap" style="color:var(--text-faint);font-size:11px;display:flex;align-items:center;justify-content:center;">no series data</div>';
      const lo = Math.min(...vals), hi = Math.max(...vals);
      const pad = (hi - lo) * 0.08 || 0.01;
      const yMin = lo - pad, yMax = hi + pad;
      const W = o.width, H = o.height;
      const xs = series.map((_, i) => (i / (series.length - 1)) * W);
      const ys = vals.map(v => H - ((v - yMin) / (yMax - yMin)) * (H - 6) - 3);
      const linePts = xs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
      const areaPts = `0,${H} ${linePts} ${W},${H}`;
      const fmtT = t => new Date(t).toLocaleString('en-CA', { month: 'short', day: 'numeric', hour: '2-digit', hour12: false });
      const t0 = fmtT(series[0].time), tn = fmtT(series[series.length - 1].time);
      return `
        <div class="detail-spark-wrap">
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
            <polygon points="${areaPts}" style="fill:${o.fill}; stroke:none;"></polygon>
            <polyline points="${linePts}" style="stroke:${o.stroke}; stroke-width:1.5; fill:none;"></polyline>
          </svg>
          <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-faint);font-variant-numeric:tabular-nums;margin-top:2px;">
            <span>${t0}  ·  min ${lo.toFixed(2)}</span>
            <span>max ${hi.toFixed(2)}  ·  ${tn}</span>
          </div>
        </div>
      `;
    }

    function openReservoirDetail(reservoirId) {
      const snap = (reservoirSnapshotCache || []).find(s => s.reservoir_id === reservoirId);
      const cfg = (reservoirLimitsCache?.reservoirs || {})[reservoirId];
      if (!snap || !cfg) {
        _openCardDetail(`<h3>${reservoirId}</h3><div class="detail-callout info">No cached data for this reservoir yet — try refreshing the Reservoirs tab.</div>`);
        return;
      }
      const pct = pctFull(snap.level_m, cfg.low_limit, cfg.high_limit);
      const priorPct = pctFull(snap.prior_level_m, cfg.low_limit, cfg.high_limit);
      const change = (pct != null && priorPct != null) ? pct - priorPct : null;
      const volume = (pct != null && cfg.capacity_mcm != null) ? Math.round(cfg.capacity_mcm * pct / 100) : null;
      const range = (cfg.high_limit - cfg.low_limit).toFixed(2);
      const cmFromHigh = snap.level_m != null ? ((cfg.high_limit - snap.level_m) * 100).toFixed(0) : '—';
      const cmFromLow = snap.level_m != null ? ((snap.level_m - cfg.low_limit) * 100).toFixed(0) : '—';
      const capacityFull = cfg.capacity_mcm != null
        ? `${cfg.capacity_mcm.toLocaleString()} M m³ at full`
        : 'no published storage volume';
      const capacityCite = cfg.capacity_source
        ? ` <a href="${cfg.capacity_source}" target="_blank" rel="noopener" style="color:var(--text-faint);text-decoration:underline;">[source]</a>`
        : '';

      // Plain-language read of the state
      let callout = '';
      if (pct != null) {
        if (pct >= 95) callout = `<div class="detail-callout alert"><strong>At ceiling.</strong> Only ${cmFromHigh} cm below high operating limit. Any further inflow forces release at full rate.</div>`;
        else if (pct >= 85) callout = `<div class="detail-callout warn"><strong>Approaching ceiling.</strong> ${cmFromHigh} cm to high operating limit. Operator buffer narrowing.</div>`;
        else if (pct >= 65) callout = `<div class="detail-callout info"><strong>In upper operating range.</strong> ${cmFromHigh} cm below high; ${cmFromLow} cm above low. Normal active management.</div>`;
        else callout = `<div class="detail-callout info"><strong>Drawn down / refilling.</strong> ${cmFromLow} cm above low operating limit.</div>`;
      }

      // Water Management Plan operating rules — only rendered for reservoirs whose
      // reservoir-limits.json entry carries a `wmp` block (currently Bark Lake, on
      // the Madawaska). These are the legally enforceable operating constraints at
      // the dam, distinct from the ICOLD storage limits used for the % full bar.
      let wmpSection = '';
      const w = cfg.wmp;
      if (w) {
        const lvl = snap.level_m;
        const rows = [];
        if (w.summer_min_m != null) {
          const vs = (lvl != null)
            ? `${lvl >= w.summer_min_m ? '+' : ''}${((lvl - w.summer_min_m) * 100).toFixed(0)} cm vs target`
            : '—';
          rows.push(`<div class="row"><span class="lbl">Summer-min target</span><span class="val">${w.summer_min_m.toFixed(2)} m · ${vs}</span></div>`);
        }
        if (w.spring_redraw_max_m_per_day != null)
          rows.push(`<div class="row"><span class="lbl">Spring redraw cap</span><span class="val">≤ ${w.spring_redraw_max_m_per_day.toFixed(2)} m/day</span></div>`);
        if (w.min_flow_cms != null)
          rows.push(`<div class="row"><span class="lbl">Mandatory min flow</span><span class="val">${w.min_flow_cms} m³/s</span></div>`);
        if (w.flood_threshold_cms != null)
          rows.push(`<div class="row"><span class="lbl">Downstream flood threshold</span><span class="val">${w.flood_threshold_cms} m³/s</span></div>`);
        if (w.compliance_gauge)
          rows.push(`<div class="row"><span class="lbl">Compliance gauge</span><span class="val">${w.compliance_gauge}</span></div>`);
        const src = w.source
          ? ` <a href="${w.source}" target="_blank" rel="noopener" style="color:var(--text-faint);text-decoration:underline;">[plan]</a>`
          : '';
        wmpSection = `
        <div class="detail-section">
          <div class="section-label">Water Management Plan operating rules${src}</div>
          <div class="detail-grid">${rows.join('')}</div>
          ${w.note ? `<div style="font-size:11px;color:var(--text-muted);line-height:1.55;margin-top:8px;">${w.note}</div>` : ''}
        </div>`;
      }

      const body = `
        <h3>${cfg.name}<span class="station-id"> · ${cfg.agency}</span></h3>
        <div class="now-meta">${cfg.low_limit.toFixed(2)} – ${cfg.high_limit.toFixed(2)} m operating range · ${range} m total · ${capacityFull}${capacityCite}</div>
        <div class="now-line">${pct != null ? pct.toFixed(1) : '—'}<span class="unit">% full</span></div>
        ${callout}
        <div class="detail-section">
          <div class="section-label">Current state</div>
          <div class="detail-grid">
            <div class="row"><span class="lbl">Level</span><span class="val">${snap.level_m != null ? snap.level_m.toFixed(2) + ' m' : '—'}</span></div>
            <div class="row"><span class="lbl">Volume</span><span class="val">${volume != null ? volume.toLocaleString() + ' M m³' : '—'}</span></div>
            <div class="row"><span class="lbl">Below high limit</span><span class="val">${cmFromHigh} cm</span></div>
            <div class="row"><span class="lbl">Above low limit</span><span class="val">${cmFromLow} cm</span></div>
            <div class="row"><span class="lbl">24 h change</span><span class="val">${change != null ? (change > 0 ? '+' : '') + change.toFixed(2) + ' pp' : '—'}</span></div>
            <div class="row"><span class="lbl">Last reading</span><span class="val">${ago(snap.time)}</span></div>
          </div>
        </div>
        ${wmpSection}
        <div class="detail-section">
          <div class="section-label">How "% full" is calculated</div>
          <div style="font-size:11px;color:var(--text-muted);line-height:1.55;">Linear interpolation between published high (${cfg.high_limit.toFixed(2)} m) and low (${cfg.low_limit.toFixed(2)} m) operating limits. Methodology by Contributor B; operator-published % full is not available from official sites.</div>
        </div>
      `;
      _openCardDetail(body, true);
    }

    function openOpDetail(siteId) {
      if (!opByIdCache) {
        _openCardDetail(`<h3>${siteId}</h3><div class="detail-callout info">No cached data for this station yet — try the Operations tab refresh.</div>`);
        return;
      }
      // Find meta from HQ_OPERATIONS
      let meta = null;
      for (const group of Object.values(HQ_OPERATIONS)) {
        const m = group.sites.find(s => s.id === siteId);
        if (m) { meta = m; break; }
      }
      if (!meta) {
        _openCardDetail(`<h3>${siteId}</h3><div class="detail-callout info">Unknown station id.</div>`);
        return;
      }
      const rel = opByIdCache['rel:' + meta.id];
      const series = opByIdCache._series?.[meta.id] || [];
      const total = rel?.total_cms ?? null;
      const turb = rel?.turbined_cms ?? 0;
      const spill = rel?.spilled_cms ?? 0;
      const spillFrac = total ? spill / total : 0;
      const a = meta.amont ? opByIdCache['lvl:' + meta.amont] : null;
      const v = meta.aval ? opByIdCache['lvl:' + meta.aval] : null;
      const amontSeries = meta.amont ? opByIdCache._lvlSeries?.[meta.amont] : null;

      // Held-band stat
      let bandStr = '—', rangeCm = null, flatWhileSpilling = false;
      if (amontSeries && amontSeries.length >= 2) {
        const vals = amontSeries.map(p => p.level_m).filter(x => x != null && !isNaN(x));
        if (vals.length >= 2) {
          const lo = Math.min(...vals), hi = Math.max(...vals);
          rangeCm = (hi - lo) * 100;
          bandStr = `${lo.toFixed(2)}–${hi.toFixed(2)} m · ${rangeCm.toFixed(0)} cm`;
          flatWhileSpilling = rangeCm <= 15 && spillFrac >= 0.5;
        }
      }

      // Case-file callout
      let callout = '';
      if (flatWhileSpilling) {
        callout = `<div class="detail-callout alert"><strong>Held-headpond posture detected.</strong> Amont level is held in a ${rangeCm.toFixed(0)} cm band while ${Math.round(spillFrac*100)}% of throughput is spilled. The operator could open gates wider to draw the headpond down — see case-file Exhibit D and Exhibit F.1.</div>`;
      } else if (!meta.noTurbine && spillFrac >= 0.5) {
        callout = `<div class="detail-callout warn"><strong>High spill share (${Math.round(spillFrac*100)}%).</strong> Most throughput is bypassing turbines, indicating freshet-period operation at or near hydraulic capacity for this plant.</div>`;
      }

      // Build the historical breakdown table
      const recent = series.slice(-10).reverse();  // most recent first
      const tableRows = recent.map(r => {
        const t = r.time ? new Date(r.time).toLocaleString('en-CA', { month: 'short', day: 'numeric', hour: '2-digit', hour12: false }) : '—';
        const tot = r.total_cms != null ? Math.round(r.total_cms).toLocaleString() : '—';
        const tb = r.turbined_cms != null ? Math.round(r.turbined_cms).toLocaleString() : '—';
        const sp = r.spilled_cms != null ? Math.round(r.spilled_cms).toLocaleString() : '—';
        const sf = r.total_cms ? Math.round((r.spilled_cms ?? 0) / r.total_cms * 100) : 0;
        return `<tr><td style="padding:3px 8px;font-variant-numeric:tabular-nums;">${t}</td><td style="text-align:right;padding:3px 8px;font-variant-numeric:tabular-nums;">${tot}</td><td style="text-align:right;padding:3px 8px;font-variant-numeric:tabular-nums;color:var(--blue);">${tb}</td><td style="text-align:right;padding:3px 8px;font-variant-numeric:tabular-nums;color:var(--orange);">${sp}</td><td style="text-align:right;padding:3px 8px;font-variant-numeric:tabular-nums;">${sf}%</td></tr>`;
      }).join('');

      const historySection = recent.length ? `
        <div class="detail-section">
          <div class="section-label">Recent hourly readings (most recent first)</div>
          <table style="width:100%;font-size:11px;border-collapse:collapse;">
            <thead><tr style="font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-faint);"><th style="text-align:left;padding:3px 8px;">Time</th><th style="text-align:right;padding:3px 8px;">Total</th><th style="text-align:right;padding:3px 8px;">Turb</th><th style="text-align:right;padding:3px 8px;">Spill</th><th style="text-align:right;padding:3px 8px;">% spill</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      ` : '';

      const amontSparkSection = (amontSeries && amontSeries.length >= 2) ? `
        <div class="detail-section">
          <div class="section-label">Amont (headpond) level — last ${opWindowHours} h</div>
          ${_detailSpark(amontSeries, p => p.level_m, { stroke: 'var(--red)', fill: 'rgba(224,75,74,0.10)' })}
        </div>
      ` : '';

      const body = `
        <h3>${meta.name}<span class="station-id"> · ${siteId}</span></h3>
        <div class="now-meta">${meta.subtitle || 'HQ generating station'} · last updated ${rel ? ago(rel.time) : '—'}</div>
        <div class="now-line">${total != null ? Math.round(total).toLocaleString() : '—'}<span class="unit"> m³/s total</span></div>
        ${callout}
        <div class="detail-section">
          <div class="section-label">Throughput</div>
          <div class="detail-grid">
            ${meta.noTurbine ? `
            <div class="row"><span class="lbl">Controlled release</span><span class="val">${Math.round(spill).toLocaleString()} m³/s</span></div>
            <div class="row"><span class="lbl">Turbine</span><span class="val" style="color:var(--text-faint);">— (none at this site)</span></div>
            ` : `
            <div class="row"><span class="lbl">Turbined</span><span class="val" style="color:var(--blue);">${Math.round(turb).toLocaleString()} m³/s</span></div>
            <div class="row"><span class="lbl">Spilled</span><span class="val" style="color:var(--orange);">${Math.round(spill).toLocaleString()} m³/s</span></div>
            <div class="row"><span class="lbl">% Spilled</span><span class="val">${Math.round(spillFrac*100)}%</span></div>
            <div class="row"><span class="lbl">% Turbined</span><span class="val">${Math.round((1-spillFrac)*100)}%</span></div>
            `}
          </div>
        </div>
        ${(a || v) ? `
        <div class="detail-section">
          <div class="section-label">Headpond / tailwater</div>
          <div class="detail-grid">
            ${a ? `<div class="row"><span class="lbl">Amont (headpond)</span><span class="val">${a.level_m.toFixed(2)} m</span></div>` : ''}
            ${v ? `<div class="row"><span class="lbl">Aval (tailwater)</span><span class="val">${v.level_m.toFixed(2)} m</span></div>` : ''}
            ${(a && v) ? `<div class="row"><span class="lbl">Δh head differential</span><span class="val">${(a.level_m - v.level_m).toFixed(2)} m</span></div>` : ''}
            ${rangeCm != null ? `<div class="row"><span class="lbl">Held band (${opWindowHours}h)</span><span class="val${flatWhileSpilling ? '" style="color:var(--orange);"' : '"'}>${bandStr}</span></div>` : ''}
          </div>
        </div>
        ` : ''}
        ${amontSparkSection}
        ${historySection}
      `;
      _openCardDetail(body, true);
    }

    function updateChartTitles() {
      const w = windowLabel(windowHours);
      const live = lastData && localHeroesLive();
      const waLbl = live
        ? lastData?.[1279]?.metadata?.label
        : (lastData?.[545]?.metadata?.label || '02JE013');
      const lcLbl = lastData?.[1195]?.metadata?.label;
      const crLbl = live
        ? lastData?.[1004]?.metadata?.label
        : '1-2964';
      const waName = live
        ? 'Waltham (Ottawa River — upstream)'
        : 'Mattawa (Otto Holden tailwater)';
      const crName = live
        ? 'Coulonge River tributary at Route 148'
        : 'Bryson headpond (dam pond — not the lake)';
      const waEl = document.getElementById('wa-title');
      const lcEl = document.getElementById('lc-title');
      const crEl = document.getElementById('cr-title');
      if (waEl) waEl.innerHTML = `${waName}${waLbl ? ` <span class="station-id">${waLbl}</span>` : ''} — last ${w}`;
      if (lcEl) lcEl.innerHTML = `Lac Coulonge (Ottawa River)${lcLbl ? ` <span class="station-id">${lcLbl}</span>` : ''} — last ${w}`;
      if (crEl) crEl.innerHTML = `${crName}${crLbl ? ` <span class="station-id">${crLbl}</span>` : ''} — last ${w}`;
    }

    function renderLocalGaugeStrip() {
      const el = document.getElementById('local-gauge-strip');
      if (!el) return;
      const rows = LOCAL_HYDRO_METEO_IDS.map(id => {
        const d = lastData?.[id];
        if (isLocalHeroLive(id)) return null;
        const name = id === 1279 ? 'Waltham' : 'Coulonge River at Route 148';
        const label = d?.metadata?.label || id;
        const latest = d?.readings?.length ? d.readings[d.readings.length - 1] : null;
        const level = latest ? `${displayLevel(d.metadata, latest.valeur).toFixed(3)} m` : '—';
        const when = latest ? ago(latest.date_prise_valeur) : 'no reading';
        return `<div class="strip-row"><strong>${name}</strong> <span class="station-id">${label}</span> · last known ${level} · ${when} · <a href="https://vigilance.geo.securite.gouv.qc.ca/stations/${id}" target="_blank">Hydro Météo deactivated</a></div>`;
      }).filter(Boolean);
      if (!rows.length) { el.hidden = true; el.innerHTML = ''; return; }
      el.hidden = false;
      el.innerHTML = `<div class="strip-title">Local Hydro Météo gauges — last known</div>${rows.join('')}`;
    }

    async function fetchStationHistory(stationId, hours) {
      const since = new Date(Date.now() - hours * 3600 * 1000).toISOString();
      // Same promote-to-primary rule as fetchStation: if the station has a same-gauge
      // cluster source, pull the full window from there so the 7d/14d/30d charts stay
      // live independent of the Vigilance river_readings table. Fall back to the
      // Vigilance hourly continuous-aggregate only when the cluster source is empty.
      const fb = FALLBACK_SOURCES[stationId];
      if (fb) {
        try {
          const cu = `/history/${fb.path}?${fb.key}=eq.${fb.value}&time=gte.${since}&order=time.asc&select=time,level_m`;
          const cr = await fetch(cu, { cache: 'no-store' });
          if (cr.ok) {
            const crows = (await cr.json()).filter(x => x.level_m != null);
            if (crows.length) return crows.map(x => ({ date_prise_valeur: x.time, valeur: x.level_m }));
          }
        } catch (e) {
          console.warn(`cluster history for ${stationId} failed: ${e.message}`);
        }
        // HQ dam_levels ids are not Vigilance integers — don't fall through to
        // river_readings_hourly?station_id=eq.1-2964.
        if (stationId === BRYSON_AMONT_ID) return [];
      }
      // Vigilance hourly continuous-aggregate — querying through the view gives
      // postgrest a uniformly-sized response and decimates higher-cadence sources.
      const url = `/history/river_readings_hourly?station_id=eq.${stationId}&time=gte.${since}&order=time.asc&select=time,level_m`;
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error(`history HTTP ${r.status}`);
      const rows = await r.json();
      return rows.map(x => ({ date_prise_valeur: x.time, valeur: x.level_m }));
    }

    // Fetch the single highest reading for a station within a lookback window.
    // Used to find the season's true peak even when older than the live buffer.
    // Highest and lowest reading at a station since 1 January, in its own datum.
    //
    // This replaced a rolling 90-day "season peak" (2026-09-08). A rolling window
    // silently stops meaning "this year": Lac Coulonge's freshet crest (108.63 m on
    // 20 Apr) aged out of it on 2026-08-28, after which the card labelled the 6 Jul
    // summer crest of 106.60 m "Season peak" — and fed that to rankPeak, which
    // ranks against 54 years of ANNUAL maxima. The result was the dashboard calling
    // 2026 a 2nd-percentile year when its freshet was actually 94th. A calendar
    // anchor can't decay that way.
    //
    // `level_m > 0` is load-bearing, not cosmetic: the minimum is far more fragile
    // than the maximum. Britannia (548) carries a literal 0 at 2026-08-10 16:00
    // from the MSP migration, which would otherwise publish as the year's low.
    async function fetchYearRange(stationId) {
      if (stationId === BRYSON_AMONT_ID) return fetchYearRangeDamLevel(stationId);
      const since = new Date(Date.UTC(new Date().getUTCFullYear(), 0, 1)).toISOString();
      const q = dir => `/history/river_readings?station_id=eq.${stationId}&time=gte.${since}`
        + `&level_m=gt.0&order=level_m.${dir}&limit=1&select=time,level_m`;
      const [hiR, loR] = await Promise.all([
        fetch(q('desc'), { cache: 'no-store' }),
        fetch(q('asc'), { cache: 'no-store' }),
      ]);
      if (!hiR.ok || !loR.ok) throw new Error(`year-range HTTP ${hiR.status}/${loR.status}`);
      const [hi, lo] = await Promise.all([hiR.json(), loR.json()]);
      const row = rows => rows.length
        ? { valeur: rows[0].level_m, date_prise_valeur: rows[0].time } : null;
      let max = row(hi), min = row(lo);

      // Fold in the pre-ingest seed where we have one, so the range covers the
      // whole calendar year rather than only the part we happened to record.
      const seed = (YEAR_SEED[new Date().getUTCFullYear()] || {})[stationId];
      if (seed) {
        if (seed.max && (!max || seed.max.valeur > max.valeur)) max = seed.max;
        if (seed.min && (!min || seed.min.valeur < min.valeur)) min = seed.min;
      }
      if (!max || !min) return null;
      // `wholeYear` drives the label: without a seed the range starts when our
      // ingest did, and calling that "2026" would overstate what we know.
      return { max, min, wholeYear: !!seed };
    }

    // Merge server history with the latest in-memory Vigilance readings.
    // History is authoritative for the time range; in-memory fills any gap since the last cron run.
    function mergeHistory(history, live) {
      if (!history || !history.length) return live || [];
      const lastHistTs = new Date(history[history.length - 1].date_prise_valeur).getTime();
      const tail = (live || []).filter(v => new Date(v.date_prise_valeur).getTime() > lastHistTs);
      return history.concat(tail);
    }

    async function renderWindow(stationId) {
      if (!lastData || !lastData[stationId]) return;
      const d = lastData[stationId];
      if (windowHours <= 72) {
        renderChart(stationId, d);
        return;
      }
      const key = `${stationId}:${windowHours}`;
      let history = historyCache[key];
      if (!history) {
        try {
          history = await fetchStationHistory(stationId, windowHours);
          historyCache[key] = history;
        } catch (e) {
          console.warn(`history fetch for ${stationId} failed: ${e.message}`);
          renderChart(stationId, d); // fall back to the Vigilance 72h buffer
          return;
        }
      }
      const merged = mergeHistory(history, d.readings);
      renderChart(stationId, { metadata: d.metadata, readings: merged });
    }

    function setWindow(hours) {
      windowHours = hours;
      document.querySelectorAll('.range-btn').forEach(b => {
        b.classList.toggle('active', Number(b.dataset.hours) === hours);
      });
      updateChartTitles();
      renderHeroCharts();
      // Stations / Tributaries tabs redraw too — their mini-charts share windowHours with Overview.
      if (document.querySelector('.tab-panel[data-tab="stations"].active')) {
        renderStationsTab();
      }
      if (document.querySelector('.tab-panel[data-tab="tributaries"].active')) {
        renderTributariesTab();
      }
    }

    document.getElementById('range-picker').addEventListener('click', (e) => {
      const btn = e.target.closest('.range-btn');
      if (btn) setWindow(Number(btn.dataset.hours));
    });
    document.getElementById('range-picker-stations').addEventListener('click', (e) => {
      const btn = e.target.closest('.range-btn');
      if (btn) setWindow(Number(btn.dataset.hours));
    });
    document.getElementById('range-picker-tributaries').addEventListener('click', (e) => {
      const btn = e.target.closest('.range-btn');
      if (btn) setWindow(Number(btn.dataset.hours));
    });
    document.getElementById('range-picker-operations').addEventListener('click', (e) => {
      const btn = e.target.closest('.range-btn');
      if (!btn) return;
      setOpWindow(Number(btn.dataset.hours));
    });

    function setOpWindow(hours) {
      if (!Number.isFinite(hours) || hours <= 0 || hours === opWindowHours) return;
      opWindowHours = hours;
      // Update only the Operations picker — other tabs use the global windowHours.
      document.querySelectorAll('#range-picker-operations .range-btn').forEach(b => {
        b.classList.toggle('active', Number(b.dataset.hours) === hours);
      });
      // Re-fetch with the new window. fetchHqOperations re-reads opWindowHours.
      renderOperationsTab();
    }

    document.getElementById('range-picker-flow').addEventListener('click', (e) => {
      const btn = e.target.closest('.range-btn');
      if (!btn) return;
      const days = Number(btn.dataset.days);
      if (!Number.isFinite(days) || days <= 0 || days === flowTabDays) return;
      flowTabDays = days;
      document.querySelectorAll('#range-picker-flow .range-btn').forEach(b => {
        b.classList.toggle('active', Number(b.dataset.days) === days);
      });
      renderFlowTab();
    });

    // ---- Section navigation (hash-routed) ----
    // Five top-level sections. Stations and Dams & reservoirs group several views
    // behind a segmented sub-nav; every view keeps its own hash (`#river`,
    // `#operations`, `#flow`, …) so existing deep links still land.
    const TAB_GROUPS = { stations: ['stations', 'river'], dams: ['reservoirs', 'operations', 'flow'] };
    function tabGroupOf(name) {
      for (const [group, ids] of Object.entries(TAB_GROUPS)) if (ids.includes(name)) return group;
      return name;
    }
    function activateTab(name) {
      if (!['overview', 'forecast', 'stations', 'river', 'reservoirs', 'tributaries', 'operations', 'flow'].includes(name)) name = 'overview';
      const group = tabGroupOf(name);
      const mark = (a, on) => {
        a.classList.toggle('active', on);
        if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
      };
      document.querySelectorAll('#tab-strip a').forEach(a => mark(a, a.dataset.group === group));
      document.querySelectorAll('.subtabs').forEach(n => n.classList.toggle('active', n.dataset.group === group));
      document.querySelectorAll('.subtabs a').forEach(a => mark(a, a.dataset.tab === name));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.tab === name));
      // Keep the active section visible when the strip scrolls sideways (phone).
      const strip = document.getElementById('tab-strip');
      const current = strip.querySelector('a.active');
      if (current && strip.scrollWidth > strip.clientWidth) {
        strip.scrollLeft = Math.max(0, current.offsetLeft - (strip.clientWidth - current.offsetWidth) / 2);
      }
      if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
      if (name === 'stations') renderStationsTab();
      if (name === 'river') renderRiverTab();
      if (name === 'reservoirs') renderReservoirsTab();
      if (name === 'tributaries') renderTributariesTab();
      if (name === 'operations') renderOperationsTab();
      if (name === 'flow') renderFlowTab();
    }
    document.addEventListener('click', e => {
      const a = e.target.closest('#tab-strip a[data-tab], .subtabs a[data-tab]');
      if (!a) return;
      e.preventDefault();
      activateTab(a.dataset.tab);
    });
    window.addEventListener('hashchange', () => activateTab(location.hash.slice(1) || 'overview'));

    // ---- Stations tab: 10 mini-charts in a 2-col grid ----
    const STATIONS_TAB_IDS = [951, 545, 1279, 1195, 1004, 99001, 984, 548, 550, 981, 1264];
    // Map each river gauge to its nearest weather station key for precip context.
    // Each river gauge → its nearest station in FREEZE_STATIONS, so the per-card
    // chip reflects precip *at* the gauge (matching the "nearest weather station"
    // UI wording). Val-d'Or / Rouyn-Noranda stay in FREEZE_STATIONS as upstream
    // freeze-night sensors but are too far (200–250 km) to represent any gauge.
    const GAUGE_TO_WX = {
      951: 'Temiskaming Shores, ON', 545: 'Pembroke, ON', 1279: 'Pembroke, ON',
      1195: 'Pembroke, ON', 1004: 'Pembroke, ON',
      984: 'Ottawa-Gatineau', 548: 'Ottawa-Gatineau', 550: 'Ottawa-Gatineau',
      981: 'Hawkesbury, ON', 1264: 'Hawkesbury, ON'
    };
    let stationMiniCharts = {};
    let lastWeatherCache = null;

    // ---- Summer low-water / drawdown advisory ----------------------------------
    // Boater-beware context for the recession season. There is NO authoritative
    // minimum-navigable level on the Ottawa main stem (per the local boating
    // community) — these flags are INFORMATIONAL and conditions vary locally. Two
    // signals: (1) rate of fall, computed from live readings (works on every gauge,
    // no extra data), and (2) position within the seasonal median band, for gauges
    // with a baked climatology. The warning rule: anything getting close to the
    // bottom of the seasonal band is a warning; record-low territory is a red alert.
    //
    // SEASONAL_LOW_BAND[id] = per-calendar-month [seasonalMedian_m, recordLow_m] in
    // the same datum as the displayed level. Lac Coulonge (Vigilance 1195, MASL,
    // datumOffset 0) is derived from data/lac-coulonge-daily-1990-2026.csv: median =
    // median of the per-day medians in that month; recordLow = min of the per-day
    // historic lows (1990–2026). Add other gauges here once their per-day
    // climatology is sourced (WSC HYDAT / ORRPB) — until then they get rate-only.
    const SEASONAL_LOW_BAND = {
      1195: { 1:[106.50,106.00], 2:[106.51,105.99], 3:[106.50,106.03], 4:[106.48,105.92],
              5:[106.47,105.73], 6:[106.32,105.73], 7:[106.19,105.65], 8:[106.08,105.14],
              9:[106.06,105.07], 10:[106.17,105.18], 11:[106.31,105.57], 12:[106.42,105.39] }
    };

    // Pre-ingest seed for the calendar-year range (see fetchYearRange). Our own
    // river_readings history begins 2026-04-19 for every station, so for 2026 the
    // live tier alone cannot see January–April. Lac Coulonge is seeded from the
    // daily observed levels in the same CSV SEASONAL_LOW_BAND is baked from
    // (data/lac-coulonge-daily-1990-2026.csv), covering 2026-01-01 .. 2026-04-18 —
    // the exact window the live tier misses. Datum agrees: the CSV and the live
    // tier both put the freshet crest at 108.63 m on 20 Apr.
    //
    // Baked rather than fetched: the CSV is 644 KB and is already a build-time
    // source, not a runtime one. Self-retiring — from 2027 the live tier covers
    // 1 January on its own and this whole map can be deleted.
    //
    // Stations absent here have no pre-ingest data, so their range is labelled by
    // real coverage instead of being passed off as the full year.
    const YEAR_SEED = {
      2026: {
        1195: {
          max: { valeur: 108.34, date_prise_valeur: '2026-04-18T00:00:00Z' },
          min: { valeur: 106.35, date_prise_valeur: '2026-01-01T00:00:00Z' },
        },
      },
    };
    // When a station has no seed, its range starts here rather than 1 January.
    const LIVE_TIER_START_LABEL = '19 Apr';

    // Build 0–2 low-water advisory chips for a station card.
    //   level     — displayed level (MASL), same datum as the band
    //   change24  — cm change over 24 h (negative = falling); may be null
    function lowWaterChips(id, level, change24) {
      let out = '';

      // (1) Rate of fall — all gauges. Tiers: dropping / fast drop / very fast drop.
      if (change24 != null && change24 <= -8) {
        const drop = Math.abs(change24);
        const cls  = change24 <= -30 ? 'alert' : change24 <= -15 ? 'warn' : 'watch';
        const word = change24 <= -30 ? 'very fast drop' : change24 <= -15 ? 'fast drop' : 'dropping';
        out += `<span class="lowwater-chip ${cls}" title="Level fell ${drop.toFixed(0)} cm in the last 24 h — informational drawdown advisory; conditions vary locally, boater beware">↓ ${drop.toFixed(0)} cm/24h · ${word}</span>`;
      }

      // (2) Seasonal median band — gauges with a baked climatology.
      const band = SEASONAL_LOW_BAND[id];
      if (band && level != null) {
        const mo = new Date().getMonth() + 1;
        const mb = band[mo];
        if (mb) {
          const [med, low] = mb;
          const nearBottom = low + 0.25 * (med - low);   // bottom quartile of the band
          const bandTxt = `${med.toFixed(2)}–${low.toFixed(2)} m`;
          if (level <= low + 0.05) {
            out += `<span class="lowwater-chip alert" title="At or below the record low for this month (record ${low.toFixed(2)} m across 1990–2026). Informational; conditions vary locally.">⚠ record-low territory</span>`;
          } else if (level <= nearBottom) {
            out += `<span class="lowwater-chip warn" title="Near the bottom of the seasonal band (this month: median ${med.toFixed(2)} m down to record low ${low.toFixed(2)} m). Informational low-water advisory.">near seasonal low (band ${bandTxt})</span>`;
          } else if (level < med) {
            const cm = Math.round((med - level) * 100);
            out += `<span class="lowwater-chip watch" title="Below the seasonal median for this month (${med.toFixed(2)} m). Informational.">${cm} cm below seasonal median</span>`;
          }
        }
      }
      return out;
    }

    function buildStationCard(id) {
      const station = lastData?.[id];
      if (!station?.metadata) return `<div class="station-card-mini" data-station-id="${id}"><div class="meta">Loading ${id}…</div></div>`;
      const m = station.metadata;
      const latest = station.readings?.[station.readings.length - 1];
      // A station can return metadata with no readings (e.g. its Vigilance feed is
      // mid-outage and no cluster fallback covers that gauge). Render a graceful
      // "no recent data" card rather than throwing — one dataless gauge must never
      // blank the entire grid (it used to: the throw aborted the whole .map()).
      if (!latest) {
        const nm = (STATION_NAMES[id] && STATION_NAMES[id][mapLang]) || m.label || `${id}`;
        const idChip = m.label ? `<span class="station-id">${m.label}</span>` : '';
        return `<div class="station-card-mini" data-station-id="${id}" onclick="openBarDetail(${id})">
          <div class="header-row"><div class="name">${nm}${idChip}</div></div>
          <div class="meta">${m.description || ''}</div>
          <div class="meta" style="opacity:0.7;">No recent data</div>
        </div>`;
      }
      const stale = isSeriesStale(station);
      const dispCurrent = displayLevel(m, latest.valeur);
      const change = stale ? null : dailyChangeCm(station.readings);
      const changeArrow = change == null ? '' : (change > 0.5 ? '↑' : change < -0.5 ? '↓' : '→');
      const changeCls = change == null ? '' : (change > 0.5 ? 'up' : change < -0.5 ? 'down' : 'flat');
      const changeText = change == null ? '' : `<span class="change ${changeCls}">${changeArrow} ${change > 0 ? '+' : ''}${change.toFixed(1)} cm/24h</span>`;

      const eff = getEffectiveEtat(m);
      const ETAT_NAMES = { 6: 'Major flood', 5: 'Near major', 4: 'Moderate', 3: 'Minor', 2: 'Pre-alert', 1: 'Normal', 0: 'No threshold' };
      const synthetic = isEffectiveEtatSynthetic(m);
      const stateBadgeCls = eff >= 5 ? 'badge major' : eff >= 3 ? 'badge near' : 'badge peaked';
      const stateBadge = eff != null ? `<span class="${stateBadgeCls}">${ETAT_NAMES[eff] || ''}${synthetic ? ' (est.)' : ''}</span>` : '';

      const orrpb = getOrrpbContext(m);
      const orrpbChip = orrpb ? `<span class="orrpb-chip" title="ORRPB reference">${orrpb.context}</span>` : '';

      // Percentile chip (Lac Coulonge against 54-yr ORRPB record; others against ECCC peaks if available).
      let pctlChip = '';
      if (id === 1195) {
        const yrMax = lastYearRanges[1195] && lastYearRanges[1195].max;
        const peakLevel = (yrMax && yrMax.valeur > latest.valeur) ? yrMax.valeur : latest.valeur;
        const rank = rankPeak(peakLevel);
        const pctl = Math.round(((HISTORICAL_RECORD_YEARS - rank + 1) / HISTORICAL_RECORD_YEARS) * 100);
        pctlChip = `<span class="pctl-chip ${pctl >= 90 ? 'high' : ''}" title="Year's peak ${peakLevel.toFixed(2)} m ranks ${ordinal(rank)} of ${HISTORICAL_RECORD_YEARS} on record (1972–2025)">${ordinal(pctl)} %ile (1972–2025)</span>`;
      } else if (m.label && WSC_ID_PATTERN.test(m.label) && eccPeakCache[m.label]) {
        const peaks = eccPeakCache[m.label];
        const above = peaks.filter(p => latest.valeur >= p).length;
        const pctl = Math.round((above / peaks.length) * 100);
        pctlChip = `<span class="pctl-chip ${pctl >= 90 ? 'high' : ''}" title="Current reading vs. ECCC ${peaks.length}-yr annual peak record">${pctl}th %ile (ECCC ${peaks.length}-yr)</span>`;
      }

      // 48 h precip forecast at the nearest weather station.
      let precipChip = '';
      const wxName = GAUGE_TO_WX[id];
      if (wxName && lastWeatherCache) {
        const wx = lastWeatherCache.find(w => w.station.name === wxName);
        if (wx?.hourly) {
          const mm = next48hPrecip(wx.hourly);
          const cls = mm >= 20 ? 'rain-heavy' : mm >= 5 ? 'rain-moderate' : 'rain-light';
          precipChip = `<span class="precip-chip ${cls}" title="Forecast precipitation next 48 hours at ${wxName}">☔ ${mm.toFixed(1)} mm/48h · ${wxName}</span>`;
        }
      }

      const labelChip = m.label ? `<span class="station-id">${m.label}</span>` : '';
      const stationName = (STATION_NAMES[id] && STATION_NAMES[id][mapLang]) || m.label || `${id}`;
      const lastKnown = stale ? `<span class="meta" style="font-style:italic;opacity:0.8">Last known ${ago(latest.date_prise_valeur)}</span>` : '';
      return `<div class="station-card-mini${stale ? ' stale' : ''}" data-station-id="${id}" onclick="openBarDetail(${id})">
        <div class="header-row">
          <div class="name">${stationName}${labelChip}</div>
          <div class="level">${dispCurrent.toFixed(2)}<span class="unit">m</span>${changeText}</div>
        </div>
        <div class="meta">${m.description || ''}</div>
        ${lastKnown}
        <div class="chart-wrap"><canvas id="stn-chart-${id}"></canvas></div>
        <div class="badge-row">${hydroMeteoDeactivatedChip(id)}${stateBadge}${lowWaterChips(id, dispCurrent, change)}${orrpbChip}${pctlChip}${precipChip}</div>
      </div>`;
    }

    // Bumped on every renderStationsTab() call so in-flight async station/history
    // fetches from a previous render (or a previous window selection) know to drop
    // their result instead of patching a card that's since been rebuilt.
    let stationsRenderGen = 0;

    // Replace a single card's DOM node in place and (re)draw its mini-chart. Used
    // when an async station or history fetch lands after the grid was painted.
    function refreshStationCard(id) {
      const grid = document.getElementById('stations-grid');
      const el = grid?.querySelector(`.station-card-mini[data-station-id="${id}"]`);
      if (!el) return;
      if (stationMiniCharts[id]) { try { stationMiniCharts[id].destroy(); } catch (_) {} delete stationMiniCharts[id]; }
      el.outerHTML = buildStationCard(id);
      renderStationMiniChart(id);
    }

    function renderStationsTab() {
      const grid = document.getElementById('stations-grid');
      if (!grid || !lastData) return;
      const gen = ++stationsRenderGen;

      // Paint immediately with whatever's already cached — stations without data
      // yet show a "Loading…" placeholder card (see buildStationCard). One slow or
      // unreachable upstream no longer blocks the whole grid.
      Object.values(stationMiniCharts).forEach(c => { try { c.destroy(); } catch (_) {} });
      stationMiniCharts = {};
      // Build each card defensively — a throw in one card must never abort the
      // whole .map() and leave the grid blank (the bug this guards against).
      grid.innerHTML = STATIONS_TAB_IDS.map(id => {
        try { return buildStationCard(id); }
        catch (e) {
          console.warn(`station card ${id} failed to build: ${e.message}`);
          return `<div class="station-card-mini" data-station-id="${id}"><div class="meta">${id}: unavailable</div></div>`;
        }
      }).join('');
      STATIONS_TAB_IDS.forEach(id => renderStationMiniChart(id));

      // Fill in the rest asynchronously, patching each card as its data arrives.
      // (Overview's regional fetch also populates lastData; first-to-finish wins.)
      STATIONS_TAB_IDS.forEach(async id => {
        if (lastData[id]) return;
        const mvcaSpec = REGIONAL_STATIONS.find(s => s.id === id && s.source === 'mvca');
        try {
          const d = mvcaSpec ? await fetchKiwisStation(mvcaSpec) : await fetchStation(id);
          lastData[id] = d;
          if (gen === stationsRenderGen) refreshStationCard(id);
        } catch (e) { console.warn(`stn ${id}: ${e.message}`); }
      });

      // History for >72h windows — cards render off live readings first, then
      // upgrade to the full series once history lands.
      if (windowHours > 72) {
        const histWindow = windowHours;
        STATIONS_TAB_IDS.forEach(async id => {
          const key = `${id}:${histWindow}`;
          if (historyCache[key]) return;
          try {
            historyCache[key] = await fetchStationHistory(id, histWindow);
            if (gen === stationsRenderGen && lastData[id]) refreshStationCard(id);
          } catch (e) { console.warn(`history ${id}: ${e.message}`); }
        });
      }
    }

    // ---- River profile tab (compact N→S longitudinal strip) -------------------
    // One slim row per gauge in upstream→downstream (≈N→S) order — a Buffalo-style
    // glance-able strip of the whole corridor. Shares STATIONS_TAB_IDS (already
    // curated N→S) and the low-water logic with the All-stations grid.
    const SEV = { normal: 0, watch: 1, warn: 2, alert: 3 };
    const RIVER_TIER_COLOR = { normal: 'var(--green)', watch: 'var(--amber)', warn: 'var(--orange)', alert: 'var(--red)' };

    // Single dominant low-water status for a gauge: most severe of rate-of-fall and
    // seasonal-band signals, with the flood side winning if a real high-water state
    // is set (so a flooding gauge is never mislabelled "Normal").
    function lowWaterStatus(id, m, level, change24) {
      let tier = 'normal', label = 'Normal';
      const bump = (t, l) => { if (SEV[t] > SEV[tier]) { tier = t; label = l; } };
      if (change24 != null && change24 <= -8) {
        if (change24 <= -30) bump('alert', 'very fast drop');
        else if (change24 <= -15) bump('warn', 'fast drop');
        else bump('watch', 'dropping');
      }
      const band = SEASONAL_LOW_BAND[id];
      if (band && level != null) {
        const mb = band[new Date().getMonth() + 1];
        if (mb) {
          const [med, low] = mb;
          if (level <= low + 0.05) bump('alert', 'record-low territory');
          else if (level <= low + 0.25 * (med - low)) bump('warn', 'near seasonal low');
          else if (level < med) bump('watch', 'below seasonal median');
        }
      }
      const eff = m ? getEffectiveEtat(m) : null;
      if (eff != null && eff >= 3) { tier = 'alert'; label = eff >= 5 ? 'major flood' : eff >= 4 ? 'moderate flood' : 'minor flood'; }
      return { tier, label };
    }

    // Lightweight inline-SVG sparkline from a reading series (no Chart.js — these
    // rows are slim and there can be a dozen of them).
    function sparklineSVG(readings, color, w = 96, h = 22) {
      const series = (readings || []).map(r => r.valeur).filter(v => v != null).slice(-120);
      if (series.length < 2) return `<svg class="river-spark" width="${w}" height="${h}"></svg>`;
      const min = Math.min(...series), max = Math.max(...series), range = (max - min) || 1, pad = 2;
      const pts = series.map((v, i) => {
        const x = pad + (i / (series.length - 1)) * (w - 2 * pad);
        const y = pad + (1 - (v - min) / range) * (h - 2 * pad);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      return `<svg class="river-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
    }

    function buildRiverRow(id) {
      const station = lastData?.[id];
      const name = (STATION_NAMES[id] && STATION_NAMES[id][mapLang]) || station?.metadata?.label || `${id}`;
      const idChip = station?.metadata?.label ? `<span class="station-id">${station.metadata.label}</span>` : '';
      if (!station?.metadata || !station.readings?.length) {
        return `<div class="river-row nodata" data-station-id="${id}"><span class="river-dot normal"></span><span class="river-name">${name}${idChip}</span><span class="river-spark-wrap"></span><span class="river-level">—</span><span class="river-change"></span><span class="river-status">No recent data</span></div>`;
      }
      const stale = isSeriesStale(station);
      const m = station.metadata;
      const latest = station.readings[station.readings.length - 1];
      const level = displayLevel(m, latest.valeur);
      const change = stale ? null : dailyChangeCm(station.readings);
      const st = stale
        ? { tier: 'watch', label: LOCAL_HYDRO_METEO_IDS.includes(id)
            ? 'Last known · Hydro Météo deactivated'
            : `Last known ${ago(latest.date_prise_valeur)}` }
        : lowWaterStatus(id, m, level, change);
      const arrow = change == null ? '' : (change > 0.5 ? '↑' : change < -0.5 ? '↓' : '→');
      const chCls = change == null ? '' : (change > 0.5 ? 'up' : change < -0.5 ? 'down' : 'flat');
      const chTxt = change == null ? (stale ? ago(latest.date_prise_valeur) : '') : `${arrow} ${change > 0 ? '+' : ''}${change.toFixed(1)}`;
      return `<div class="river-row${stale ? ' stale' : ''}" data-station-id="${id}" onclick="openBarDetail(${id})">
        <span class="river-dot ${st.tier}"></span>
        <span class="river-name">${name}${idChip}</span>
        <span class="river-spark-wrap">${sparklineSVG(station.readings, RIVER_TIER_COLOR[st.tier])}</span>
        <span class="river-level">${level.toFixed(2)}<span class="unit">m</span></span>
        <span class="river-change ${chCls}">${chTxt}${change != null ? '<span class="rate-unit"> cm/24h</span>' : ''}</span>
        <span class="river-status ${st.tier}">${st.label}</span>
      </div>`;
    }

    function refreshRiverRow(id) {
      const list = document.getElementById('river-list');
      const row = list?.querySelector(`.river-row[data-station-id="${id}"]`);
      if (row) row.outerHTML = buildRiverRow(id);
    }

    let riverRenderGen = 0;
    function renderRiverTab() {
      const list = document.getElementById('river-list');
      if (!list || !lastData) return;
      const gen = ++riverRenderGen;
      list.innerHTML = STATIONS_TAB_IDS.map(id => {
        try { return buildRiverRow(id); }
        catch (e) {
          console.warn(`river row ${id} failed to build: ${e.message}`);
          return `<div class="river-row nodata" data-station-id="${id}"><span class="river-dot normal"></span><span class="river-name">${id}</span><span class="river-spark-wrap"></span><span class="river-level">—</span><span class="river-change"></span><span class="river-status">unavailable</span></div>`;
        }
      }).join('');
      // Fill any gauges not yet in lastData, patching each row as it lands.
      STATIONS_TAB_IDS.forEach(async id => {
        if (lastData[id]) return;
        const mvcaSpec = REGIONAL_STATIONS.find(s => s.id === id && s.source === 'mvca');
        try {
          const d = mvcaSpec ? await fetchKiwisStation(mvcaSpec) : await fetchStation(id);
          lastData[id] = d;
          if (gen === riverRenderGen) refreshRiverRow(id);
        } catch (e) { console.warn(`river fetch ${id}: ${e.message}`); }
      });
    }

    // ---- Reservoirs tab ----
    // Hand-curated upstream → downstream order. Reservoirs sit on different
    // sub-basins (Ottawa main stem, Montreal River, Kipawa, Madawaska, Gatineau,
    // Lièvre); we sort them by where each tributary joins the Ottawa, with the
    // upstream-of-Mansfield set first and downstream-of-Mansfield set after.
    const RESERVOIR_ORDER = [
      // Upper Ottawa main stem
      'rapide_7',              // Decelles-Rapid VII
      'dozois',
      'quinze',
      // Tributaries entering at/above Lake Timiskaming
      'lady_evelyn',           // Montreal River → Ottawa near Mattawa
      'kipawa',                // Kipawa River → Ottawa at Témiscaming
      // Lake Timiskaming itself
      'timiskaming_haileybury',
      'timiskaming',
      // Ottawa main stem between Mattawa and Pembroke
      'des_joachims',
      // ─── Lac Coulonge / Mansfield property ───
      // Tributaries joining the Ottawa downstream of Mansfield
      'bark_lake',             // Madawaska → Ottawa at Arnprior
      'cabonga',               // Gens de Terre → Gatineau → Ottawa at Hull
      'baskatong',             // Gatineau → Ottawa at Hull
      'mitchinamecus',         // Lièvre headwaters
      'kiamika',               // Lièvre
      'poisson_blanc'          // Lièvre → Ottawa at Masson
    ];
    const RESERVOIR_ORDER_INDEX = Object.fromEntries(RESERVOIR_ORDER.map((id, i) => [id, i]));
    let reservoirLimitsCache = null;
    let reservoirSnapshotCache = null;

    async function ensureReservoirLimits() {
      if (reservoirLimitsCache) return reservoirLimitsCache;
      try {
        const r = await fetch('/reservoir-limits.json', { cache: 'no-store' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        reservoirLimitsCache = await r.json();
      } catch (e) {
        console.warn(`reservoir-limits fetch: ${e.message}`);
        reservoirLimitsCache = { reservoirs: {}, _calibrated: false };
      }
      return reservoirLimitsCache;
    }

    // One PostgREST query fetches the latest reading per reservoir AND the
    // reading from ~24 h ago (for the daily-change indicator).
    async function fetchReservoirSnapshot() {
      // Latest per reservoir (view).
      const latestR = await fetch('/history/latest_reservoir_readings', { cache: 'no-store' });
      if (!latestR.ok) throw new Error(`latest reservoir HTTP ${latestR.status}`);
      const latest = await latestR.json();
      // Pull a 7-day window for prior-day matching. Wider than strictly needed
      // (~50 h would suffice) but it's a tiny payload and gives the daily-change
      // search resilience if a scrape is missed. Tiny ~100-row response.
      const since = new Date(Date.now() - 7 * 24 * 3600 * 1000).toISOString();
      const histR = await fetch(`/history/reservoir_readings?time=gte.${since}&order=time.asc`, { cache: 'no-store' });
      const history = histR.ok ? await histR.json() : [];
      const byRid = {};
      for (const r of history) (byRid[r.reservoir_id] ||= []).push(r);
      return latest.map(l => {
        const series = byRid[l.reservoir_id] || [];
        const latestT = new Date(l.time).getTime();
        const targetT = latestT - 24 * 3600 * 1000;
        let prior = null, bestDiff = Infinity;
        for (const r of series) {
          const t = new Date(r.time).getTime();
          // Reject readings that are too close to the latest — without this, a
          // narrow series can match the latest point against itself and produce
          // a "0 change" / "flat" indicator everywhere.
          if (latestT - t < 12 * 3600 * 1000) continue;
          const dt = Math.abs(t - targetT);
          if (dt < bestDiff && r.level_m != null) { prior = r; bestDiff = dt; }
        }
        return { ...l, prior_level_m: prior?.level_m ?? null };
      });
    }

    function pctFull(level, low, high) {
      if (level == null || high <= low) return null;
      return Math.max(0, Math.min(110, ((level - low) / (high - low)) * 100));
    }

    function fillClass(pct) {
      if (pct == null) return 'fill-unknown';
      if (pct >= 90) return 'fill-near';
      if (pct >= 80) return 'fill-high';
      if (pct >= 65) return 'fill-mid';
      return 'fill-low';
    }

    function fillBarColor(pct) {
      if (pct == null) return 'var(--border)';
      if (pct >= 90) return 'rgb(224,75,74)';
      if (pct >= 80) return 'rgb(224,127,47)';
      if (pct >= 65) return 'rgb(245,200,66)';
      return 'rgb(76,175,80)';
    }

    function buildReservoirCard(snap, cfg, release) {
      const pct = pctFull(snap.level_m, cfg.low_limit, cfg.high_limit);
      const priorPct = pctFull(snap.prior_level_m, cfg.low_limit, cfg.high_limit);
      const change = (pct != null && priorPct != null) ? pct - priorPct : null;
      const cls = fillClass(pct);
      const barColor = fillBarColor(pct);
      const barWidth = pct != null ? Math.min(100, pct) : 0;
      const volume = (pct != null && cfg.capacity_mcm != null) ? Math.round(cfg.capacity_mcm * pct / 100) : null;
      const volumeStr = volume != null
        ? `${volume.toLocaleString()} M m³ / ${Math.round(cfg.capacity_mcm).toLocaleString()}`
        : (cfg.capacity_mcm == null ? '—' : '—');
      const changeText = change == null
        ? '—'
        : Math.abs(change) < 0.05
          ? '→ flat'
          : change > 0
            ? `↑ +${change.toFixed(2)} pp/24h`
            : `↓ ${change.toFixed(2)} pp/24h`;
      const changeCls = change == null
        ? 'flat'
        : Math.abs(change) < 0.05 ? 'flat' : change > 0 ? 'up' : 'down';
      const reading = snap.level_m != null ? `${snap.level_m.toFixed(2)} m` : '—';
      // Des Joachims gets an operational-state pill — see desJoachimsOpState().
      let opStateLine = '';
      if (snap.reservoir_id === 'des_joachims') {
        const state = desJoachimsOpState(change);
        if (state) opStateLine = `<div class="res-op-state ${state.cls}" title="Triggered when Des Joachims is approximately stable AND Mattawa is at near-major (etat 5) or major (6) flood. Storing water at Des Joachims would back up Mattawa further, so the reservoir is run as pure run-of-river.">${state.label}</div>`;
      }
      // Live outflow line — only shown when reservoir-limits.json declared an
      // outflow_site_id AND the hq-ingest cron has populated dam_releases for it.
      // Total m³/s + spill share, since high spill at a constrained reservoir is
      // the operational signal worth flagging.
      let outflowLine = '';
      if (release && release.total_cms != null) {
        const total = Math.round(release.total_cms).toLocaleString();
        const spillFrac = release.spilled_cms && release.total_cms
          ? Math.round((release.spilled_cms / release.total_cms) * 100) : 0;
        const spillTag = spillFrac >= 50 ? `<span style="color:var(--orange);font-weight:600;"> · ${spillFrac}% spill</span>`
                        : spillFrac > 0  ? ` · ${spillFrac}% spill` : '';
        outflowLine = `<div class="res-outflow" title="Total release at the dam (turbined + spilled), live from Hydro-Québec open data.&#10;Last update: ${ago(release.time)}">↳ ${total} m³/s out${spillTag}</div>`;
      } else if (snap.flow_cms != null) {
        // Fallback: outflow scraped from the ORRPB conditions page (no spill
        // breakdown). Covers the OPG / MELCC / PSPC dams not in the HQ open data.
        outflowLine = `<div class="res-outflow" title="Outflow at the dam — ORRPB conditions page, average daily flow.&#10;Last update: ${ago(snap.time)}">↳ ${Math.round(snap.flow_cms).toLocaleString()} m³/s out</div>`;
      }
      return `
        <div class="res-card clickable ${cls}" data-reservoir-id="${snap.reservoir_id}" onclick="openReservoirDetail('${snap.reservoir_id}')" title="${cfg.name} (${cfg.agency}) — click for detail&#10;Reading: ${reading}&#10;Range: ${cfg.low_limit.toFixed(2)} – ${cfg.high_limit.toFixed(2)} m">
          <div class="res-name">${cfg.name}<span class="agency">${cfg.agency}</span></div>
          <div class="res-pct">${pct != null ? pct.toFixed(1) : '—'}<span class="unit">% full</span></div>
          <div class="res-volume">${volumeStr}</div>
          <div class="res-change ${changeCls}" title="pp = percentage points of the operating band, day over day between ORRPB daily values">${changeText}</div>
          ${outflowLine}
          ${opStateLine}
          <div class="res-bar"><div class="res-bar-fill" style="width:${barWidth}%; background:${barColor}"></div></div>
        </div>
      `;
    }

    async function renderReservoirsTab() {
      const grid = document.getElementById('reservoirs-grid');
      const status = document.getElementById('reservoir-status-line');
      const calibWarn = document.getElementById('reservoir-calibration-warning');
      if (!grid) return;
      // The cascade storage chart has its own data path (derived views) and its
      // own failure message, so a missing view never blanks the cards or vice versa.
      renderStorageProxy();
      const limitsCfg = await ensureReservoirLimits();
      if (calibWarn) calibWarn.style.display = limitsCfg._calibrated ? 'none' : 'block';
      let snapshot, releases;
      try {
        [snapshot, releases] = await Promise.all([
          fetchReservoirSnapshot(),
          // Best-effort — if hq-ingest hasn't run, just skip the outflow line on cards.
          fetch('/history/latest_dam_releases', { cache: 'no-store' })
            .then(r => r.ok ? r.json() : [])
            .catch(() => []),
        ]);
        reservoirSnapshotCache = snapshot;
      } catch (e) {
        grid.innerHTML = `<div class="error" style="grid-column:1/-1;color:var(--red);font-size:13px;padding:14px;">Could not load reservoir data: ${e.message}.<br>Has the daily scrape run yet? <code>kubectl -n data get cronjobs reservoir-ingest</code></div>`;
        return;
      }
      const releaseBySite = Object.fromEntries((releases || []).map(r => [r.site_id, r]));
      if (!snapshot.length) {
        grid.innerHTML = `<div style="grid-column:1/-1;color:var(--text-muted);font-size:13px;padding:14px;">No reservoir readings in the database yet — the daily scrape runs at 21:30 UTC. Trigger a manual run with: <code>kubectl -n data create job --from=cronjob/reservoir-ingest reservoir-ingest-now</code></div>`;
        return;
      }
      const cfg = limitsCfg.reservoirs || {};
      // Sort upstream → downstream by hydrological position so visitors can read
      // the basin in the same direction water actually flows. The colour-coded
      // fill bars still flag the most-constrained reservoirs at a glance.
      const enriched = snapshot
        .filter(s => cfg[s.reservoir_id])
        .map(s => ({ snap: s, cfg: cfg[s.reservoir_id] }))
        .map(x => ({ ...x, pct: pctFull(x.snap.level_m, x.cfg.low_limit, x.cfg.high_limit) }))
        .sort((a, b) => {
          const ai = RESERVOIR_ORDER_INDEX[a.snap.reservoir_id] ?? 999;
          const bi = RESERVOIR_ORDER_INDEX[b.snap.reservoir_id] ?? 999;
          return ai - bi;
        });

      // Insert a "Mansfield" boundary row between des_joachims and the first
      // downstream-of-Mansfield reservoir (bark_lake).
      const html = [];
      let boundaryEmitted = false;
      const desJoachimsIdx = RESERVOIR_ORDER_INDEX['des_joachims'];
      for (const item of enriched) {
        const itemIdx = RESERVOIR_ORDER_INDEX[item.snap.reservoir_id] ?? 999;
        if (!boundaryEmitted && itemIdx > desJoachimsIdx) {
          html.push('<div class="reservoir-boundary">▼ Lac Coulonge / Mansfield ▼<span>Reservoirs below this line drain into tributaries that join the Ottawa downstream of Mansfield (Madawaska / Gatineau / Lièvre).</span></div>');
          boundaryEmitted = true;
        }
        const release = item.cfg.outflow_site_id ? releaseBySite[item.cfg.outflow_site_id] : null;
        html.push(buildReservoirCard(item.snap, item.cfg, release));
      }
      grid.innerHTML = html.join('');
      // Best-effort and self-hiding: never awaited into the card render path.
      renderDrawdown(enriched);
      if (status && snapshot.length) {
        const newest = snapshot.reduce((acc, s) => new Date(s.time) > new Date(acc.time) ? s : acc, snapshot[0]);
        status.textContent = `${snapshot.length} reservoirs · most recent reading ${ago(newest.time)}`;
      }
    }

    // ---- Drawdown to April 1 (Reservoirs tab, autumn/winter only) ----
    // Reservoirs are drawn down over the winter to make room for the melt, and
    // April 1 is the conventional "how empty did they get" date. "Empty" is not
    // literal and differs a lot by reservoir (Cabonga typically sits near two
    // thirds of its band on April 1, Baskatong near 15%), so the reference here is
    // each reservoir's own April 1: ORRPB's long-term median for that calendar day
    // (carried on every orrpb_station_history row) and last spring's observed level.
    // It is a typical level, not an operator target; operators publish no target.
    const DRAWDOWN_SEASON_START_MONTH = 8;   // September (0-based) through March

    // Season + the two April 1s that matter, from a Date. Pure, for testing.
    function drawdownSeason(now) {
      const y = now.getUTCFullYear(), m = now.getUTCMonth();
      const inSeason = m >= DRAWDOWN_SEASON_START_MONTH || m < 3;
      const nextYear = m < 3 ? y : y + 1;          // the April 1 being drawn down to
      const next = Date.UTC(nextYear, 3, 1);
      const today = Date.UTC(y, m, now.getUTCDate());
      return { inSeason, nextYear, refYear: nextYear - 1, daysLeft: Math.round((next - today) / 86400000) };
    }

    // items: [{ id, name, level_m, low, high, capacity_mcm }]
    // refRows: orrpb_station_history rows for Mar 29 – Apr 1 of the reference year
    //          ({ station, time, observed, median }); the latest row per station wins.
    // Returns per-reservoir rows, the cascade volume above typical and how many
    // reservoirs make it up. Pure.
    function computeDrawdown(items, refRows) {
      const ref = {};
      for (const r of refRows || []) {
        const cur = ref[r.station];
        if (!cur || String(r.time) > String(cur.time)) ref[r.station] = r;
      }
      const rows = [];
      let surplusMcm = 0, counted = 0;
      for (const it of items) {
        const r = ref[String(it.id).replace(/_/g, '-')];
        const nowPct = pctFull(it.level_m, it.low, it.high);
        const typicalPct = r ? pctFull(r.median, it.low, it.high) : null;
        if (nowPct == null || typicalPct == null) continue;
        const lastPct = pctFull(r.observed, it.low, it.high);
        const gapPp = nowPct - typicalPct;
        const gapMcm = it.capacity_mcm != null ? it.capacity_mcm * gapPp / 100 : null;
        // counted = reservoirs contributing to the surplus, so the headline's
        // "above typical, N reservoirs" never counts one that is below typical.
        if (gapMcm != null && gapMcm > 0) { counted++; surplusMcm += gapMcm; }
        rows.push({ id: it.id, name: it.name, nowPct, typicalPct, lastPct, gapPp, gapMcm });
      }
      return { rows, surplusMcm, counted };
    }

    async function renderDrawdown(enriched) {
      const section = document.getElementById('drawdown-section');
      if (!section) return;
      const season = drawdownSeason(new Date());
      if (!season.inSeason) { section.style.display = 'none'; return; }
      let refRows;
      try {
        const y = season.refYear;
        const r = await fetch(`/history/orrpb_station_history?metric=eq.level_m&time=gte.${y}-03-29&time=lte.${y}-04-01&select=station,time,observed,median&order=time.asc`, { cache: 'no-store' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        refRows = await r.json();
      } catch (e) {
        // A missing history table must not take the cards down with it.
        console.warn(`drawdown reference fetch: ${e.message}`);
        section.style.display = 'none';
        return;
      }
      const items = enriched.map(x => ({
        id: x.snap.reservoir_id, name: x.cfg.name, level_m: x.snap.level_m,
        low: x.cfg.low_limit, high: x.cfg.high_limit, capacity_mcm: x.cfg.capacity_mcm,
      }));
      const { rows, surplusMcm, counted } = computeDrawdown(items, refRows);
      if (!rows.length) { section.style.display = 'none'; return; }
      const clamp = v => Math.max(0, Math.min(100, v));
      document.getElementById('drawdown-sub').textContent =
        `${season.daysLeft} days to April 1, ${season.nextYear}. The dark segment is water sitting above each reservoir's typical April 1 level.`;
      document.getElementById('drawdown-total').textContent = `${(surplusMcm / 1000).toFixed(1)} B m³`;
      document.getElementById('drawdown-total-sub').textContent = `above typical, ${counted} reservoirs`;
      document.getElementById('drawdown-legend-last').textContent = `Level on Apr 1, ${season.refYear}`;
      // Largest volume first; reservoirs with no capacity figure sink to the end.
      const sorted = rows.slice().sort((a, b) => (b.gapMcm ?? -Infinity) - (a.gapMcm ?? -Infinity));
      const header = `
        <div class="drawdown-row dd-header">
          <div>Reservoir</div>
          <div class="dd-scale"><span>0%</span><span>50% full</span><span>100%</span></div>
          <div><abbr title="Percent full today, on the operating band">Now</abbr></div><div class="dd-typhead dd-typtxt"><abbr title="Percent full at ORRPB's long-term median level for April 1. Not an operator target.">Typical</abbr></div><div><abbr title="Now minus typical, in percentage points (pp): 75% full now against 15% typical is +60 pp">Excess</abbr></div><div><abbr title="The excess as water volume. M m³ = million cubic metres; B m³ = billion.">Volume</abbr></div>
        </div>`;
      document.getElementById('drawdown-list').innerHTML = header + sorted.map(r => {
        const now = clamp(r.nowPct), typ = clamp(r.typicalPct);
        const base = Math.min(now, typ), ex = Math.max(0, now - typ);
        const below = r.gapPp < 0;
        const gap = `${below ? '−' : '+'}${Math.abs(r.gapPp).toFixed(1)} pp`;
        const vol = r.gapMcm == null ? '—'
          : `${r.gapMcm < 0 ? '−' : ''}${Math.abs(Math.round(r.gapMcm)).toLocaleString()} M m³`;
        const last = r.lastPct != null
          ? `<div class="dd-last" style="left:${clamp(r.lastPct).toFixed(1)}%"></div>` : '';
        const tip = `${r.name}: ${r.nowPct.toFixed(1)}% full now · typical April 1 ${r.typicalPct.toFixed(1)}%` +
          (r.lastPct != null ? ` · April 1, ${season.refYear}: ${r.lastPct.toFixed(1)}%` : '');
        return `
          <div class="drawdown-row" title="${tip}">
            <div class="dd-name">${r.name}</div>
            <div class="dd-track">
              <div class="dd-typ" style="width:${base.toFixed(1)}%"></div>
              <div class="dd-ex" style="left:${typ.toFixed(1)}%;width:${ex.toFixed(1)}%"></div>
              ${last}
            </div>
            <div class="dd-now">${r.nowPct.toFixed(1)}%</div>
            <div class="dd-typtxt">${r.typicalPct.toFixed(1)}%</div>
            <div class="dd-gap${below ? ' below' : ''}" title="pp = percentage points: ${r.nowPct.toFixed(1)}% now minus ${r.typicalPct.toFixed(1)}% typical">${gap}</div>
            <div title="M m³ = million cubic metres">${vol}</div>
          </div>`;
      }).join('');
      section.style.display = '';
    }

    // ---- Cascade storage proxy (Reservoirs tab chart) ----
    // reservoir_storage_proxy_total is a derived view in the data tier:
    //   scale × Σ ICOLD usable capacity × clamp((level − lower) / (upper − lower), 0, 1) ^ exponent
    // over the 13 principal reservoirs, from ORRPB's daily levels + 1991–2020
    // medians and the Operation band on each ORRPB location page. The single
    // calibration row (exponent / scale, fitted to ORRPB's own "water stored in
    // principal reservoirs" chart, 2026 Spring Freshet Review p.4) is read from
    // reservoir_storage_proxy_calibration and shown under the chart. The view
    // withholds the total on any day not all 13 reported, which the chart draws
    // as a gap rather than a drawdown. Label it a proxy wherever it is shown.
    // (OTTAW-28 / OTTAW-29)
    const STORAGE_PROXY_DAYS = 365;
    // Two series, validated for both themes with the dataviz palette checker
    // (CVD ΔE 23, normal 24). The median is also dashed, so identity is never
    // colour alone.
    const STORAGE_PROXY_COLORS = { proxy: '#2a78d6', median: '#1baf7a' };
    let storageProxyChart = null;
    let storageProxyCache = null;   // { rows, cal } from the last successful fetch

    // Headline numbers for the subtitle, from the latest COMPLETE day (a trailing
    // partial day must not become "today's" storage). Pure — no DOM — so
    // tests/test_dashboard_storageproxy.mjs can pin the contract.
    function storageProxyHeadline(rows) {
      const complete = (rows || []).filter(r => r.storage_mcm != null);
      if (!complete.length) return null;
      const last = complete[complete.length - 1];
      const bcm = last.storage_mcm / 1000;
      const median = last.median_storage_mcm != null ? last.median_storage_mcm / 1000 : null;
      const year = last.time.slice(0, 4);
      const thisYear = complete.filter(r => r.time.slice(0, 4) === year);
      const low  = thisYear.reduce((a, r) => (r.storage_mcm < a.storage_mcm ? r : a), thisYear[0]);
      const high = thisYear.reduce((a, r) => (r.storage_mcm > a.storage_mcm ? r : a), thisYear[0]);
      return {
        date: last.time,
        bcm,
        median_bcm: median,
        delta_bcm: median != null ? bcm - median : null,
        pct_of_median: median ? (bcm / median) * 100 : null,
        year,
        year_low:  { date: low.time,  bcm: low.storage_mcm / 1000 },
        year_high: { date: high.time, bcm: high.storage_mcm / 1000 },
        incomplete_days: (rows || []).length - complete.length,
      };
    }

    async function fetchStorageProxy() {
      const since = new Date(Date.now() - STORAGE_PROXY_DAYS * 24 * 3600 * 1000).toISOString().slice(0, 10);
      const [rowsR, calR] = await Promise.all([
        fetch(`/history/reservoir_storage_proxy_total?time=gte.${since}&order=time.asc&select=time,n_observed,n_reservoirs,storage_mcm,median_storage_mcm`, { cache: 'no-store' }),
        fetch('/history/reservoir_storage_proxy_calibration?select=exponent,scale,fitted_on,rmse_median_bcm,rmse_current_bcm', { cache: 'no-store' })
          .catch(() => null),
      ]);
      if (!rowsR.ok) throw new Error(`HTTP ${rowsR.status}`);
      const rows = await rowsR.json();
      const cal = calR && calR.ok ? ((await calR.json())[0] || null) : null;
      return { rows, cal };
    }

    async function renderStorageProxy() {
      const canvas = document.getElementById('storageProxyChart');
      if (!canvas) return;
      try {
        storageProxyCache = await fetchStorageProxy();
      } catch (e) {
        const sub = document.getElementById('storage-proxy-sub');
        const note = document.getElementById('storage-proxy-note');
        if (sub) sub.textContent = `Storage proxy unavailable (${e.message}).`;
        if (note) note.textContent = 'Needs the reservoir_storage_proxy views in the data tier (river-history bootstrap.sql). Served on freshet.xgrunt.com; optional on self-hosted copies.';
        return;
      }
      renderStorageProxyChart();
    }

    const STORAGE_PROXY_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    function renderStorageProxyChart() {
      const canvas = document.getElementById('storageProxyChart');
      if (!canvas || !storageProxyCache) return;
      const { rows, cal } = storageProxyCache;
      const isDark = isDarkMode();
      const grid = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
      const txt  = isDark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.55)';
      const labels = rows.map(r => r.time);
      const toBcm = v => (v == null ? null : v / 1000);
      // Phone width: 13 month labels collide, so label every other month there.
      const narrow = (canvas.parentElement?.clientWidth || 800) < 560;
      if (storageProxyChart) storageProxyChart.destroy();
      storageProxyChart = new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: 'Stored (proxy)', data: rows.map(r => toBcm(r.storage_mcm)),
              borderColor: STORAGE_PROXY_COLORS.proxy, backgroundColor: STORAGE_PROXY_COLORS.proxy + '22',
              borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0.2, spanGaps: false },
            { label: 'Median 1991–2020 (proxy)', data: rows.map(r => toBcm(r.median_storage_mcm)),
              borderColor: STORAGE_PROXY_COLORS.median, backgroundColor: STORAGE_PROXY_COLORS.median + '22',
              borderDash: [6, 4], borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0.2, spanGaps: true },
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'top', align: 'end',
              labels: { color: txt, boxWidth: 18, boxHeight: 2, font: { size: 11 }, padding: 10 } },
            tooltip: {
              backgroundColor: isDark ? 'rgba(30,30,30,0.95)' : 'rgba(255,255,255,0.98)',
              titleColor: isDark ? '#f0f0f0' : '#1a1a1a',
              bodyColor:  isDark ? '#f0f0f0' : '#1a1a1a',
              borderColor: isDark ? '#444' : '#ddd', borderWidth: 1,
              callbacks: {
                label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y == null ? '—' : ctx.parsed.y.toFixed(2)} bn m³`,
                afterBody: items => {
                  const r = rows[items[0]?.dataIndex];
                  if (!r) return [];
                  const out = [];
                  if (r.storage_mcm != null && r.median_storage_mcm) out.push(`${Math.round((r.storage_mcm / r.median_storage_mcm) * 100)} % of median`);
                  if (r.storage_mcm == null) out.push(`${r.n_observed}/${r.n_reservoirs} reservoirs reported — total withheld`);
                  return out;
                }
              }
            }
          },
          scales: {
            x: { grid: { color: grid },
                 ticks: { color: txt, font: { size: 10 }, autoSkip: false, maxRotation: 0,
                   // One tick per month on the 1st; null hides the tick and its gridline.
                   callback: (v, i) => {
                     const d = labels[i];
                     if (!d || d.slice(8, 10) !== '01') return null;
                     const mo = Number(d.slice(5, 7));
                     if (narrow && mo % 2 === 0) return null;
                     const m = STORAGE_PROXY_MONTHS[mo - 1];
                     return mo === 1 ? (narrow ? `${m} '${d.slice(2, 4)}` : `${m} ${d.slice(0, 4)}`) : m;
                   } } },
            y: { beginAtZero: true, suggestedMax: 12, grid: { color: grid },
                 ticks: { color: txt, font: { size: 10 }, stepSize: 2, callback: v => v.toFixed(0) },
                 title: { display: true, text: 'billion m³ (proxy)', color: txt, font: { size: 10 } } }
          }
        }
      });

      const h = storageProxyHeadline(rows);
      const sub = document.getElementById('storage-proxy-sub');
      if (sub) {
        if (!h) {
          sub.textContent = 'No complete day in the last 12 months (all 13 reservoirs must report).';
        } else {
          const sign = h.delta_bcm == null ? '' : (h.delta_bcm >= 0 ? '+' : '−');
          const vsMedian = h.median_bcm == null ? ''
            : ` · median ${h.median_bcm.toFixed(2)} · <strong>${Math.round(h.pct_of_median)} % of normal</strong> (${sign}${Math.abs(h.delta_bcm).toFixed(2)} bn m³)`;
          sub.innerHTML = `<strong>${h.bcm.toFixed(2)} bn m³</strong> stored on ${h.date}${vsMedian}`
            + ` · ${h.year} low ${h.year_low.bcm.toFixed(2)} (${h.year_low.date.slice(5)}) · high ${h.year_high.bcm.toFixed(2)} (${h.year_high.date.slice(5)})`
            + (h.incomplete_days ? ` · ${h.incomplete_days} day${h.incomplete_days === 1 ? '' : 's'} withheld (incomplete)` : '');
        }
      }
      const note = document.getElementById('storage-proxy-note');
      if (note) {
        note.innerHTML = cal
          ? `Proxy = ${cal.scale} × Σ ICOLD usable capacity × (position in ORRPB operating band)<sup>${cal.exponent}</sup>, fitted ${cal.fitted_on} to ORRPB's 2026 Spring Freshet Review storage chart`
            + ` (RMSE ${cal.rmse_median_bcm} bn m³ against their median curve, ${cal.rmse_current_bcm} against their 2026 curve). Gaps are days when not all 13 reservoirs reported. ORRPB's 10th–90th percentile band is not reproducible from our data.`
          : 'Proxy of ORRPB\'s storage chart; the calibration row is unavailable, so treat the scale as approximate.';
      }
    }

    // ---- Tributaries tab ----
    // Stations on tributaries that join the Ottawa River downstream of Mansfield.
    // They don't directly affect Lac Coulonge but constrain ORRPB's options at
    // Carillon — a rising tributary forces lower-river outflow up, which
    // propagates upstream as backwater pressure.
    // All Ottawa River tributaries with live gauge coverage, grouped by river,
    // ordered upstream → downstream along the main stem. Each station has a
    // `source` ('vigilance' | 'wsc'); without it, fetchStation() against MSP
    // Vigilance is the default. WSC stations carry a `wscCode` (e.g. '02JE020')
    // and a synthetic numeric `id` in the 300000+ range to avoid colliding with
    // Vigilance IDs.
    const TRIBUTARY_STATIONS = [
      { river: 'Rivière Kipawa', stations: [
        { id: 257, name: 'Kipawa @ Laniel', subtitle: 'Below the dam at Laniel · regulated outflow' }
      ] },
      { river: 'Mattawa River', stations: [
        { id: 300020, source: 'wsc', wscCode: '02JE020', river: 'Mattawa River',
          name: 'Mattawa below Bouillon Lake', subtitle: 'WSC · joins Ottawa at Mattawa' }
      ] },
      { river: 'Petawawa River', stations: [
        { id: 300101, source: 'wsc', wscCode: '02KB001', river: 'Petawawa River',
          name: 'Petawawa near Petawawa', subtitle: 'WSC · joins Ottawa at Pembroke' }
      ] },
      { river: 'Bonnechere River', stations: [
        { id: 300109, source: 'wsc', wscCode: '02KC009', river: 'Bonnechere River',
          name: 'Bonnechere near Castleford', subtitle: 'WSC · joins Ottawa near Renfrew' }
      ] },
      { river: 'Madawaska River', stations: [
        { id: 300204, source: 'wsc', wscCode: '02KD004', river: 'Madawaska River',
          name: 'Madawaska at Palmer Rapids', subtitle: 'WSC · upstream of Stewartville dam' }
      ] },
      { river: 'Mississippi River (ON)', stations: [
        { id: 300401, source: 'wsc', wscCode: '02KF001', river: 'Mississippi River (ON)',
          name: 'Mississippi at Fergusons Falls', subtitle: 'WSC · upper' },
        { id: 300406, source: 'wsc', wscCode: '02KF006', river: 'Mississippi River (ON)',
          name: 'Mississippi at Appleton',        subtitle: 'WSC · lower (joins Ottawa at Galetta)' }
      ] },
      { river: 'Rivière Coulonge', stations: [
        { id: 1004, name: 'Coulonge @ Mansfield (Rte 148)', subtitle: 'Hydro Météo · unregulated; joins Ottawa at Fort-Coulonge' }
      ] },
      { river: 'Rideau River', stations: [
        { id: 300504, source: 'wsc', wscCode: '02LA004', river: 'Rideau River',
          name: 'Rideau at Ottawa', subtitle: 'WSC · joins Ottawa at the Rideau Falls' }
      ] },
      { river: 'Rivière Gatineau', stations: [
        { id: 442, name: 'Tête des rapides Ceizur',   subtitle: 'Lac-Douaire · upstream discharge gauge' },
        // La Pêche (Vigilance station 994) removed 2026-05-10 — Hydro Météo
        // publishes the station to Vigilance but the gauge itself reports zero
        // readings (both metadata API and readings buffer return null/empty).
        // Other Hydro Météo stations on Vigilance work fine, so this is a
        // station-specific silence, not a provider outage. Re-add when the
        // upstream gauge comes back online.
        { id: 982, name: 'Rue Cartier (Gatineau)',    subtitle: 'Lower Gatineau · before Cartier dam' },
        { id: 983, name: 'Quai des Artistes (Gatineau)', subtitle: 'Lower Gatineau · near Ottawa confluence' }
      ] },
      { river: 'Rivière du Lièvre', stations: [
        { id: 196, name: 'Lac du Poisson Blanc', subtitle: 'Mid Lièvre · at Notre-Dame-du-Laus' }
      ] },
      { river: 'Rivière Rouge', stations: [
        { id: 39, name: 'Rouge @ McNeil Chute', subtitle: 'Lower Rouge · upstream of chute' }
      ] },
      { river: 'Rivière de la Petite Nation', stations: [
        { id: 1007, name: 'Petite Nation @ Saint-André-Avellin', subtitle: 'Rte 321 bridge · joins Ottawa at Plaisance' }
      ] },
      { river: 'South Nation River', stations: [
        { id: 300605, source: 'wsc', wscCode: '02LB005', river: 'South Nation River',
          name: 'South Nation near Plantagenet Springs', subtitle: 'WSC · joins Ottawa at Plantagenet' }
      ] },
    ];
    const TRIBUTARY_STATION_SPECS = TRIBUTARY_STATIONS.flatMap(g => g.stations);
    const TRIBUTARY_STATION_IDS = TRIBUTARY_STATION_SPECS.map(s => s.id);

    function fetchTributary(spec) {
      if (spec.source === 'wsc') return fetchWscStation(spec);
      if (spec.source === 'mvca') return fetchKiwisStation(spec);
      return fetchStation(spec.id);
    }
    async function renderTributariesTab() {
      const container = document.getElementById('tributaries-content');
      if (!container) return;
      // Render structure immediately so the user sees something even before fetches resolve.
      // One table in the corridor's grammar: a row per gauge, grouped by river.
      const paint = () => {
        const w = windowLabel(windowHours);
        const body = TRIBUTARY_STATIONS.map(group =>
          `<tr class="group"><th colspan="6" scope="colgroup">${group.river}</th></tr>`
          + group.stations.map((meta, i) => tributaryRowHTML(meta, i)).join('')).join('');
        container.innerHTML = `<div class="corr-wrap"><table class="corr-table trib-table"><thead><tr>
            <th scope="col">Station</th><th scope="col">${L('Level', 'Niveau')}</th><th scope="col">${L('Flood state', 'État de crue')}</th>
            <th scope="col">${L(`Last ${w}`, `Sur ${w}`)}</th>${corridorScaleHead(L('24 h change, cm', 'Variation 24 h, cm'))}
            <th scope="col" class="num">${L('Flow, m³/s', 'Débit, m³/s')}</th>
          </tr></thead><tbody>${body}</tbody></table></div>
          <p class="corr-foot">${L(`Each trace is scaled to its own row, so read its size from the range beside it (highest minus lowest over the last ${w}); the dot is the latest reading. The 24 h bars share the corridor table's ±${CORRIDOR_SCALE_CM} cm scale. Select a row for that station's references.`,
            `Chaque tracé est mis à l'échelle de sa propre ligne : son ampleur se lit dans l'étendue indiquée à côté (maximum moins minimum sur ${w}); le point est la dernière lecture. Les barres 24 h utilisent l'échelle de ±${CORRIDOR_SCALE_CM} cm du tableau du corridor. Sélectionnez une ligne pour les références de la station.`)}</p>`;
      };
      paint();
      // Now fetch any missing station data + history in the background. Re-paint when done.
      let didFetch = false;
      await Promise.all(TRIBUTARY_STATION_SPECS.map(async spec => {
        // WSC fetcher reads from wsc_readings keyed on windowHours — re-fetch when
        // the window grows so the sparkline extends past the original 72h pull.
        // (Vigilance fetches a fixed 72h buffer; longer ranges come from the
        // historyCache pull below.)
        const wscNeedsRefetch = spec.source === 'wsc'
          && lastData?.[spec.id]
          && (lastData[spec.id].readings?.length || 0) < windowHours * 6;  // ~10/hr at 5-min cadence
        if (lastData?.[spec.id] && !wscNeedsRefetch) return;
        if (!lastData) lastData = {};
        try { lastData[spec.id] = await fetchTributary(spec); didFetch = true; }
        catch (e) { console.warn(`trib ${spec.id} (${spec.source || 'vigilance'}): ${e.message}`); }
      }));
      if (windowHours > 72) {
        // Server-side history (river_readings table) only covers Vigilance stations.
        // WSC stations get their long history directly from fetchWscStation above,
        // which reads wsc_readings sized to windowHours.
        await Promise.all(TRIBUTARY_STATION_SPECS.map(async spec => {
          if (spec.source === 'wsc' || spec.source === 'mvca') return;
          const key = `${spec.id}:${windowHours}`;
          if (historyCache[key]) return;
          try { historyCache[key] = await fetchStationHistory(spec.id, windowHours); didFetch = true; }
          catch (e) { console.warn(`trib history ${spec.id}: ${e.message}`); }
        }));
      }
      if (didFetch) paint();
    }

    // Readings for the selected window: the live buffer up to 72 h, the hourly
    // history merged with it beyond that.
    function tributarySeries(id, readings) {
      if (windowHours <= 72) return readingsInWindow(readings, windowHours);
      const hist = historyCache[`${id}:${windowHours}`];
      return hist ? mergeHistory(hist, readings) : readings;
    }

    // Window trace scaled to its own row. Tributaries differ too much (a 3 cm
    // lake against a 60 cm river) for one shared scale, so the range is printed
    // beside the trace; spans under 4 cm are padded so gauge noise stays small.
    function tributarySparkCell(vals) {
      const pts = (vals || [])
        .map(r => ({ t: parseVigilance(r.date_prise_valeur)?.getTime(), v: r.valeur }))
        .filter(q => q.t && q.v != null);
      if (pts.length < 2) return '<td><span class="dtext muted">—</span></td>';
      let lo = Infinity, hi = -Infinity;
      for (const q of pts) { if (q.v < lo) lo = q.v; if (q.v > hi) hi = q.v; }
      const rangeCm = (hi - lo) * 100;
      const pad = Math.max(0, 0.04 - (hi - lo)) / 2;
      lo -= pad; hi += pad;
      const step = Math.ceil(pts.length / 110);
      const thin = pts.filter((_, i) => i % step === 0 || i === pts.length - 1);
      const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
      const x = t => 2 + (t1 > t0 ? (t - t0) / (t1 - t0) : 1) * (SPARK_W - 6);
      const y = v => 3 + (1 - (v - lo) / (hi - lo)) * (SPARK_H - 6);
      const end = thin[thin.length - 1];
      const line = thin.map(q => `${x(q.t).toFixed(1)},${y(q.v).toFixed(1)}`).join(' ');
      return `<td><div class="spark-cell"><svg class="spark" width="${SPARK_W}" height="${SPARK_H}" viewBox="0 0 ${SPARK_W} ${SPARK_H}" aria-hidden="true">
        <polyline points="${line}"/><circle cx="${x(end.t).toFixed(1)}" cy="${y(end.v).toFixed(1)}" r="2.5"/></svg>
        <span class="dtext" title="${L('Highest minus lowest reading in the window', 'Lecture maximale moins minimale sur la période')}">${rangeCm < 10 ? rangeCm.toFixed(1) : Math.round(rangeCm)} cm</span></div></td>`;
    }

    function tributaryRowHTML(meta, i) {
      const id = meta.id;
      const station = lastData?.[id];
      const m = station?.metadata;
      const idChip = m?.label ? ` <span class="station-id">${m.label}</span>` : '';
      const first = off => `<td><span class="corr-name${off ? ' off' : ''}" style="cursor:inherit">${meta.name}${idChip}</span><div class="corr-role">${meta.subtitle}</div></td>`;
      const msgRow = msg => `<tr>${first(true)}<td colspan="5"><span class="corr-msg">${msg}</span></td></tr>`;
      if (!m) return msgRow(L('No data yet.', 'Aucune donnée pour l\'instant.'));
      // station.readings can legitimately be null when Vigilance has metadata but
      // no live buffer (e.g., 994 La Pêche on Rivière Gatineau).
      const readings = station.readings || [];
      const latest = readings.length ? readings[readings.length - 1] : null;
      if (!latest) return msgRow(`${hydroMeteoDeactivatedChip(id)} ${L('No live readings published.', 'Aucune lecture en direct publiée.')}`);
      const level = displayLevel(m, latest.valeur);
      if (isSeriesStale(station)) {
        return msgRow(`${hydroMeteoDeactivatedChip(id)} ${L('No current reading. Last known', 'Aucune lecture actuelle. Dernière valeur connue :')} ${level.toFixed(2)} m, ${ago(latest.date_prise_valeur)}.`);
      }
      const flow = m.dern_valeur_deb;
      return `<tr data-station-id="${id}" onclick="openBarDetail(${id})" title="${L('References for', 'Références pour')} ${meta.name}">${first(false)}
        <td><span class="corr-level">${level.toFixed(2)}</span><span class="corr-unit"> m</span></td>
        <td>${stateChip(getEffectiveEtat(m), isEffectiveEtatSynthetic(m))}</td>
        ${tributarySparkCell(tributarySeries(id, readings))}
        ${corridorDeltaCell(dailyChangeCm(readings), i * 70)}
        <td class="num">${flow != null ? Math.round(flow).toLocaleString('en-CA') : '<span class="muted">—</span>'}</td></tr>`;
    }

    // Compute Des Joachims operational state (Stage 1 paused vs active refill).
    // Returns { cls, label } or null when neither condition fires.
    //
    // Des Joachims operating range is ~3 m, so 1 pp/24h ≈ 3 cm of level change.
    // "Paused"  — level roughly stable (within ±1 pp/24h, ~±3 cm) AND Mattawa at
    //             flood stage 5+ (Vigilance or our synthesized etat). Translation:
    //             ORRPB has stopped storing water at Des Joachims because doing
    //             so would back up Mattawa further (Contributor B, 2026-04-30).
    // "Refill"  — level rising > 1.5 pp/24h (~5 cm/24h). Reservoir is buffering.
    function desJoachimsOpState(snapPctChange) {
      if (snapPctChange == null) return null;
      const mattawa = lastData?.[545];
      const mattawaEtat = mattawa ? getEffectiveEtat(mattawa.metadata) : null;
      const mattawaInFlood = mattawaEtat != null && mattawaEtat >= 5;
      if (Math.abs(snapPctChange) <= 1.0 && mattawaInFlood) {
        return { cls: 'paused', label: 'Stage 1 paused — pure run-of-river' };
      }
      if (snapPctChange > 1.5) {
        return { cls: 'refill', label: 'Active refill — buffering' };
      }
      return null;
    }

    function renderStationMiniChart(id) {
      const canvas = document.getElementById(`stn-chart-${id}`);
      if (!canvas || !lastData?.[id]) return;
      const station = lastData[id];
      const m = station.metadata;
      const offset = ORRPB_HISTORIC_PEAKS[id]?.datumOffset || 0;
      // Build the value series for the active window.
      let vals;
      if (windowHours <= 72) {
        vals = station.readings.slice(-windowHours);
      } else {
        const hist = historyCache[`${id}:${windowHours}`];
        vals = hist ? mergeHistory(hist, station.readings) : station.readings;
      }
      if (!vals.length) return;
      const isDark = isDarkMode();
      const txt = isDark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.55)';
      const grid = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
      const eff = getEffectiveEtat(m);
      const lineColors = { 6: 'rgb(156,26,26)', 5: 'rgb(224,75,74)', 4: 'rgb(224,127,47)', 3: 'rgb(239,159,39)', 2: 'rgb(245,200,66)', 1: 'rgb(76,175,80)', 0: 'rgb(79,163,199)' };
      const lineColor = lineColors[eff ?? 0];
      // Threshold lines from Vigilance seuils_niv (already in API datum, so add offset for MASL display).
      const thresholds = ((m.seuils_niv) || []).map(s => ({
        val: s.valeur + offset, label: THRESHOLD_COLORS[s.type]?.label || s.type, color: THRESHOLD_COLORS[s.type]?.color || '#888'
      }));
      if (stationMiniCharts[id]) stationMiniCharts[id].destroy();
      stationMiniCharts[id] = new Chart(canvas, {
        type: 'line',
        data: {
          labels: vals.map(v => timeLabel(v.date_prise_valeur)),
          datasets: [{
            data: vals.map(v => v.valeur + offset),
            borderColor: lineColor,
            backgroundColor: lineColor.replace('rgb', 'rgba').replace(')', ',0.12)'),
            borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 4, tension: 0.2, fill: true
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          interaction: { mode: 'index', intersect: false, axis: 'x' },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: isDark ? 'rgba(30,30,30,0.95)' : 'rgba(255,255,255,0.98)',
              titleColor: isDark ? '#f0f0f0' : '#1a1a1a',
              bodyColor: isDark ? '#f0f0f0' : '#1a1a1a',
              borderColor: isDark ? '#444' : '#ddd', borderWidth: 1, padding: 6, displayColors: false,
              callbacks: { label: c => `${c.parsed.y.toFixed(2)} m` }
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: txt, font: { size: 9 }, maxTicksLimit: 5, maxRotation: 0 } },
            y: { grid: { color: grid }, ticks: { color: txt, font: { size: 9 }, callback: v => v.toFixed(2) } }
          }
        },
        plugins: [{
          id: 'thresholdLines',
          afterDraw: (chart) => {
            const { ctx, scales: { x: xA, y: yA } } = chart;
            thresholds.forEach(t => {
              const y = yA.getPixelForValue(t.val);
              if (y < yA.top || y > yA.bottom) return;
              ctx.save(); ctx.beginPath(); ctx.setLineDash([3, 3]);
              ctx.strokeStyle = t.color; ctx.lineWidth = 1;
              ctx.moveTo(xA.left, y); ctx.lineTo(xA.right, y); ctx.stroke();
              ctx.restore();
            });
          }
        }]
      });
    }

    // ---- Operations tab ----
    // Hydro-Québec generating-station release telemetry. Sourced from the
    // hq-ingest CronJob in the data namespace, served via PostgREST under
    // /history/. Cascade ordering matches actual flow direction so visitors
    // can read each panel upstream → downstream. Bryson and Carillon are
    // "featured" because they have headpond/tailwater pairs (case-file relevant).
    const HQ_OPERATIONS = {
      mainstem: {
        label: 'Ottawa main stem',
        sites: [
          { id: '3-33', name: 'Première-Chute',     subtitle: 'Upper Ottawa · run-of-river' },
          { id: '3-31', name: 'Rapides-des-Quinze', subtitle: 'Upper Ottawa' },
          { id: '3-32', name: 'Rapides-des-Îles',   subtitle: 'Lac Témiscamingue head' },
          { id: '3-29', name: 'Rapide-2',           subtitle: 'Upper Ottawa' },
          { id: '3-28', name: 'Rapide-7',           subtitle: 'Upper Ottawa' },
          { id: '3-46', name: 'Bryson',             subtitle: 'Lac Coulonge / Mansfield', amont: '1-2964', aval: '1-2965', featured: true },
          { id: '3-60', name: 'Carillon',           subtitle: 'Terminal lower Ottawa',    amont: '1-2968', aval: '1-2969', featured: true },
        ],
      },
      gatineau: {
        label: 'Gatineau',
        sites: [
          { id: '3-62', name: 'Cabonga',         subtitle: 'Headwater reservoir', noTurbine: true },
          { id: '3-63', name: 'Mercier',         subtitle: 'Upper Gatineau' },
          { id: '3-65', name: 'Paugan',          subtitle: 'Mid Gatineau' },
          { id: '3-66', name: 'Chelsea',         subtitle: 'Lower Gatineau' },
          { id: '3-67', name: 'Rapides-Farmers', subtitle: 'Gatineau mouth · joins Ottawa at Hull' },
        ],
      },
      stlaw: {
        label: 'Lower St-Lawrence',
        sites: [
          { id: '3-3', name: 'Coteau 1, 2, 3',  subtitle: 'St-Lawrence · downstream of Carillon' },
          { id: '3-4', name: 'Île-Juillet',     subtitle: 'St-Lawrence' },
          { id: '3-5', name: 'Saint-Timothée',  subtitle: 'St-Lawrence' },
          { id: '3-6', name: 'Cèdres',          subtitle: 'St-Lawrence' },
        ],
      },
    };

    // Sparkline window — driven by the Operations-tab range picker. Independent
    // of the Overview/Stations/Tributaries `windowHours` because hourly-cadence
    // flow telemetry doesn't benefit from a 1 h window the way level data does.
    // HQ's own feed only reaches back ~10 days, but dam_releases keeps every hour
    // ingested since 2026-04-22, so longer windows read from our table.
    let opWindowHours = 72;
    let opByIdCache = null;  // populated by fetchHqOperations() — used by openOpDetail()

    // Carillon §15.3.5.1 directive thresholds (case file: docs/analysis/Freshet_2026_Complete_Summary.md
    // § "The Carillon directive enforcement gap"). The IWMP spring-flood operating
    // maximum at the Carillon headpond is 40.08 m when the Hull dock exceeds the
    // 42.61 m servitude level.
    const CARILLON_SPRING_CEILING_M = 40.08;
    const HULL_DOCK_TRIGGER_M       = 42.61;
    const HULL_DOCK_STATION         = '1-3675';

    async function fetchHqOperations() {
      const allSiteIds = Object.values(HQ_OPERATIONS).flatMap(g => g.sites.map(s => s.id));
      // Featured stations expose amont/aval level pairs — pull their level history too,
      // so each card can show how stable the headpond's been over the window. The
      // case-file-relevant signal is "level held flat while spilling >50%".
      // Also include Hull dock (1-3675) for the Carillon §15.3.5.1 directive check.
      const levelStationIds = [
        ...Object.values(HQ_OPERATIONS).flatMap(g =>
          g.sites.flatMap(s => [s.amont, s.aval].filter(Boolean))),
        HULL_DOCK_STATION,
      ];
      const since = new Date(Date.now() - opWindowHours * 3600 * 1000).toISOString();
      const histUrl = `/history/dam_releases?site_id=in.(${allSiteIds.join(',')})`
        + `&time=gte.${since}&order=time.asc&select=time,site_id,total_cms,turbined_cms,spilled_cms`;
      const lvlHistUrl = levelStationIds.length
        ? `/history/dam_levels?station_id=in.(${levelStationIds.join(',')})`
          + `&time=gte.${since}&order=time.asc&select=time,station_id,level_m`
        : null;
      const [relR, lvlR, histR, lvlHistR] = await Promise.all([
        fetch('/history/latest_dam_releases', { cache: 'no-store' }),
        fetch('/history/latest_dam_levels',   { cache: 'no-store' }),
        fetch(histUrl,                         { cache: 'no-store' }),
        lvlHistUrl ? fetch(lvlHistUrl,         { cache: 'no-store' }) : Promise.resolve(null),
      ]);
      if (!relR.ok) throw new Error(`latest_dam_releases HTTP ${relR.status}`);
      if (!lvlR.ok) throw new Error(`latest_dam_levels HTTP ${lvlR.status}`);
      const releases = await relR.json();
      const levels   = await lvlR.json();
      const history  = histR.ok ? await histR.json() : [];
      const lvlHist  = (lvlHistR && lvlHistR.ok) ? await lvlHistR.json() : [];
      const byId = {};
      for (const r of releases) byId['rel:' + r.site_id] = r;
      for (const l of levels)   byId['lvl:' + l.station_id] = l;
      // Group hourly history by site_id so each card renders in O(N) of its own series.
      const seriesBySite = {};
      for (const h of history) (seriesBySite[h.site_id] ||= []).push(h);
      byId._series = seriesBySite;
      // Per-station level series for the held-band readout on featured cards.
      const lvlSeriesByStation = {};
      for (const l of lvlHist) (lvlSeriesByStation[l.station_id] ||= []).push(l);
      byId._lvlSeries = lvlSeriesByStation;
      opByIdCache = byId;
      return byId;
    }

    // ---- Dam operations: shared helpers ----------------------------------------
    const TURBINE_OFF_CMS = 1;   // below this the units are treated as stopped
    function opDuration(ms) {
      const h = Math.max(1, Math.round(ms / 3600000));
      return h < 48 ? `${h} h` : `${Math.floor(h / 24)} ${L('d', 'j')} ${h % 24} h`;
    }
    function opWhen(ms) {
      return new Intl.DateTimeFormat(L('en-GB', 'fr-CA'), { timeZone: 'America/Toronto', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(ms));
    }
    // Day and month only, for "since 22 Apr".
    function opDay(ms) {
      return new Intl.DateTimeFormat(L('en-GB', 'fr-CA'), { timeZone: 'America/Toronto', day: 'numeric', month: 'short' }).format(new Date(ms));
    }
    // Consecutive hours with the turbines running / stopped. Rows with no
    // turbined value say nothing about the units and are skipped.
    function turbineRuns(series) {
      const runs = [];
      for (const r of series || []) {
        if (r.turbined_cms == null) continue;
        const off = r.turbined_cms < TURBINE_OFF_CMS;
        const t = new Date(r.time).getTime();
        const last = runs[runs.length - 1];
        if (last && last.off === off) { last.end = t; last.rows.push(r); }
        else { if (last) last.end = t; runs.push({ off, start: t, end: t, rows: [r] }); }
      }
      return runs;
    }
    // Stacked area on a fixed pixel box: turbined below, spilled on top, scaled
    // to the series' own maximum. `strip` adds the turbine on/off band beneath.
    function opAreas(series, W, top, H, buckets) {
      const t0 = new Date(series[0].time).getTime();
      const t1 = new Date(series[series.length - 1].time).getTime();
      const x = t => t1 > t0 ? (t - t0) / (t1 - t0) * W : W;
      // Average into at most `buckets` columns so a 5,000-hour log stays light.
      const n = Math.min(buckets, series.length), cols = [];
      for (let i = 0; i < n; i++) {
        const a = Math.floor(i * series.length / n), b = Math.max(a + 1, Math.floor((i + 1) * series.length / n));
        let tu = 0, sp = 0;
        for (let j = a; j < b; j++) { tu += series[j].turbined_cms ?? 0; sp += series[j].spilled_cms ?? 0; }
        cols.push({ t: new Date(series[a].time).getTime(), tu: tu / (b - a), sp: sp / (b - a) });
      }
      cols[cols.length - 1].t = t1;
      const ymax = Math.max(1, ...cols.map(c => c.tu + c.sp));
      const y = v => top + H - (v / ymax) * H;
      const pt = (c, v) => `${x(c.t).toFixed(1)},${y(v).toFixed(1)}`;
      const turbTop = cols.map(c => pt(c, c.tu));
      const totalTop = cols.map(c => pt(c, c.tu + c.sp));
      return {
        x, ymax, t0, t1,
        svg: `<polygon class="a-turb" points="${turbTop.join(' ')} ${W},${top + H} 0,${top + H}"/>`
           + `<polygon class="a-spill" points="${totalTop.join(' ')} ${turbTop.slice().reverse().join(' ')}"/>`,
      };
    }
    function opStrip(series, x, W, y, h) {
      return `<rect class="a-track" x="0" y="${y}" width="${W}" height="${h}"/>` + turbineRuns(series).map(r => {
        const a = x(r.start), b = Math.max(a + 1, x(r.end));
        return `<rect class="${r.off ? 'a-spill' : 'a-turb'}" x="${a.toFixed(1)}" y="${y}" width="${(b - a).toFixed(1)}" height="${h}"/>`;
      }).join('');
    }

    // ---- Bryson turbine log -----------------------------------------------------
    // Bryson's units stop for days at a time and the whole river goes over the
    // spillway. A 72 h window can't show that pattern, so this reads every hour
    // of the current year for the one station.
    let brysonLogCache = null;
    async function fetchBrysonLog() {
      if (brysonLogCache && Date.now() - brysonLogCache.at < 10 * 60 * 1000) return brysonLogCache;
      const since = `${new Date().getUTCFullYear()}-01-01T00:00:00Z`;
      const [relR, lvlR] = await Promise.all([
        fetch(`/history/dam_releases?site_id=eq.3-46&time=gte.${since}&order=time.asc&select=time,total_cms,turbined_cms,spilled_cms`, { cache: 'no-store' }),
        fetch(`/history/dam_levels?station_id=eq.${BRYSON_AMONT_ID}&time=gte.${since}&order=time.asc&select=time,level_m`, { cache: 'no-store' }),
      ]);
      if (!relR.ok) throw new Error(`dam_releases HTTP ${relR.status}`);
      const rel = (await relR.json()).filter(r => r.turbined_cms != null);
      const lvl = lvlR.ok ? (await lvlR.json()).filter(l => l.level_m != null) : [];
      brysonLogCache = { at: Date.now(), rel, lvl };
      return brysonLogCache;
    }
    async function renderBrysonFeature() {
      const el = document.getElementById('bryson-feature');
      if (!el) return;
      let log;
      try { log = await fetchBrysonLog(); }
      catch (e) { el.className = 'op-feature'; el.innerHTML = `<p class="corr-msg">${L('Bryson turbine log unavailable:', 'Journal des turbines de Bryson indisponible :')} ${e.message}</p>`; return; }
      const { rel, lvl } = log;
      if (rel.length < 2) { el.className = 'op-feature'; el.innerHTML = `<p class="corr-msg">${L('No Bryson release history yet.', 'Aucun historique de débit pour Bryson pour l\'instant.')}</p>`; return; }
      const runs = turbineRuns(rel);
      const cur = runs[runs.length - 1];
      const now = rel[rel.length - 1];
      const outages = runs.filter(r => r.off);
      const offMs = outages.reduce((a, r) => a + (r.end - r.start) + 3600000, 0);
      const spanMs = new Date(now.time).getTime() - new Date(rel[0].time).getTime();
      const total = Math.round(now.total_cms ?? ((now.turbined_cms ?? 0) + (now.spilled_cms ?? 0)));
      const spillPct = total ? Math.round((now.spilled_cms ?? 0) / total * 100) : 0;
      const curFor = opDuration(new Date(now.time).getTime() - cur.start + 3600000);
      const nf = v => Math.round(v).toLocaleString(L('en-CA', 'fr-CA'));
      const lede = cur.off
        ? L(`Turbines <strong>off for ${curFor}</strong>, since ${opWhen(cur.start)}. All <strong>${nf(total)} m³/s</strong> is going over the spillway.`,
            `Turbines <strong>à l'arrêt depuis ${curFor}</strong>, soit depuis le ${opWhen(cur.start)}. La totalité des <strong>${nf(total)} m³/s</strong> passe par l'évacuateur.`)
        : L(`Turbines <strong>running for ${curFor}</strong>, since ${opWhen(cur.start)}. <strong>${nf(now.turbined_cms)}</strong> of ${nf(total)} m³/s is turbined; ${spillPct}% is spilled.`,
            `Turbines <strong>en marche depuis ${curFor}</strong>, soit depuis le ${opWhen(cur.start)}. <strong>${nf(now.turbined_cms)}</strong> des ${nf(total)} m³/s sont turbinés; ${spillPct} % sont déversés.`);

      // Timeline: headpond level, turbined / spilled flow, and the on/off strip
      // on one time axis, so a stoppage lines up with what the headpond did.
      const W = 1000;
      const flow = opAreas(rel, W, 72, 58, 500);
      const lv = lvl.filter(l => { const t = new Date(l.time).getTime(); return t >= flow.t0 && t <= flow.t1; });
      let lvlSvg = '', lvlCap = L('Headpond level', 'Niveau du bief amont');
      if (lv.length > 1) {
        const vals = lv.map(l => l.level_m);
        const lo = Math.min(...vals, BRYSON_CEILING_M), hi = Math.max(...vals, BRYSON_CEILING_M);
        const yl = v => 20 + (1 - (v - lo) / ((hi - lo) || 1)) * 28;
        const step = Math.ceil(lv.length / 600);
        const pts = lv.filter((_, i) => i % step === 0 || i === lv.length - 1)
          .map(l => `${flow.x(new Date(l.time).getTime()).toFixed(1)},${yl(l.level_m).toFixed(1)}`).join(' ');
        lvlSvg = `<line class="ceil" x1="0" x2="${W}" y1="${yl(BRYSON_CEILING_M).toFixed(1)}" y2="${yl(BRYSON_CEILING_M).toFixed(1)}"/><polyline class="lvl" points="${pts}"/>`;
        lvlCap = L(`Headpond ${Math.min(...vals).toFixed(2)} to ${Math.max(...vals).toFixed(2)} m (dashed: ${BRYSON_CEILING_M.toFixed(2)} ceiling)`,
          `Bief amont ${Math.min(...vals).toFixed(2)} à ${Math.max(...vals).toFixed(2)} m (pointillé : plafond ${BRYSON_CEILING_M.toFixed(2)})`);
      }
      const months = [];
      const d = new Date(flow.t0); d.setUTCDate(1); d.setUTCHours(5, 0, 0, 0); d.setUTCMonth(d.getUTCMonth() + 1);
      for (; d.getTime() < flow.t1; d.setUTCMonth(d.getUTCMonth() + 1)) months.push(d.getTime());
      const MONTHS = MONTHS_SHORT[pageLang] || MONTHS_SHORT.en;
      const grid = months.map(t => `<line class="grid" x1="${flow.x(t).toFixed(1)}" x2="${flow.x(t).toFixed(1)}" y1="0" y2="150"/>`).join('');
      const axis = months.map(t => `<span style="left:${(flow.x(t) / 10).toFixed(2)}%">${MONTHS[new Date(t).getUTCMonth()]}</span>`).join('');

      const lvlIn = (a, b) => lvl.filter(l => { const t = new Date(l.time).getTime(); return t >= a && t <= b; }).map(l => l.level_m);
      const rows = outages.slice().reverse().map(r => {
        const ongoing = r === cur;
        const spill = r.rows.reduce((a, x) => a + (x.spilled_cms ?? 0), 0) / r.rows.length;
        const hp = lvlIn(r.start, r.end);
        return `<tr><td>${opWhen(r.start)}</td><td>${ongoing ? `<strong>${L('ongoing', 'en cours')}</strong>` : opWhen(r.end + 3600000)}</td>
          <td><strong>${opDuration(r.end - r.start + 3600000)}</strong></td><td>${nf(spill)}</td>
          <td>${hp.length ? `${Math.min(...hp).toFixed(2)} ${L('to', 'à')} ${Math.max(...hp).toFixed(2)}` : '—'}</td></tr>`;
      }).join('');
      const first = new Date(rel[0].time).getTime();
      const since = opDay(first);
      const hpNow = lv.length ? lv[lv.length - 1].level_m : null;
      const hpDelta = hpNow == null ? null : Math.round((hpNow - BRYSON_CEILING_M) * 100);
      el.className = 'op-feature';
      el.innerHTML = `
        <div class="hero-head"><h2 class="eyebrow">${L('Bryson · turbine log', 'Bryson · journal des turbines')}</h2><span class="hero-note">${L(`The dam that holds Lac Coulonge. Hourly, since ${since}.`, `Le barrage qui retient le lac Coulonge. Données horaires depuis le ${since}`)}</span></div>
        <p class="hero-lede">${lede}</p>
        <div class="hero-stats">
          <div class="hero-stat"><div class="v">${outages.length}</div><div class="l">${L(`Turbine stoppages since ${since}`, `Arrêts des turbines depuis le ${since}`)}</div></div>
          <div class="hero-stat"><div class="v">${opDuration(offMs)}</div><div class="l">${L(`Total time stopped, ${Math.round(offMs / spanMs * 100)}% of the record`, `Durée totale d'arrêt, ${Math.round(offMs / spanMs * 100)} % de la période`)}</div></div>
          <div class="hero-stat"><div class="v">${hpNow != null ? hpNow.toFixed(2) + ' m' : '—'}</div><div class="l">${L('Headpond now', 'Bief amont actuel')}${hpDelta == null ? '' : L(`, ${Math.abs(hpDelta)} cm ${hpDelta >= 0 ? 'above' : 'below'} ${BRYSON_CEILING_M.toFixed(2)} m ceiling`, `, ${Math.abs(hpDelta)} cm ${hpDelta >= 0 ? 'au-dessus' : 'en dessous'} du plafond de ${BRYSON_CEILING_M.toFixed(2)} m`)}</div></div>
        </div>
        <div>
          <div class="tlog">
            <svg viewBox="0 0 ${W} 150" preserveAspectRatio="none" role="img" aria-label="${L('Bryson headpond level, turbined and spilled flow, and turbine state since', 'Bryson : niveau du bief amont, débits turbiné et déversé, et état des turbines depuis le')} ${since}">
              ${grid}${lvlSvg}${flow.svg}${opStrip(rel, flow.x, W, 136, 12)}
            </svg>
            <span class="lane" style="top:0">${lvlCap}</span>
            <span class="lane" style="top:54px">${L('Release, peak', 'Débit évacué, pointe de')} ${nf(flow.ymax)} m³/s</span>
          </div>
          <div class="tlog-axis">${axis}</div>
        </div>
        <div class="op-legend"><span><i class="sw turb"></i>${L('Turbined, and turbines running on the bottom strip', 'Turbiné; turbines en marche sur la bande du bas')}</span><span><i class="sw spill"></i>${L('Spilled, and turbines stopped on the bottom strip', 'Déversé; turbines à l\'arrêt sur la bande du bas')}</span></div>
        ${rows ? `<div class="corr-wrap"><table class="corr-table outage-table"><thead><tr>
          <th scope="col">${L('Turbines stopped', 'Arrêt des turbines')}</th><th scope="col">${L('Restarted', 'Remise en marche')}</th><th scope="col">${L('Duration', 'Durée')}</th>
          <th scope="col">${L('Spilled, avg m³/s', 'Déversé, moy. m³/s')}</th><th scope="col">${L('Headpond range, m', 'Bief amont, étendue, m')}</th></tr></thead><tbody>${rows}</tbody></table></div>` : ''}
        <p class="hero-foot">${L(`Stopped means under ${TURBINE_OFF_CMS} m³/s turbined in Hydro-Québec's hourly feed. The feed does not say why the units are off.`,
          `« À l'arrêt » signifie moins de ${TURBINE_OFF_CMS} m³/s turbiné dans les données horaires d'Hydro-Québec. Ces données n'indiquent pas pourquoi les groupes sont arrêtés.`)}</p>`;
    }

    // ---- All generating stations: one table --------------------------------------
    const OP_SPARK_W = 168, OP_SPARK_H = 28;
    function opSparkCell(series, noTurbine) {
      if (!series || series.length < 2) return '<td><span class="dtext muted">—</span></td>';
      const a = opAreas(series, OP_SPARK_W, 1, OP_SPARK_H, 120);
      const strip = noTurbine ? '' : opStrip(series, a.x, OP_SPARK_W, OP_SPARK_H + 4, 4);
      return `<td><div class="spark-cell"><svg width="${OP_SPARK_W}" height="${OP_SPARK_H + 9}" viewBox="0 0 ${OP_SPARK_W} ${OP_SPARK_H + 9}" aria-hidden="true">${a.svg}${strip}</svg>
        <span class="dtext" title="${L('Highest release in the window', 'Débit évacué maximal sur la période')}">max ${Math.round(a.ymax).toLocaleString(L('en-CA', 'fr-CA'))}</span></div></td>`;
    }
    function opRowHTML(meta, byId) {
      const first = `<td><span class="corr-name" style="cursor:inherit">${meta.name}</span><div class="corr-role">${meta.subtitle || ''}</div></td>`;
      const rel = byId['rel:' + meta.id];
      if (!rel) return `<tr>${first}<td colspan="5"><span class="corr-msg">${L('Awaiting first ingest.', 'En attente de la première ingestion.')}</span></td></tr>`;
      const turb = rel.turbined_cms ?? 0, spill = rel.spilled_cms ?? 0;
      const total = rel.total_cms ?? (turb + spill);
      const denom = (turb + spill) || total || 1;
      const spillFrac = total ? spill / total : 0;
      const series = byId._series?.[meta.id] || [];
      const nf = v => Math.round(v).toLocaleString(L('en-CA', 'fr-CA'));
      let split, state;
      if (meta.noTurbine) {
        split = `<div class="op-sub" style="margin:0">${L('Controlled release, no turbine', 'Évacuation contrôlée, sans turbine')}</div>`;
        state = '<span class="muted">—</span>';
      } else {
        split = `<div class="op-split" aria-hidden="true"><i style="width:${(turb / denom * 100).toFixed(1)}%"></i><b style="width:${(spill / denom * 100).toFixed(1)}%"></b></div>
          <div class="op-sub">${rel.turbined_cms == null
            ? L(`${nf(spill)} spilled · turbined not reported`, `${nf(spill)} déversé · turbiné non publié`)
            : L(`${nf(turb)} turbined · ${nf(spill)} spilled (${Math.round(spillFrac * 100)}%)`, `${nf(turb)} turbiné · ${nf(spill)} déversé (${Math.round(spillFrac * 100)} %)`)}</div>`;
        const runs = turbineRuns(series);
        const cur = runs[runs.length - 1];
        if (!cur) state = '<span class="muted">—</span>';
        else {
          // A run that starts with the window began before it: its true length is unknown.
          const whole = runs.length === 1;
          const dur = `${L('for', 'depuis')} ${whole ? L('over ', 'plus de ') : ''}${opDuration(cur.end - cur.start + 3600000)}`;
          state = cur.off ? `<strong>${L('Off', 'À l\'arrêt')}</strong><div class="op-sub">${dur}</div>` : `${L('Running', 'En marche')}<div class="op-sub">${dur}</div>`;
        }
      }
      // Headpond / tailwater pair, the held band, and Carillon's directive check.
      let head = '<span class="muted">—</span>';
      const a = meta.amont ? byId['lvl:' + meta.amont] : null;
      const v = meta.aval ? byId['lvl:' + meta.aval] : null;
      if (a) {
        head = `${a.level_m.toFixed(2)} m${v ? ` <span class="corr-unit">· Δh ${(a.level_m - v.level_m).toFixed(2)} m</span>` : ''}`;
        const vals = (byId._lvlSeries?.[meta.amont] || []).map(q => q.level_m).filter(q => q != null && !isNaN(q));
        if (vals.length >= 2) {
          const rangeCm = (Math.max(...vals) - Math.min(...vals)) * 100;
          // A tight band while most of the flow is spilled is the case-file
          // signal: the operator is holding this elevation by choice.
          const flat = rangeCm <= 15 && spillFrac >= 0.5;
          head += `<div class="op-sub"${flat ? ` title="${L('Headpond held in a tight band while over half the flow is spilled.', 'Bief amont maintenu dans une bande étroite alors que plus de la moitié du débit est déversée.')}"` : ''}>${L(`held within ${rangeCm.toFixed(0)} cm`, `maintenu à ${rangeCm.toFixed(0)} cm près`)}${flat ? ` · <strong>${L('flat while spilling', 'stable malgré le déversement')}</strong>` : ''}</div>`;
        }
        // Carillon §15.3.5.1: spring-flood operating maximum of 40.08 m at the
        // headpond when the Hull dock exceeds the 42.61 m servitude (2004 IWMP).
        const hull = byId['lvl:' + HULL_DOCK_STATION];
        if (meta.id === '3-60' && hull) {
          const over = Math.round((a.level_m - CARILLON_SPRING_CEILING_M) * 100);
          const txt = hull.level_m <= HULL_DOCK_TRIGGER_M ? `§15.3.5.1 ${L('inactive', 'inactif')}, Hull ${hull.level_m.toFixed(2)} m`
            : over > 0 ? `<strong>§15.3.5.1 ${L('overshoot', 'dépassement')} +${over} cm</strong>` : `§15.3.5.1 ${L('compliant', 'conforme')}, ${over} cm`;
          head += `<div class="op-sub" title="${L(`IWMP spring-flood operating maximum is ${CARILLON_SPRING_CEILING_M} m at Carillon when the Hull dock exceeds ${HULL_DOCK_TRIGGER_M} m.`, `Le maximum d'exploitation en crue printanière du PGIE est de ${CARILLON_SPRING_CEILING_M} m à Carillon lorsque le quai de Hull dépasse ${HULL_DOCK_TRIGGER_M} m.`)}">${txt}</div>`;
        }
      }
      return `<tr data-site="${meta.id}" onclick="openOpDetail('${meta.id}')" title="${meta.name} · ${L('updated', 'mis à jour')} ${ago(rel.time)} · ${L('select for detail', 'sélectionnez pour le détail')}">${first}
        <td><span class="corr-level">${total != null ? nf(total) : '—'}</span><span class="corr-unit"> m³/s</span></td>
        <td>${split}</td>${opSparkCell(series, meta.noTurbine)}<td>${state}</td><td>${head}</td></tr>`;
    }

    // Ottawa main-stem river flows from ORRPB's "Average Daily Flows" table
    // (orrpb_river_flows). Includes the OPG dams (Otto Holden, Des Joachims,
    // Chenaux, Chats Falls) that aren't in Hydro-Québec's open-data feed.
    const ORRPB_RIVER_FLOW_STATIONS = [
      ['temiscaming',  'Témiscaming',  'Upper Ottawa outlet'],
      ['otto-holden',  'Otto Holden',  'OPG · upper Ottawa'],
      ['des-joachims', 'Des Joachims', 'OPG · only main-stem dam with real storage'],
      ['chenaux',      'Chenaux',      'OPG'],
      ['chats-falls',  'Chats Falls',  'OPG / HQ'],
      ['britannia',    'Britannia',    'Lake Deschênes at Ottawa'],
      ['carillon',     'Carillon',     'Basin terminal'],
    ];

    async function renderOrrpbRiverFlows() {
      const el = document.getElementById('op-orrpb-river');
      if (!el) return;
      try {
        const r = await fetch('/history/orrpb_river_flows?order=time.desc,station.asc&limit=70', { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const rows = await r.json();
        const byStation = {};
        for (const row of rows) (byStation[row.station] ||= []).push(row);
        let maxDate = '';
        for (const s in byStation) {
          byStation[s].sort((a, b) => (a.time < b.time ? 1 : -1)); // newest first
          if (byStation[s][0].time > maxDate) maxDate = byStation[s][0].time;
        }
        const fmt = v => (v == null ? '—' : Math.round(v).toLocaleString());
        const chips = ORRPB_RIVER_FLOW_STATIONS.map(([slug, name, sub]) => {
          const series = byStation[slug] || [];
          const cur = series[0];
          const prev = cur && series.find(x => {
            const d = (new Date(cur.time) - new Date(x.time)) / 86400000;
            return d >= 6 && d <= 9;
          });
          let arrow = '', dTxt = '';
          if (cur && prev && cur.flow_cms != null && prev.flow_cms != null) {
            const d = Math.round(cur.flow_cms - prev.flow_cms);
            dTxt = ` · ${d >= 0 ? '+' : ''}${d.toLocaleString()} m³/s vs 7d prior`;
            if (Math.abs(d) >= 20) arrow = `<span style="font-size:9px;color:${d < 0 ? 'var(--green)' : 'var(--orange)'};">${d < 0 ? '▾' : '▴'}</span>`;
          }
          const tip = `${name} — ${sub}${cur && cur.agency ? ' · ' + cur.agency : ''}${dTxt}${cur ? ' · ' + cur.time : ''}`;
          return `<span title="${tip}" style="white-space:nowrap;"><span style="color:var(--text-muted);">${name}</span> <strong>${fmt(cur && cur.flow_cms)}</strong>${arrow}</span>`;
        }).join('<span style="color:var(--text-faint);margin:0 6px;">·</span>');
        el.innerHTML = `${chips}<span style="color:var(--text-muted);font-size:11px;margin-left:8px;white-space:nowrap;">m³/s · ${maxDate}</span>`;
      } catch (e) {
        el.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:10px 0;">ORRPB main-stem flows unavailable: ${e.message}. <code>kubectl -n data create job --from=cronjob/orrpb-river-ingest orrpb-river-now</code></div>`;
      }
    }

    // ---- Flow tab: three propagation visualizations sharing one fetch ----
    // Stations are the 7 ORRPB main-stem reporting points, upstream → downstream.
    // Data source: orrpb_river_flows (daily mean discharge, m³/s). Britannia and
    // Carillon are backfilled to mid-April from WSC realtime / dam_releases; the
    // 5 OPG stations only have data from May 5 onward because ORRPB only publishes
    // an 8-day rolling window. Colors run cool→warm to hint at flow direction.
    const FLOW_TAB_STATIONS = [
      ['temiscaming',  'Témiscaming',  '#7A5ED8'],
      ['otto-holden',  'Otto Holden',  '#5B8BD0'],
      ['des-joachims', 'Des Joachims', '#3AAFD4'],
      ['chenaux',      'Chenaux',      '#3CB371'],
      ['chats-falls',  'Chats Falls',  '#E0A93C'],
      ['britannia',    'Britannia',    '#D85A30'],
      ['carillon',     'Carillon',     '#C44545'],
    ];
    let flowTabDays = 30;  // default window — full 2026 freshet now that ORRPB year-back is scraped
    const flowTabState = { lastFetchTs: 0, data: null, daysAtFetch: 0 };
    let flowMultilineChart = null;
    let flowSmallMultipleCharts = {};

    async function renderFlowTab() {
      const containers = ['flow-multiline', 'flow-smallmultiples', 'flow-hovmoller']
        .map(id => document.getElementById(id));
      if (!containers.every(Boolean)) return;

      const now = Date.now();
      if (flowTabState.data && flowTabState.daysAtFetch === flowTabDays && (now - flowTabState.lastFetchTs) < 300000) {
        renderFlowMultiline(flowTabState.data);
        renderFlowSmallMultiples(flowTabState.data);
        renderFlowHovmoller(flowTabState.data);
        return;
      }

      try {
        const since = new Date(now - flowTabDays * 86400000).toISOString();
        const r = await fetch(
          `/history/orrpb_river_flows?time=gte.${since}&order=time.asc,station.asc`,
          { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const rows = await r.json();
        const byStation = {};
        const dateSet = new Set();
        for (const row of rows) {
          if (row.flow_cms == null) continue;
          const date = String(row.time).slice(0, 10);
          (byStation[row.station] ||= []).push({ date, flow: row.flow_cms });
          dateSet.add(date);
        }
        for (const s in byStation) byStation[s].sort((a, b) => a.date.localeCompare(b.date));
        const dates = Array.from(dateSet).sort();
        flowTabState.data = { byStation, dates };
        flowTabState.lastFetchTs = now;
        flowTabState.daysAtFetch = flowTabDays;

        renderFlowMultiline(flowTabState.data);
        renderFlowSmallMultiples(flowTabState.data);
        renderFlowHovmoller(flowTabState.data);
      } catch (e) {
        containers.forEach(c => {
          c.innerHTML = `<div style="padding:20px;color:var(--text-muted);font-size:12px;">Flow data unavailable: ${e.message}</div>`;
        });
      }
    }

    // Viz 1 — Multi-line: every station on one chart, shared time axis.
    function renderFlowMultiline({ byStation, dates }) {
      const isDark = isDarkMode();
      const grid = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
      const txt  = isDark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.55)';
      const datasets = FLOW_TAB_STATIONS.map(([slug, name, color]) => {
        const byDate = Object.fromEntries((byStation[slug] || []).map(p => [p.date, p.flow]));
        return {
          label: name,
          data: dates.map(d => byDate[d] ?? null),
          borderColor: color,
          backgroundColor: color + '22',
          borderWidth: 2,
          pointRadius: 0,
          pointHoverRadius: 4,
          tension: 0.25,
          spanGaps: true,
        };
      });
      const canvas = document.getElementById('flow-multiline');
      if (!canvas) return;
      if (flowMultilineChart) flowMultilineChart.destroy();
      flowMultilineChart = new Chart(canvas, {
        type: 'line',
        data: { labels: dates.map(d => d.slice(5)), datasets },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'top', align: 'end',
              labels: { color: txt, boxWidth: 14, boxHeight: 2, font: { size: 11 }, padding: 10 } },
            tooltip: {
              backgroundColor: isDark ? 'rgba(30,30,30,0.95)' : 'rgba(255,255,255,0.98)',
              titleColor: isDark ? '#f0f0f0' : '#1a1a1a',
              bodyColor:  isDark ? '#f0f0f0' : '#1a1a1a',
              borderColor: isDark ? '#444' : '#ddd', borderWidth: 1,
              callbacks: {
                label: (ctx) => `${ctx.dataset.label}: ${Math.round(ctx.parsed.y).toLocaleString()} m³/s`
              }
            }
          },
          scales: {
            x: { grid: { color: grid }, ticks: { color: txt, font: { size: 10 }, maxTicksLimit: 10 } },
            y: { grid: { color: grid }, ticks: { color: txt, font: { size: 10 },
                   callback: v => v.toLocaleString() }, beginAtZero: true,
                 title: { display: true, text: 'm³/s', color: txt, font: { size: 10 } } }
          }
        }
      });
    }

    // Viz 2 — Stacked small multiples: one mini chart per station, geographic order.
    function renderFlowSmallMultiples({ byStation, dates }) {
      const isDark = isDarkMode();
      const txt = isDark ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.5)';
      const container = document.getElementById('flow-smallmultiples');
      if (!container) return;
      Object.values(flowSmallMultipleCharts).forEach(c => { try { c.destroy(); } catch (_) {} });
      flowSmallMultipleCharts = {};
      container.innerHTML = '';

      FLOW_TAB_STATIONS.forEach(([slug, name, color], idx) => {
        const byDate = Object.fromEntries((byStation[slug] || []).map(p => [p.date, p.flow]));
        const data = dates.map(d => byDate[d] ?? null);
        const valid = data.filter(v => v != null);
        let peakLabel = '';
        if (valid.length) {
          const max = Math.max(...valid);
          const peakIdx = data.indexOf(max);
          peakLabel = `peak ${Math.round(max).toLocaleString()} m³/s · ${dates[peakIdx].slice(5)}`;
        }
        const isLast = idx === FLOW_TAB_STATIONS.length - 1;
        const row = document.createElement('div');
        row.style.cssText = `display:flex; align-items:center; gap:10px; padding: 6px 14px ${isLast ? '10px' : '6px'} 14px; border-bottom: ${isLast ? 'none' : '1px solid var(--border)'};`;
        row.innerHTML = `
          <div style="flex: 0 0 120px; font-size: 11px; line-height: 1.25;">
            <div style="font-weight: 600; color: var(--text);">${name}</div>
            <div style="font-size: 9.5px; color: var(--text-faint); font-variant-numeric: tabular-nums;">${peakLabel}</div>
          </div>
          <div style="flex: 1; position: relative; height: 46px;">
            <canvas></canvas>
          </div>
        `;
        container.appendChild(row);
        const canvas = row.querySelector('canvas');
        flowSmallMultipleCharts[slug] = new Chart(canvas, {
          type: 'line',
          data: {
            labels: dates.map(d => d.slice(5)),
            datasets: [{
              data,
              borderColor: color,
              backgroundColor: color + '28',
              borderWidth: 1.6,
              fill: true,
              pointRadius: 0,
              pointHoverRadius: 3,
              tension: 0.3,
              spanGaps: true,
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: isDark ? 'rgba(30,30,30,0.95)' : 'rgba(255,255,255,0.98)',
                titleColor: isDark ? '#f0f0f0' : '#1a1a1a',
                bodyColor:  isDark ? '#f0f0f0' : '#1a1a1a',
                borderColor: isDark ? '#444' : '#ddd', borderWidth: 1,
                displayColors: false,
                callbacks: { label: (ctx) => `${Math.round(ctx.parsed.y).toLocaleString()} m³/s` }
              }
            },
            scales: {
              x: { display: isLast, grid: { display: false },
                   ticks: { color: txt, font: { size: 9 }, maxTicksLimit: 8, autoSkip: true } },
              y: { display: false, grid: { display: false } }
            }
          }
        });
      });
    }

    // Viz 3 — Hovmöller heatmap: station × day grid, per-station normalized color.
    function renderFlowHovmoller({ byStation, dates }) {
      const isDark = isDarkMode();
      const container = document.getElementById('flow-hovmoller');
      if (!container) return;

      const cellH = 26;
      const headerH = 24;
      const labelW = 110;
      const cw = Math.max(320, container.clientWidth || 800);
      const innerW = cw - labelW - 8;
      const cellW = Math.max(2, innerW / dates.length);
      const totalH = headerH + cellH * FLOW_TAB_STATIONS.length + 6;

      const stationMinMax = {};
      for (const [slug] of FLOW_TAB_STATIONS) {
        const vals = (byStation[slug] || []).map(p => p.flow).filter(v => v != null);
        if (vals.length) stationMinMax[slug] = { min: Math.min(...vals), max: Math.max(...vals) };
      }
      const stops = isDark
        ? [[0.0,[36,46,62]], [0.5,[80,130,200]], [1.0,[220,90,70]]]
        : [[0.0,[238,236,228]], [0.5,[100,160,220]], [1.0,[196,60,60]]];
      function colorFor(t) {
        if (!Number.isFinite(t)) return isDark ? '#252525' : '#f0eee9';
        t = Math.max(0, Math.min(1, t));
        for (let i = 0; i < stops.length - 1; i++) {
          const [t0, c0] = stops[i], [t1, c1] = stops[i+1];
          if (t <= t1) {
            const f = (t - t0) / (t1 - t0);
            return `rgb(${Math.round(c0[0]+(c1[0]-c0[0])*f)},${Math.round(c0[1]+(c1[1]-c0[1])*f)},${Math.round(c0[2]+(c1[2]-c0[2])*f)})`;
          }
        }
        return `rgb(${stops[stops.length-1][1].join(',')})`;
      }
      const txt = isDark ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.55)';

      let svg = `<svg viewBox="0 0 ${cw} ${totalH}" preserveAspectRatio="none" style="width:100%; height:${totalH}px; font-family: inherit; display:block;" xmlns="http://www.w3.org/2000/svg">`;
      const labelEvery = Math.max(1, Math.ceil(dates.length / 8));
      dates.forEach((d, i) => {
        if (i % labelEvery === 0 || i === dates.length - 1) {
          const x = labelW + i * cellW + cellW / 2;
          svg += `<text x="${x}" y="${headerH - 8}" font-size="9" fill="${txt}" text-anchor="middle">${d.slice(5)}</text>`;
        }
      });
      FLOW_TAB_STATIONS.forEach(([slug, name], rowIdx) => {
        const y = headerH + rowIdx * cellH;
        svg += `<text x="${labelW - 8}" y="${y + cellH/2 + 4}" font-size="11" fill="${txt}" text-anchor="end" font-weight="500">${name}</text>`;
        const byDate = Object.fromEntries((byStation[slug] || []).map(p => [p.date, p.flow]));
        const mm = stationMinMax[slug];
        dates.forEach((d, i) => {
          const v = byDate[d];
          const t = (mm && v != null && mm.max > mm.min) ? (v - mm.min) / (mm.max - mm.min) : NaN;
          const x = labelW + i * cellW;
          const fill = colorFor(t);
          const titleText = v != null ? `${name} · ${d}: ${Math.round(v).toLocaleString()} m³/s` : `${name} · ${d}: no data`;
          svg += `<rect x="${x}" y="${y + 2}" width="${cellW - 0.5}" height="${cellH - 4}" fill="${fill}"><title>${titleText}</title></rect>`;
        });
      });
      svg += '</svg>';

      const legend = `<div style="display:flex; align-items:center; gap:8px; margin-top:10px; font-size:10.5px; color:var(--text-muted);">
        <span>per-station scale: low</span>
        <svg width="160" height="12" style="border-radius:2px; overflow:hidden;">
          ${Array.from({length: 32}, (_, i) => `<rect x="${i*5}" y="0" width="5" height="12" fill="${colorFor(i/31)}"/>`).join('')}
        </svg>
        <span>high (within its own 30-day range)</span>
      </div>`;
      container.innerHTML = svg + legend;
    }

    // Repaint the heatmap when the container width changes (Chart.js handles its own).
    window.addEventListener('resize', () => {
      if (!document.querySelector('.tab-panel[data-tab="flow"].active')) return;
      if (flowTabState.data) renderFlowHovmoller(flowTabState.data);
    });


    async function renderOperationsTab() {
      const wrap = document.getElementById('op-table');
      if (!wrap) return;
      renderOrrpbRiverFlows();  // independent of the HQ feed — fire and forget
      renderBrysonFeature();    // its own year-long fetch; never blocks the table
      let byId;
      try {
        byId = await fetchHqOperations();
      } catch (e) {
        wrap.innerHTML = `<p class="corr-msg" style="padding: 14px 16px;">${L('Could not load HQ release data:', 'Impossible de charger les données de débit d\'HQ :')} ${e.message}.<br>Has the hq-ingest cron run yet? <code>kubectl -n data create job --from=cronjob/hq-ingest hq-ingest-now</code></p>`;
        return;
      }
      const w = windowLabel(opWindowHours);
      const GROUP_FR = { 'Ottawa main stem': 'Cours principal de l\'Outaouais', 'Gatineau': 'Gatineau', 'Lower St-Lawrence': 'Saint-Laurent, en aval de Carillon' };
      const body = Object.values(HQ_OPERATIONS).map(group =>
        `<tr class="group"><th colspan="6" scope="colgroup">${L(group.label, GROUP_FR[group.label] || group.label)}</th></tr>`
        + group.sites.map(s => opRowHTML(s, byId)).join('')).join('');
      wrap.innerHTML = `<table class="corr-table op-table"><thead><tr>
          <th scope="col">${L('Station', 'Centrale')}</th><th scope="col">${L('Release now', 'Débit évacué actuel')}</th><th scope="col">${L('Turbined / spilled now', 'Turbiné / déversé actuel')}</th>
          <th scope="col">${L(`Last ${w}, m³/s`, `Sur ${w}, m³/s`)}</th><th scope="col">Turbines</th><th scope="col">${L('Headpond', 'Bief amont')}</th>
        </tr></thead><tbody>${body}</tbody></table>`;
      document.getElementById('op-foot').innerHTML = `<span class="op-legend"><span><i class="sw turb"></i>${L('Turbined', 'Turbiné')}</span><span><i class="sw spill"></i>${L('Spilled', 'Déversé')}</span></span>
        ${L(`Each trace is scaled to its own maximum, printed beside it; the thin strip under it is the turbine state hour by hour. A duration marked "over" started before the ${w} window. Select a row for detail.`,
            `Chaque tracé est mis à l'échelle de son propre maximum, indiqué à côté; la fine bande en dessous montre l'état des turbines heure par heure. Une durée précédée de « plus de » a commencé avant la période de ${w}. Sélectionnez une ligne pour le détail.`)}`;
    }

    async function fetchData() {
      const btn = document.getElementById('refresh');
      const btnLabel = btn.querySelector('span');
      btn.disabled = true;
      btn.classList.add('loading');
      btnLabel.textContent = 'Refreshing';

      try {
        // The V3 season-end forecast is a static daily JSON, independent of the
        // live feeds — fire it off (fire-and-forget) so the panel renders even if
        // the live primaries are slow or fail.
        renderFreshetForecast();

        // Kick off the 9 regional fetches *before* awaiting primaries so their
        // network round-trips overlap. We hold the promises here and attach the
        // per-card render handlers after `lastData` is initialised below — that
        // way each card lands in the grid as its own fetch resolves, isolating
        // the slow MVCA/KiWIS tail to just Buckhams Bay.
        const regionalPromises = regionalFetchPromises();

        // Pull live readings + year-to-date ranges in parallel. The ranges are
        // best-effort — fall back to null on failure so the cards still render.
        const rangeOrNull = id => fetchYearRange(id).catch(e => { console.warn(`year range ${id}: ${e.message}`); return null; });
        const stationOrNull = id => fetchStation(id).catch(e => { console.warn(`station ${id}: ${e.message}`); return null; });
        let [lc, cr, wa, mt, br, lcRange, crRange, waRange, mtRange, brRange] = await Promise.all([
          stationOrNull(1195), stationOrNull(1004), stationOrNull(1279), stationOrNull(545),
          fetchBrysonAmont(FALLBACK_LOOKBACK_H).catch(e => { console.warn(`Bryson amont: ${e.message}`); return null; }),
          rangeOrNull(1195), rangeOrNull(1004), rangeOrNull(1279), rangeOrNull(545),
          rangeOrNull(BRYSON_AMONT_ID)
        ]);
        // One failed primary (HTTP 503, network error) degrades to a no-data card;
        // only a total wipeout of all three is a page-level error worth the banner.
        if (!lc && !cr && !wa) throw new Error('all primary station feeds unreachable');
        lc = lc || { metadata: null, readings: [] };
        cr = cr || { metadata: null, readings: [] };
        wa = wa || { metadata: null, readings: [] };
        const data = { 1195: lc, 1004: cr, 1279: wa };
        if (mt) data[545] = mt;
        if (br) data[BRYSON_AMONT_ID] = br;
        const yearRanges = { 1195: lcRange, 1004: crRange, 1279: waRange, 545: mtRange, [BRYSON_AMONT_ID]: brRange };
        // Keep each regional station's previous series until its refetch lands;
        // dropping them here made the corridor rows flip to "No current reading."
        // for a few seconds on every 10-minute refresh. A station whose refetch
        // fails keeps its last series, which isSeriesStale() ages out honestly.
        const carried = {};
        for (const st of REGIONAL_STATIONS) {
          if (!(st.id in data) && lastData?.[st.id]) carried[st.id] = lastData[st.id];
        }
        lastData = { ...carried, ...data };
        lastYearRanges = yearRanges;
        // Pull ECCC annual peaks for any station Vigilance can't classify (etat_niv=0).
        // Cached after first call, so subsequent refreshes are free.
        // Also kick off the ORRPB forecast snapshot fetch in parallel — it's a
        // single ~1KB JSON file, both finish well before render.
        await Promise.all([
          precomputeEcccPeaks(Object.values(data).map(d => d.metadata)),
          loadForecast(),
        ]);

        // Fresh fetch — blow away cached history so the next >72h render re-pulls.
        Object.keys(historyCache).forEach(k => delete historyCache[k]);

        renderSummary(lc, lcRange);
        renderCards(data, yearRanges);
        renderCorridor();
        if (document.querySelector('.tab-panel[data-tab="stations"].active')) renderStationsTab();
        if (document.querySelector('.tab-panel[data-tab="river"].active')) renderRiverTab();
        // Reservoirs / Tributaries tabs depend on lastData[545] (Mattawa) for the
        // Des Joachims state pill — refresh them too so the pill appears once
        // Mattawa data is available.
        if (document.querySelector('.tab-panel[data-tab="reservoirs"].active')) renderReservoirsTab();
        if (document.querySelector('.tab-panel[data-tab="tributaries"].active')) renderTributariesTab();
        if (document.querySelector('.tab-panel[data-tab="operations"].active')) renderOperationsTab();
        if (document.querySelector('.tab-panel[data-tab="flow"].active')) renderFlowTab();
        renderHeroCharts();
        if (lc.readings.length) {
          renderProperty(lc.readings[lc.readings.length - 1].valeur, lc.metadata?.trend_niv);
        } else {
          // renderProperty is the only writer of #thresh-list — without this the
          // panel stays a "Loading…" skeleton (fresh load) or silently freezes
          // pre-outage distances (mid-session) with no stale indicator.
          const tl = document.getElementById('thresh-list');
          tl.classList.remove('skeleton');
          tl.innerHTML = '<div class="thresh-row"><span class="desc" style="color:var(--text-muted)">No recent readings — threshold distances unavailable during the source feed outage.</span></div>';
        }
        updateChartTitles();

        // Freeze + precipitation tracker (non-blocking). Cache the result so the
        // Stations tab can pull per-gauge precip context off the same fetch.
        fetchWeather().then(w => { lastWeatherCache = w; renderFreezePanel(w); }).catch(err => {
          const sum = document.getElementById('freeze-summary');
          sum.className = 'freeze-lede';
          sum.innerHTML = `<strong>${L('Weather unavailable:', 'Météo indisponible :')}</strong> ${err.message}`;
        });

        // Regional stations feed the corridor table. Each fetch was kicked off at
        // the top of fetchData() (parallel with primaries), so the network hop is
        // already in flight; repaint per station so a slow one (notably
        // MVCA/KiWIS, which has an 8s client-side timeout) doesn't gate the rest.
        regionalPromises.forEach(p => {
          p.then(async row => {
            regionalSettled.add(row.meta.id);
            if (row.ok) {
              lastData[row.meta.id] = row.data;
              // ECCC peaks are needed for the flood-state badge on stations
              // Vigilance can't classify. ensureEcccPeaks is cached so per-call
              // dispatch is cheap (and dedup'd across stations sharing a WSC id).
              try { await precomputeEcccPeaks([row.data.metadata]); } catch (_) {}
            }
            // Refresh as each arrives so rows fill in progressively instead of
            // in one batch.
            renderCorridor();
          }).catch(err => {
            console.warn(`regional render failed for ${p}:`, err);
          });
        });
        
        const latestLC = lc.readings[lc.readings.length - 1];
        if (latestLC) {
          lastDataTimestamp = latestLC.date_prise_valeur;
          renderStatus('live', liveStatusHTML(latestLC.date_prise_valeur));
        } else {
          // Clear the timestamp too — the minute ticker repaints a green "Live"
          // pill from lastDataTimestamp and would overwrite this within 60 s.
          lastDataTimestamp = null;
          renderStatus('stale', 'No recent Lac Coulonge readings — source feeds unavailable');
        }
        renderBanner(null, null);
        checkOrrpbStatus();   // re-show the "direct-from-source" banner if ORRPB's own feed is stale
      } catch (e) {
        renderStatus('error', `Error: ${e.message}`);
        // Check origin
        if (location.protocol === 'file:') {
          renderBanner('error', `<strong>This dashboard requires a web server.</strong> Opening the HTML file directly from disk (file://) doesn't work because of browser security. See the README for how to host it. Data may be incomplete.`);
        } else {
          renderBanner('error', `<strong>Failed to fetch data:</strong> ${e.message}. The Vigilance API may be temporarily down. Retrying automatically in 60 seconds.`);
          setTimeout(fetchData, 60000);
        }
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
        btnLabel.textContent = tPage('refresh');
      }
    }

    // ---- Map drawer (lazy-loaded Leaflet) ----------------------------------
    // Stations to render on the map; superset of hero + regional cards.
    const MAP_STATIONS = [951, 545, 1279, 1195, 1004, 99001, 984, 548, 550, 981, 1264];
    // Status-bucket → CSS class. Mirrors Vigilance's etat_niv 1–6, plus 0 for stations
    // without configured flood thresholds (we still show them, just neutral colour).
    function statusClass(etat) { return `status-${etat == null ? 0 : etat}`; }
    // Ottawa River main-stem waypoints in upstream → downstream order. Station
    // coords come from the API (resolved at render time); intermediates fill in
    // the river's notable bends. Tributary 1004 is intentionally excluded.
    const RIVER_ROUTE = [
      { stationId: 951 },                             // Temiscaming village
      { stationId: 545 },                             // Mattawa
      { lat: 45.83, lon: -77.11, label: 'Pembroke' },
      { stationId: 1279 },                            // Waltham
      { stationId: 1195 },                            // Lac Coulonge
      { lat: 45.55, lon: -76.30, label: 'Bristol' },  // mid-bend SE of Lac Coulonge
      { stationId: 99001 },                           // Buckhams Bay (MVCA) — NW end of Lac Deschênes
      { stationId: 984 },                             // Aylmer — mid-lake
      { stationId: 548 },                             // Britannia — SE/downstream end
      { stationId: 550 },                             // Hull
      { stationId: 981 },                             // Masson
      { lat: 45.62, lon: -74.86, label: 'Lefaivre' },
      { lat: 45.57, lon: -74.39, label: 'Carillon' }, // dam
      { stationId: 1264 }                             // Rigaud
    ];
    let mapInstance = null;
    let mapMarkers = [];
    let riverRouteLine = null;
    let homeMarker = null;
    let leafletReady = null;
    let mapLang = 'en';

    // Cottage location. Default values are the most recent fix; refreshHomeCoords()
    // queries the LoRa weather station's live GPS via the /history/esp_gps view
    // each time the map opens, so the pin moves if the device is relocated.
    const HOME_PIN = { lat: 45.87865, lon: -76.783409, label: { en: 'Cottage (Mansfield)', fr: 'Chalet (Mansfield)' } };

    async function refreshHomeCoords() {
      try {
        const r = await fetch('/history/esp_gps?device_name=eq.Weather-Station&order=time.desc&limit=1&select=gps_latitude,gps_longitude');
        if (!r.ok) return;
        const rows = await r.json();
        const row = rows[0];
        if (row && Number.isFinite(row.gps_latitude) && Number.isFinite(row.gps_longitude)) {
          HOME_PIN.lat = row.gps_latitude;
          HOME_PIN.lon = row.gps_longitude;
        }
      } catch (e) { console.warn(`home coords fetch: ${e.message}`); }
    }

    // Map drawer text in EN / FR.
    const MAP_LABELS = {
      title:    { en: 'Ottawa River corridor',                     fr: 'Corridor de la rivière des Outaouais' },
      subtitle: { en: 'click a station to jump to its card',       fr: 'cliquez sur une station pour ouvrir sa fiche' },
      close:    { en: 'Close map',                                 fr: 'Fermer la carte' },
      legend:   { en: 'Legend',                                    fr: 'Légende' },
      status:   { en: 'Flood state',                               fr: 'État de crue' },
      trend:    { en: 'Trend',                                     fr: 'Tendance' },
      ref:      { en: 'Reference',                                 fr: 'Repères' },
      s6: { en: 'Major flood',     fr: 'Crue majeure' },
      s5: { en: 'Near major',      fr: 'Près de majeure' },
      s4: { en: 'Moderate',        fr: 'Modérée' },
      s3: { en: 'Minor',           fr: 'Mineure' },
      s2: { en: 'Pre-alert',       fr: 'Pré-alerte' },
      s1: { en: 'Normal',          fr: 'Normale' },
      s0: { en: 'No threshold',    fr: 'Sans seuil' },
      rising:   { en: 'Rising',    fr: 'En hausse' },
      falling:  { en: 'Falling',   fr: 'En baisse' },
      stable:   { en: 'Stable',    fr: 'Stable' },
      cottage:  { en: 'Cottage',   fr: 'Chalet' },
      river:    { en: 'Ottawa River', fr: 'Rivière des Outaouais' },
      about:    { en: 'How to read', fr: 'Comment lire' },
      about_status: {
        en: '<strong>Dot colour</strong> reflects the station\'s flood state. Quebec stations use Vigilance\'s official thresholds. Stations Vigilance can\'t classify (e.g. Mattawa) are synthesized — first against ORRPB published peaks (2017 / 2019 / 2023), then against the ECCC long-record percentile if needed. Synthetic values are flagged with <em>(est.)</em>.',
        fr: 'La <strong>couleur du point</strong> reflète l\'état de crue de la station. Les stations québécoises utilisent les seuils officiels Vigilance. Les stations sans seuil (p. ex. Mattawa) sont estimées — d\'abord à partir des pics ORRPB publiés (2017 / 2019 / 2023), sinon à partir du percentile ECCC sur l\'ensemble du registre. Les valeurs estimées sont marquées <em>(est.)</em>.'
      },
      about_pulse: {
        en: '<strong>Pulse colour</strong> is short-term trend over the last hour: red ≥ +1 mm/h rising, green ≤ −1 mm/h falling, grey otherwise.',
        fr: 'La <strong>couleur de la pulsation</strong> indique la tendance horaire : rouge si ≥ +1 mm/h en hausse, vert si ≤ −1 mm/h en baisse, gris sinon.'
      },
      about_pctl: {
        en: '<strong>%ile</strong> on Lac Coulonge\'s callout = rank of this season\'s peak among 54 historical annual peaks (1972–2025). 94th %ile means it would beat all but ~3 historical years.',
        fr: '<strong>Centile</strong> sur la fiche Lac Coulonge = rang du pic saisonnier parmi 54 pics annuels historiques (1972–2025). 94ᵉ centile signifie qu\'il dépasse tous sauf ~3 années historiques.'
      },
      about_orrpb: {
        en: '<strong>ORRPB ref</strong> compares the current level to the 2017 / 2019 / 2023 freshet peaks at that station — useful shorthand for "is this a 2019-level event?".',
        fr: '<strong>Réf. ORRPB</strong> compare le niveau actuel aux pics de crue 2017 / 2019 / 2023 à cette station — raccourci utile pour situer l\'événement.'
      },
      about_releases: {
        en: '<strong>Releases layer</strong> shows live discharge from each Hydro-Québec generating station: total m³/s, with a card outline that turns orange/red when the spill share exceeds 50% / 75% (operator is bypassing turbines to evacuate water). Tooltips on dam markers also show the live release.',
        fr: 'La <strong>couche Débits</strong> affiche le débit sortant de chaque centrale Hydro-Québec : total m³/s, avec un contour qui devient orange/rouge si la part déversée dépasse 50% / 75% (l\'opérateur contourne les turbines pour évacuer l\'eau). Les info-bulles sur les barrages indiquent aussi le débit actuel.'
      },
      about_cascade: {
        en: '<strong>Cascade layer</strong> draws lines connecting dams in hydrologic order (Ottawa main stem, Gatineau, Lièvre). Arrowheads show flow direction. The dashed red segment is the 130-km Bryson↔Des-Joachims reach with no intermediate flow controls (Exhibit D Figure 5).',
        fr: 'La <strong>couche Cascade</strong> trace des lignes reliant les barrages dans l\'ordre hydrologique (Outaouais, Gatineau, Lièvre). Les flèches indiquent le sens d\'écoulement. Le segment rouge pointillé est le tronçon de 130 km Bryson↔Des-Joachims sans contrôle de débit intermédiaire (Exhibit D Figure 5).'
      },
      about_src: {
        en: 'Sources: Quebec Vigilance API, MVCA / Kisters KiWIS (Buckhams Bay), Hydro-Québec open-data feed, ORRPB "Know Your Levels" PDF (2025-05-06), ECCC HYDAT.',
        fr: 'Sources : API Vigilance Québec, MVCA / Kisters KiWIS (Baie Buckhams), données ouvertes Hydro-Québec, document ORRPB « Know Your Levels » (2025-05-06), ECCC HYDAT.'
      }
    };
    // Per-station display name; English by default, French where it differs.
    const STATION_NAMES = {
      951:  { en: 'Temiscaming',     fr: 'Témiscaming' },
      545:  { en: 'Mattawa',         fr: 'Mattawa' },
      1279: { en: 'Waltham',         fr: 'Waltham' },
      1195: { en: 'Lac Coulonge',    fr: 'Lac Coulonge' },
      1004: { en: 'Coulonge River',  fr: 'Rivière Coulonge' },
      99001:{ en: 'Buckhams Bay',    fr: 'Baie Buckhams' },
      984:  { en: 'Aylmer',          fr: 'Aylmer' },
      548:  { en: 'Britannia',       fr: 'Britannia' },
      550:  { en: 'Hull',            fr: 'Hull' },
      981:  { en: 'Masson',          fr: 'Masson' },
      1264: { en: 'Rigaud',          fr: 'Rigaud' }
    };

    function loadCss(href) {
      return new Promise(resolve => {
        if (document.querySelector(`link[href="${href}"]`)) { resolve(); return; }
        const l = document.createElement('link');
        l.rel = 'stylesheet'; l.href = href; l.onload = resolve; l.onerror = resolve;
        document.head.appendChild(l);
      });
    }
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
        const s = document.createElement('script');
        s.src = src; s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    function ensureLeaflet() {
      if (leafletReady) return leafletReady;
      // Load core Leaflet first; the minimap plugin depends on `L` being defined.
      leafletReady = Promise.all([
        loadCss('https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'),
        loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js')
      ]).then(() => Promise.all([
        loadCss('https://unpkg.com/leaflet-minimap@3.6.1/dist/Control.MiniMap.min.css'),
        loadScript('https://unpkg.com/leaflet-minimap@3.6.1/dist/Control.MiniMap.min.js')
      ]));
      return leafletReady;
    }

    // EPSG:3857 (Web Mercator metres) → WGS84 lat/lon, matches the API's geom_p.
    function wmToLatLon([x, y]) {
      const lon = x / 6378137 * 180 / Math.PI;
      const lat = (2 * Math.atan(Math.exp(y / 6378137)) - Math.PI / 2) * 180 / Math.PI;
      return [lat, lon];
    }

    // Priority order for the sticky-cluster collision pass. The property gauge
    // always wins; then upstream early-warning stations; then downstream context.
    const CALLOUT_PRIORITY = [1195, 545, 1279, 1004, 951, 548, 984, 550, 981, 1264];
    function rectsOverlap(a, b) {
      return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
    }

    // Recompute card marker positions in screen-pixel space so the leader-line
    // callout stays a fixed visual distance from the dot at any zoom level.
    // Then run a sticky-cluster pass: walk priority order and hide cards that
    // overlap higher-priority cards already on screen. Dots stay visible.
    function repositionCallouts() {
      if (!mapInstance) return;
      for (const m of mapMarkers) {
        const dotPx = mapInstance.latLngToLayerPoint(m.stationLatLng);
        const cardPx = dotPx.add(m.offsetPx);
        const cardLatLng = mapInstance.layerPointToLatLng(cardPx);
        m.card.setLatLng(cardLatLng);
        m.line.setLatLngs([m.stationLatLng, cardLatLng]);
      }
      // Sort markers by configured priority, fall back to original order.
      const ordered = [...mapMarkers].sort((a, b) => {
        const ai = CALLOUT_PRIORITY.indexOf(a.id);
        const bi = CALLOUT_PRIORITY.indexOf(b.id);
        return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      });
      const visibleRects = [];
      for (const m of ordered) {
        const cardEl = m.card.getElement()?.querySelector('.river-marker-card');
        if (!cardEl) continue;
        cardEl.style.visibility = '';
        const rect = cardEl.getBoundingClientRect();
        const collides = visibleRects.some(r => rectsOverlap(rect, r));
        if (collides) {
          cardEl.style.visibility = 'hidden';
          m.line.setStyle({ opacity: 0 });
        } else {
          m.line.setStyle({ opacity: 0.7 });
          visibleRects.push(rect);
        }
      }
    }

    function scrollToCard(stationId) {
      const el = document.querySelector(`[data-station-id="${stationId}"]`);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.remove('scroll-flash');
      // Force reflow so the animation restarts when re-clicking the same marker.
      void el.offsetWidth;
      el.classList.add('scroll-flash');
    }

    async function renderMapMarkers() {
      if (!mapInstance || !lastData) return;
      // Tear down existing markers / lines — readings change between refreshes.
      for (const m of mapMarkers) {
        if (m.dot)  mapInstance.removeLayer(m.dot);
        if (m.card) mapInstance.removeLayer(m.card);
        if (m.line) mapInstance.removeLayer(m.line);
      }
      mapMarkers = [];
      const present = [];
      let dotIndex = 0;
      // Broadcast-style callout offset (in screen pixels) — alternates above/below so
      // adjacent stations don't pile up. Slight horizontal slant gives a leader-line feel.
      const offsetForIndex = i => {
        const up = i % 2 === 0;
        const x = (i % 4 < 2 ? -1 : 1) * 20;
        const y = up ? -72 : 72;
        return L.point(x, y);
      };
      for (const id of MAP_STATIONS) {
        let station = lastData[id];
        if (!station) {
          const mvcaSpec = REGIONAL_STATIONS.find(s => s.id === id && s.source === 'mvca');
          try {
            station = mvcaSpec ? await fetchKiwisStation(mvcaSpec) : await fetchStation(id);
            lastData[id] = station;
          } catch (e) { console.warn(`map fetch ${id}: ${e.message}`); continue; }
        }
        if (!station.metadata?.geom_p) continue;
        const [lat, lon] = wmToLatLon(station.metadata.geom_p.coordinates);
        const stationLatLng = L.latLng(lat, lon);
        // Outage presentation: a gauge can have no readings at all (grey inert
        // "nodata" marker — removing it entirely made "feed outage" look like
        // "station removed"), or only stale mirror-spliced rows (keep the status
        // colour, stop the live pulse, show reading age instead of a trend).
        const latest = station.readings?.length ? station.readings[station.readings.length - 1] : null;
        const latestMs = latest ? (parseVigilance(latest.date_prise_valeur)?.getTime() || 0) : 0;
        const isStale = !latest || (Date.now() - latestMs > FALLBACK_STALE_H * 3600 * 1000);
        const trendMmH = (station.metadata.trend_niv || 0) * 1000;
        const trendCmH = trendMmH / 10;
        const arrow = trendCmH > 0.05 ? '↑' : trendCmH < -0.05 ? '↓' : '→';
        const trendTxt = !latest ? 'No recent data'
          : isStale ? `reading ${ago(latest.date_prise_valeur)}`
          : `${arrow} ${Math.abs(trendCmH).toFixed(1)} cm/h`;
        const trendCls = (latest && !isStale)
          ? (trendMmH > 1 ? 'trend-rising' : trendMmH < -1 ? 'trend-falling' : 'trend-stable') : '';
        const statusCls = latest
          ? statusClass(getEffectiveEtat(station.metadata)) + (isStale ? ' stale' : '')
          : 'nodata';
        const name = (STATION_NAMES[id] && STATION_NAMES[id][mapLang]) || station.metadata.label || `Station ${id}`;
        const delay = (dotIndex * 220) % 2400;

        // Dot at the true station location. Pulse colour reflects trend; dot fill reflects role/flood.
        const dotIcon = L.divIcon({
          className: 'river-marker-icon',
          html: `<div class="river-dot ${statusCls} ${trendCls}" style="animation-delay:${delay}ms"></div>`,
          iconSize: [12, 12], iconAnchor: [6, 6]
        });
        const dot = L.marker(stationLatLng, { icon: dotIcon, riseOnHover: true, zIndexOffset: 500 }).addTo(mapInstance);

        // Percentile line — only Lac Coulonge has the historical depth (54-yr CSV).
        let percentileLine = '';
        if (id === 1195 && latest) {
          const yrMax = lastYearRanges[1195] && lastYearRanges[1195].max;
          const peakLevel = (yrMax && yrMax.valeur > latest.valeur) ? yrMax.valeur : latest.valeur;
          const rank = rankPeak(peakLevel);
          const pctl = Math.round(((HISTORICAL_RECORD_YEARS - rank + 1) / HISTORICAL_RECORD_YEARS) * 100);
          const cls = pctl >= 90 ? 'percentile high' : 'percentile';
          percentileLine = `<div class="${cls}" title="Year's peak ${peakLevel.toFixed(2)} m ranks ${ordinal(rank)} of ${HISTORICAL_RECORD_YEARS} on record (1972–2025)"><strong>${ordinal(pctl)} %ile</strong> · 1972–2025</div>`;
        }
        // Card divIcon — placed at an offset latLng we recompute on zoom/pan.
        const levelLine = latest
          ? `<div class="level">${displayLevel(station.metadata, latest.valeur).toFixed(2)}<span class="unit"> m</span></div>`
          : '';
        const cardHtml = `<div class="river-marker-card ${statusCls}" data-jump-id="${id}">
          <div class="name">${name}</div>
          ${levelLine}
          <div class="trend${isStale ? ' stale-note' : ''}">${trendTxt}</div>
          ${percentileLine}
        </div>`;
        const cardIcon = L.divIcon({ className: 'river-marker-icon', html: cardHtml, iconSize: null, iconAnchor: [70, 18] });
        const card = L.marker(stationLatLng, { icon: cardIcon, riseOnHover: true, zIndexOffset: 600 }).addTo(mapInstance);

        // Leader line. We update both endpoints in repositionCallouts().
        const line = L.polyline([stationLatLng, stationLatLng], {
          color: '#888', weight: 1.2, opacity: 0.7, dashArray: '4,4', interactive: false
        }).addTo(mapInstance);

        const jump = () => { toggleMap(); setTimeout(() => scrollToCard(id), 350); };
        dot.on('click', jump);
        card.on('click', jump);

        mapMarkers.push({ id, dot, card, line, offsetPx: offsetForIndex(dotIndex), stationLatLng });
        present.push([lat, lon]);
        dotIndex++;
      }

      // River route polyline (animated marching-ants line).
      if (riverRouteLine) mapInstance.removeLayer(riverRouteLine);
      const routeCoords = [];
      for (const wp of RIVER_ROUTE) {
        if (wp.lat != null) {
          routeCoords.push([wp.lat, wp.lon]);
        } else {
          const s = lastData[wp.stationId];
          if (s?.metadata?.geom_p) routeCoords.push(wmToLatLon(s.metadata.geom_p.coordinates));
        }
      }
      if (routeCoords.length >= 2) {
        riverRouteLine = L.polyline(routeCoords, {
          color: '#4FA3C7', weight: 3, opacity: 0.7, dashArray: '12,12',
          lineCap: 'round', interactive: false, className: 'river-route'
        }).addTo(mapInstance);
        riverRouteLine.bringToBack(); // sit under the leader lines
      }
      renderHomePin();
      repositionCallouts();
      if (present.length) mapInstance.fitBounds(present, { padding: [40, 40] });
    }

    function renderHomePin() {
      if (!mapInstance) return;
      if (homeMarker) mapInstance.removeLayer(homeMarker);
      const label = HOME_PIN.label[mapLang] || HOME_PIN.label.en;
      const icon = L.divIcon({
        className: 'river-marker-icon',
        html: `<div class="home-pin" title="${label}">🏠</div>`,
        iconSize: [22, 22], iconAnchor: [11, 11]
      });
      homeMarker = L.marker([HOME_PIN.lat, HOME_PIN.lon], { icon, riseOnHover: true, zIndexOffset: 800 }).addTo(mapInstance);
      homeMarker.bindTooltip(`<strong>${label}</strong>`, {
        direction: 'top', offset: [0, -12], className: 'river-tip', opacity: 0.95
      });
    }

    function applyMapLang() {
      const t = (k) => MAP_LABELS[k][mapLang] || MAP_LABELS[k].en;
      const title = document.getElementById('map-title');
      const sub = document.getElementById('map-subtitle');
      const close = document.getElementById('map-close-btn');
      const legendBtnText = document.getElementById('map-legend-btn-text');
      if (title) title.textContent = t('title');
      if (sub)   sub.textContent = t('subtitle');
      if (close) close.setAttribute('aria-label', t('close'));
      if (legendBtnText) legendBtnText.textContent = t('legend');
      const aboutBtnText = document.getElementById('map-about-btn-text');
      if (aboutBtnText) aboutBtnText.textContent = t('about');
      document.querySelectorAll('#map-lang-toggle button').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === mapLang);
      });
      renderLegend();
      renderAbout();
    }

    function renderLegend() {
      const legend = document.getElementById('map-legend');
      if (!legend) return;
      const t = (k) => MAP_LABELS[k][mapLang] || MAP_LABELS[k].en;
      const dot = (rgb, txt) => `<div class="legend-item"><span class="legend-dot" style="--legend-color:${rgb}"></span>${txt}</div>`;
      const pulse = (rgb, txt) => `<div class="legend-item"><span class="legend-pulse" style="--legend-color:${rgb}"></span>${txt}</div>`;
      legend.innerHTML = `
        <div class="legend-section">
          <div class="legend-title">${t('status')}</div>
          ${dot('156,26,26',  t('s6'))}
          ${dot('224,75,74',  t('s5'))}
          ${dot('224,127,47', t('s4'))}
          ${dot('239,159,39', t('s3'))}
          ${dot('245,200,66', t('s2'))}
          ${dot('76,175,80',  t('s1'))}
          ${dot('79,163,199', t('s0'))}
        </div>
        <div class="legend-section">
          <div class="legend-title">${t('trend')}</div>
          ${pulse('224,75,74',  t('rising'))}
          ${pulse('90,180,120', t('falling'))}
          ${pulse('160,160,160', t('stable'))}
        </div>
        <div class="legend-section">
          <div class="legend-item"><span class="legend-home">🏠</span>${t('cottage')}</div>
          <div class="legend-item"><span class="legend-river"></span>${t('river')}</div>
        </div>
      `;
    }

    function toggleLegend() {
      const legend = document.getElementById('map-legend');
      if (legend) legend.classList.toggle('open');
      // Mutually exclusive with the about panel — only one should sit at top-left at a time.
      const about = document.getElementById('map-about');
      if (about?.classList.contains('open')) about.classList.remove('open');
    }

    function renderAbout() {
      const panel = document.getElementById('map-about');
      if (!panel) return;
      const t = (k) => MAP_LABELS[k][mapLang] || MAP_LABELS[k].en;
      panel.innerHTML = `
        <p>${t('about_status')}</p>
        <p>${t('about_pulse')}</p>
        <p>${t('about_pctl')}</p>
        <p>${t('about_orrpb')}</p>
        <p>${t('about_releases')}</p>
        <p>${t('about_cascade')}</p>
        <p class="src">${t('about_src')}</p>
      `;
    }

    function toggleAbout() {
      const about = document.getElementById('map-about');
      if (!about) return;
      if (!about.dataset.initialized) { renderAbout(); about.dataset.initialized = '1'; }
      about.classList.toggle('open');
      // Hide legend if it was open at the same anchor.
      const legend = document.getElementById('map-legend');
      if (about.classList.contains('open') && legend?.classList.contains('open')) legend.classList.remove('open');
    }

    // ---- Dams overlay: hydroelectric stations + major dams + principal reservoirs --
    let damsLayerGroup = null;
    let damsData = null;
    let damsLoading = null;
    let hqReleasesCache = null;
    let hqReleasesLoading = null;

    async function ensureDamsData() {
      if (damsData) return damsData;
      if (!damsLoading) damsLoading = fetch('/orw-dams.json').then(r => r.ok ? r.json() : null).catch(() => null);
      damsData = await damsLoading;
      return damsData;
    }

    // Latest HQ release per centrale, indexed by site_id. Best-effort — if hq-ingest
    // hasn't run yet, returns {} and the dam tooltips just skip the live-flow line.
    async function ensureHqReleases() {
      if (hqReleasesCache) return hqReleasesCache;
      if (!hqReleasesLoading) {
        hqReleasesLoading = fetch('/history/latest_dam_releases', { cache: 'no-store' })
          .then(r => r.ok ? r.json() : [])
          .then(arr => Object.fromEntries(arr.map(r => [r.site_id, r])))
          .catch(() => ({}));
      }
      hqReleasesCache = await hqReleasesLoading;
      return hqReleasesCache;
    }

    function buildDamsLayer(data, releases) {
      const group = L.layerGroup();
      releases = releases || {};
      // Hydroelectric stations — bigger marker for ≥100 MW.
      for (const h of data.hydro || []) {
        if (h.lat == null || h.lon == null) continue;
        const big = (h.mw || 0) >= 100;
        const cls = `dam-icon hydro${big ? ' big' : ''}`;
        const icon = L.divIcon({ className: 'river-marker-icon', html: `<div class="${cls}" title="${h.name}">⚡</div>`,
          iconSize: big ? [22, 22] : [18, 18], iconAnchor: big ? [11, 11] : [9, 9] });
        // If this hydro entry is mapped to an HQ centrale, append a live-release
        // line: total m³/s + spill share. Falls back silently if no data yet.
        let releaseLine = '';
        if (h.hq_site_id && releases[h.hq_site_id]) {
          const r = releases[h.hq_site_id];
          if (r.total_cms != null) {
            const total = Math.round(r.total_cms).toLocaleString();
            const spillFrac = r.spilled_cms && r.total_cms ? Math.round(r.spilled_cms / r.total_cms * 100) : 0;
            const tag = spillFrac >= 50 ? `<span style="color:#e07f2f;font-weight:600;"> · ${spillFrac}% spill</span>`
                      : spillFrac > 0  ? ` · ${spillFrac}% spill` : '';
            releaseLine = `<br><span style="color:var(--text-faint);">↳ ${total} m³/s${tag}</span>`;
          }
        }
        L.marker([h.lat, h.lon], { icon, riseOnHover: true })
          .bindTooltip(`<strong>${h.name}</strong><br>${h.mw || '?'} MW · ${h.owner || '—'}${releaseLine}`,
            { direction: 'top', offset: [0, -10], className: 'river-tip', opacity: 0.95 })
          .addTo(group);
      }
      // Major dams (height 10m+). Skip those that already have a hydro entry at the
      // same coords (we already drew that marker as a hydro icon).
      const hydroSet = new Set((data.hydro || []).map(h => `${h.lat?.toFixed(3)},${h.lon?.toFixed(3)}`));
      for (const dm of data.major_dams || []) {
        if (dm.lat == null || dm.lon == null) continue;
        if (hydroSet.has(`${dm.lat.toFixed(3)},${dm.lon.toFixed(3)}`)) continue;
        const icon = L.divIcon({ className: 'river-marker-icon',
          html: `<div class="dam-icon major-dam" title="${dm.name}">▼</div>`,
          iconSize: [18, 18], iconAnchor: [9, 9] });
        const meta = [`${dm.height_m || '?'} m high`, dm.year ? `built ${dm.year}` : null, dm.river || null]
          .filter(Boolean).join(' · ');
        L.marker([dm.lat, dm.lon], { icon, riseOnHover: true })
          .bindTooltip(`<strong>${dm.name}</strong><br>${meta}`,
            { direction: 'top', offset: [0, -10], className: 'river-tip', opacity: 0.95 })
          .addTo(group);
      }
      // Principal reservoirs — centroid markers.
      for (const r of data.reservoirs || []) {
        if (r.lat == null || r.lon == null) continue;
        const icon = L.divIcon({ className: 'river-marker-icon',
          html: `<div class="dam-icon reservoir" title="${r.name}">≈</div>`,
          iconSize: [18, 18], iconAnchor: [9, 9] });
        const meta = [r.capacity_mcm ? `${r.capacity_mcm} Mm³` : null, r.year ? `built ${r.year}` : null, r.agency]
          .filter(Boolean).join(' · ');
        L.marker([r.lat, r.lon], { icon, riseOnHover: true })
          .bindTooltip(`<strong>${r.name}</strong> (reservoir)<br>${meta}`,
            { direction: 'top', offset: [0, -10], className: 'river-tip', opacity: 0.95 })
          .addTo(group);
      }
      return group;
    }

    // Reservoir card overlay — same data as the Reservoirs tab, plotted at each
    // reservoir's lat/lon (sourced from orw-dams.json centroids; Lady Evelyn
    // added by hand as it's not in the ArcGIS layer).
    const RESERVOIR_LOCATIONS = {
      dozois:                 { lat: 47.481, lon: -77.109 },
      rapide_7:               { lat: 47.717, lon: -78.126 },
      quinze:                 { lat: 47.592, lon: -78.983 },
      lady_evelyn:            { lat: 47.300, lon: -80.450 },
      kipawa:                 { lat: 46.958, lon: -79.029 },
      timiskaming:            { lat: 47.398, lon: -79.527 },
      timiskaming_haileybury: { lat: 47.450, lon: -79.530 },
      des_joachims:           { lat: 46.230, lon: -77.988 },
      bark_lake:              { lat: 45.463, lon: -77.863 },
      cabonga:                { lat: 47.317, lon: -76.581 },
      baskatong:              { lat: 46.809, lon: -75.859 },
      mitchinamecus:          { lat: 47.337, lon: -75.100 },
      kiamika:                { lat: 46.664, lon: -75.074 },
      poisson_blanc:          { lat: 45.986, lon: -75.737 }
    };
    let reservoirLayerGroup = null;

    async function buildReservoirsLayer() {
      if (typeof L === 'undefined') return null;
      const limitsCfg = await ensureReservoirLimits();
      let snapshot = reservoirSnapshotCache;
      if (!snapshot) {
        try { snapshot = await fetchReservoirSnapshot(); reservoirSnapshotCache = snapshot; }
        catch (e) { console.warn(`reservoir snapshot for map: ${e.message}`); return null; }
      }
      const cfg = limitsCfg.reservoirs || {};
      const group = L.layerGroup();
      for (const snap of snapshot) {
        const loc = RESERVOIR_LOCATIONS[snap.reservoir_id];
        const c = cfg[snap.reservoir_id];
        if (!loc || !c) continue;
        const pct = pctFull(snap.level_m, c.low_limit, c.high_limit);
        const priorPct = pctFull(snap.prior_level_m, c.low_limit, c.high_limit);
        const change = (pct != null && priorPct != null) ? pct - priorPct : null;
        const cls = fillClass(pct);
        const barColor = fillBarColor(pct);
        const barWidth = pct != null ? Math.min(100, pct) : 0;
        const changeArrow = change == null ? '' : Math.abs(change) < 0.05 ? '→' : change > 0 ? '↑' : '↓';
        const changeCls = change == null ? '' : Math.abs(change) < 0.05 ? '' : change > 0 ? 'up' : 'down';
        const changeStr = change == null ? '' : `${changeArrow} ${change > 0 ? '+' : ''}${change.toFixed(2)} pp/24h`;
        // Operational-state pill for Des Joachims (matches the Reservoirs tab logic).
        let opLine = '';
        if (snap.reservoir_id === 'des_joachims') {
          const state = desJoachimsOpState(change);
          if (state) {
            const text = state.cls === 'paused' ? '⏸ Pass-through' : '↑ Refilling';
            opLine = `<div class="res-op-state ${state.cls}" title="${state.label}">${text}</div>`;
          }
        }
        const html = `<div class="res-map-card ${cls}" title="${c.name} (${c.agency}) · ${snap.level_m != null ? snap.level_m.toFixed(2) + ' m' : '—'}">
          <div class="name">${c.name}</div>
          <div class="pct">${pct != null ? pct.toFixed(0) : '—'}<span class="unit">% full</span></div>
          <div class="bar"><div class="bar-fill" style="width:${barWidth}%; background:${barColor}"></div></div>
          <div class="change ${changeCls}">${changeStr}</div>
          ${opLine}
        </div>`;

        // Static lat/lon offset — card sits NE of the actual reservoir centroid
        // with a dashed leader line back. Same broadcast-callout pattern as the
        // river-station cards but simpler: no per-zoom recompute since reservoirs
        // are spread far enough apart that overlaps aren't an issue.
        const cardLat = loc.lat + 0.04;
        const cardLon = loc.lon + 0.05;

        // Small dot at the true reservoir centroid, fill-coloured to match.
        const dotIcon = L.divIcon({
          className: 'river-marker-icon',
          html: `<div class="res-map-dot" style="background:${barColor}"></div>`,
          iconSize: [10, 10], iconAnchor: [5, 5]
        });
        L.marker([loc.lat, loc.lon], { icon: dotIcon, zIndexOffset: 250 }).addTo(group);

        // Dashed leader line, dot → card.
        L.polyline([[loc.lat, loc.lon], [cardLat, cardLon]], {
          color: '#888', weight: 1.2, opacity: 0.65, dashArray: '4,3', interactive: false
        }).addTo(group);

        // Card at the offset position.
        const icon = L.divIcon({ className: 'river-marker-icon', html, iconSize: null, iconAnchor: [50, 60] });
        L.marker([cardLat, cardLon], { icon, riseOnHover: true, zIndexOffset: 300 }).addTo(group);
      }
      return group;
    }

    async function toggleReservoirsLayer() {
      if (!mapInstance) return;
      const btn = document.getElementById('map-reservoirs-btn');
      if (reservoirLayerGroup && mapInstance.hasLayer(reservoirLayerGroup)) {
        mapInstance.removeLayer(reservoirLayerGroup);
        btn?.classList.remove('active');
        return;
      }
      if (!reservoirLayerGroup) reservoirLayerGroup = await buildReservoirsLayer();
      if (!reservoirLayerGroup) return;
      reservoirLayerGroup.addTo(mapInstance);
      btn?.classList.add('active');
    }

    // ---- Releases callout layer ----
    // Live HQ generating-station release cards plotted at each centrale's lat/lon.
    // Card colour signals spill fraction (blue = no spill, orange = >30%,
    // red = >75%). Uses the same dot + leader-line pattern as the reservoir layer.
    let releasesLayerGroup = null;

    function spillClass(spillFrac) {
      if (spillFrac == null) return 'spill-low';
      if (spillFrac >= 0.75) return 'spill-extreme';
      if (spillFrac >= 0.50) return 'spill-high';
      if (spillFrac >= 0.20) return 'spill-mid';
      return 'spill-low';
    }
    function spillBarColor(spillFrac) {
      if (spillFrac == null) return 'var(--blue)';
      if (spillFrac >= 0.75) return 'rgb(224,75,74)';
      if (spillFrac >= 0.50) return 'rgb(224,127,47)';
      if (spillFrac >= 0.20) return 'rgb(245,200,66)';
      return 'rgb(76,140,224)';
    }

    async function buildReleasesLayer() {
      if (typeof L === 'undefined') return null;
      const [data, releases] = await Promise.all([ensureDamsData(), ensureHqReleases()]);
      if (!data) return null;
      const group = L.layerGroup();
      // Iterate orw-dams hydro entries that carry an hq_site_id — that's our
      // pre-computed mapping of lat/lon to HQ centrale.
      for (const h of data.hydro || []) {
        if (!h.hq_site_id) continue;
        const r = releases[h.hq_site_id];
        if (!r || r.total_cms == null) continue;
        const total = Math.round(r.total_cms);
        const turb = r.turbined_cms || 0;
        const spill = r.spilled_cms || 0;
        const denom = (turb + spill) || total || 1;
        const turbPct  = Math.max(0, Math.min(100, (turb  / denom) * 100));
        const spillPct = Math.max(0, Math.min(100, (spill / denom) * 100));
        const spillFrac = total ? spill / total : 0;
        const cls = spillClass(spillFrac);
        const dotColor = spillBarColor(spillFrac);
        const spillTag = spillFrac > 0
          ? `<div class="spill ${spillFrac >= 0.5 ? 'high' : ''}">${Math.round(spillFrac * 100)}% spilled</div>`
          : `<div class="spill">all turbined</div>`;
        const html = `<div class="rel-map-card ${cls}" title="${h.name} (HQ) · last update ${ago(r.time)}">
          <div class="name">${h.name}</div>
          <div class="flow">${total.toLocaleString()}<span class="unit">m³/s</span></div>
          ${spillTag}
          <div class="bar"><div class="bar-turb" style="width:${turbPct}%"></div><div class="bar-spill" style="width:${spillPct}%"></div></div>
        </div>`;

        // Offset card NE of dam, leader line back. Smaller offsets than reservoir
        // cards (HQ centrales are close to one another in the upper basin).
        const cardLat = h.lat + 0.025;
        const cardLon = h.lon + 0.035;

        const dotIcon = L.divIcon({
          className: 'river-marker-icon',
          html: `<div class="rel-map-dot" style="background:${dotColor}"></div>`,
          iconSize: [10, 10], iconAnchor: [5, 5]
        });
        L.marker([h.lat, h.lon], { icon: dotIcon, zIndexOffset: 250 }).addTo(group);

        L.polyline([[h.lat, h.lon], [cardLat, cardLon]], {
          color: '#888', weight: 1.2, opacity: 0.65, dashArray: '4,3', interactive: false
        }).addTo(group);

        const icon = L.divIcon({ className: 'river-marker-icon', html, iconSize: null, iconAnchor: [44, 50] });
        L.marker([cardLat, cardLon], { icon, riseOnHover: true, zIndexOffset: 300 }).addTo(group);
      }
      return group;
    }

    async function toggleReleasesLayer() {
      if (!mapInstance) return;
      const btn = document.getElementById('map-releases-btn');
      if (releasesLayerGroup && mapInstance.hasLayer(releasesLayerGroup)) {
        mapInstance.removeLayer(releasesLayerGroup);
        btn?.classList.remove('active');
        return;
      }
      if (!releasesLayerGroup) releasesLayerGroup = await buildReleasesLayer();
      if (!releasesLayerGroup) return;
      releasesLayerGroup.addTo(mapInstance);
      btn?.classList.add('active');
    }

    // ---- Cascade layer ----
    // Polylines connecting dams in hydrologic order (upstream → downstream),
    // to make the cascade structure visible at a glance. The 130-km Bryson↔
    // Des-Joachims reach (Exhibit D Figure 5) is highlighted in accent red as
    // the case-file's "no flow controls" stretch. Coords are pulled from
    // orw-dams.json (hydro + major_dams + reservoirs) by name.
    const CASCADE_CHAINS = {
      ottawa_main: {
        label: 'Ottawa main stem',
        color: 'rgba(40, 70, 110, 0.55)',
        weight: 2.5,
        nodes: [
          // Upper-Ottawa cluster (feeds Lake Timiskaming)
          'Rapide-2', 'Rapide-7', 'Rapides-des-Quinze', 'Rapides-des-Îles', 'Première-Chute',
          // Down through Lake Timiskaming and the OPG/HQ chain to Carillon
          'Lower Notch', 'Otto Holden', 'Des-Joachims', 'Bryson', 'Chenaux', 'Carillon',
        ],
      },
      gatineau: {
        label: 'Gatineau',
        color: 'rgba(70, 110, 60, 0.55)',
        weight: 2.5,
        nodes: ['Cabonga', 'Mercier', 'Baskatong', 'Paugan', 'Chelsea', 'Rapides-Farmer'],
      },
      lievre: {
        label: 'Lièvre',
        color: 'rgba(140, 80, 40, 0.55)',
        weight: 2.5,
        nodes: ['Mitchinamecus', 'Kiamika', 'Poisson Blanc'],
      },
    };
    // The case-file reach: Bryson upstream to Des Joachims, no intermediate
    // flow controls. Drawn last in accent red so it sits on top.
    const CASE_FILE_REACH = ['Des-Joachims', 'Bryson'];

    let cascadeLayerGroup = null;

    function lookupCoord(name, data) {
      // Search hydro, major_dams, reservoirs in priority order. Some Lièvre /
      // Gatineau headwaters live only in reservoirs (Cabonga, Baskatong, etc.).
      for (const bucket of ['hydro', 'major_dams', 'reservoirs']) {
        const hit = (data[bucket] || []).find(d => d.name === name);
        if (hit && hit.lat != null && hit.lon != null) return [hit.lat, hit.lon];
      }
      return null;
    }

    async function buildCascadeLayer() {
      if (typeof L === 'undefined') return null;
      const data = await ensureDamsData();
      if (!data) return null;
      const group = L.layerGroup();

      for (const [_, chain] of Object.entries(CASCADE_CHAINS)) {
        const coords = chain.nodes.map(n => lookupCoord(n, data)).filter(Boolean);
        if (coords.length < 2) continue;
        L.polyline(coords, {
          color: chain.color, weight: chain.weight, opacity: 1,
          smoothFactor: 1, interactive: false,
        }).addTo(group);
        // Tiny arrowhead at each segment midpoint, oriented along the segment.
        for (let i = 0; i < coords.length - 1; i++) {
          const [a, b] = [coords[i], coords[i + 1]];
          const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
          const angle = Math.atan2(b[0] - a[0], b[1] - a[1]) * 180 / Math.PI;
          // Leaflet rotates HTML via CSS transform (no native primitive).
          const html = `<div class="cascade-line-arrow" style="transform: rotate(${-angle}deg); width:14px; height:14px; display:flex; align-items:center; justify-content:center; color:${chain.color.replace('0.55','0.95')}; font-size:14px; line-height:1;">▶</div>`;
          const icon = L.divIcon({ className: 'river-marker-icon', html, iconSize: [14, 14], iconAnchor: [7, 7] });
          L.marker(mid, { icon, interactive: false, keyboard: false, zIndexOffset: -100 }).addTo(group);
        }
      }

      // Case-file reach overlay — Bryson upstream to Des Joachims, in accent red.
      const reachCoords = CASE_FILE_REACH.map(n => lookupCoord(n, data)).filter(Boolean);
      if (reachCoords.length === 2) {
        L.polyline(reachCoords, {
          color: 'rgba(179, 38, 30, 0.85)', weight: 4, opacity: 0.9,
          dashArray: '8 4', interactive: false,
        }).addTo(group);
        // Label at the midpoint
        const mid = [(reachCoords[0][0] + reachCoords[1][0]) / 2,
                     (reachCoords[0][1] + reachCoords[1][1]) / 2];
        const label = L.divIcon({
          className: 'river-marker-icon',
          html: `<div style="background:rgba(179,38,30,0.9); color:white; font-size:9px; font-weight:700; padding:2px 6px; border-radius:3px; white-space:nowrap; letter-spacing:0.05em; text-transform:uppercase;">130 km · no flow controls</div>`,
          iconSize: null, iconAnchor: [70, 8],
        });
        L.marker(mid, { icon: label, interactive: false, zIndexOffset: 200 }).addTo(group);
      }

      return group;
    }

    async function toggleCascadeLayer() {
      if (!mapInstance) return;
      const btn = document.getElementById('map-cascade-btn');
      if (cascadeLayerGroup && mapInstance.hasLayer(cascadeLayerGroup)) {
        mapInstance.removeLayer(cascadeLayerGroup);
        btn?.classList.remove('active');
        return;
      }
      if (!cascadeLayerGroup) cascadeLayerGroup = await buildCascadeLayer();
      if (!cascadeLayerGroup) return;
      cascadeLayerGroup.addTo(mapInstance);
      btn?.classList.add('active');
    }

    async function toggleDams() {
      if (!mapInstance) return;
      const btn = document.getElementById('map-dams-btn');
      if (damsLayerGroup && mapInstance.hasLayer(damsLayerGroup)) {
        mapInstance.removeLayer(damsLayerGroup);
        btn?.classList.remove('active');
        return;
      }
      const [data, releases] = await Promise.all([ensureDamsData(), ensureHqReleases()]);
      if (!data) {
        console.warn('Failed to load dams data');
        return;
      }
      if (!damsLayerGroup) damsLayerGroup = buildDamsLayer(data, releases);
      damsLayerGroup.addTo(mapInstance);
      btn?.classList.add('active');
    }

    function toggleFullscreen() {
      const drawer = document.getElementById('map-drawer');
      if (!drawer) return;
      drawer.classList.toggle('fullscreen');
      // Wait for the width transition to settle before telling Leaflet to re-measure.
      setTimeout(() => {
        if (mapInstance) {
          mapInstance.invalidateSize();
          repositionCallouts();
        }
      }, 270);
    }
    document.addEventListener('click', e => {
      const btn = e.target.closest('#map-lang-toggle button');
      if (!btn) return;
      if (btn.dataset.lang === mapLang) return;
      mapLang = btn.dataset.lang;
      applyMapLang();
      if (mapInstance) renderMapMarkers(); // re-render with new strings
    });

    // Basemap tile layers, returned as an array because dark mode needs two of
    // them. CARTO's dark_all now stamps "API KEY REQUIRED" diagonally across
    // anonymous tiles — it still answers 200 OK, so nothing errors and nothing
    // logs, the tiles just arrive defaced. Esri's World Dark Gray Canvas needs no
    // key, at the cost of two quirks: labels live in a separate Reference layer,
    // and tiles only exist to native zoom 16 (past that it serves a light-grey
    // "Map data not yet available" placeholder, which on a dark map is worse than
    // the watermark). maxNativeZoom pins the fetch at 16 and lets Leaflet upscale
    // to the map's max of 18.
    const OSM_ATTRIB  = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
    const ESRI_ATTRIB = 'Tiles &copy; <a href="https://www.esri.com/">Esri</a>, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, GIS user community';
    const ESRI_DARK   = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_';

    function basemapLayers(isDark, opts) {
      if (!isDark) {
        return [L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { ...opts, attribution: OSM_ATTRIB })];
      }
      // Note the {z}/{y}/{x} order — ArcGIS REST serves row before column.
      return [
        L.tileLayer(`${ESRI_DARK}Base/MapServer/tile/{z}/{y}/{x}`,      { ...opts, maxNativeZoom: 16, zIndex: 1, attribution: ESRI_ATTRIB }),
        L.tileLayer(`${ESRI_DARK}Reference/MapServer/tile/{z}/{y}/{x}`, { ...opts, maxNativeZoom: 16, zIndex: 2 })
      ];
    }

    async function toggleMap() {
      const drawer = document.getElementById('map-drawer');
      const backdrop = document.getElementById('map-backdrop');
      if (drawer.classList.contains('open')) {
        drawer.classList.remove('open');
        backdrop.classList.remove('open');
        drawer.setAttribute('aria-hidden', 'true');
        return;
      }
      drawer.setAttribute('aria-hidden', 'false');
      drawer.classList.add('open');
      backdrop.classList.add('open');
      try { await ensureLeaflet(); }
      catch (e) {
        document.getElementById('river-map').innerHTML = `<div style="padding:20px;color:var(--text-muted)">Map library failed to load: ${e.message}</div>`;
        return;
      }
      if (!mapInstance) {
        const isDark = isDarkMode();
        mapInstance = L.map('river-map', { center: [46.4, -76.5], zoom: 7, attributionControl: true, zoomControl: false });
        L.control.zoom({ position: 'topright' }).addTo(mapInstance);
        basemapLayers(isDark, { maxZoom: 18 }).forEach(layer => layer.addTo(mapInstance));
        // Mini-map for orientation. Needs its own tile layer instance because Leaflet
        // can't reuse a tile layer across multiple maps. Dark mode takes the base
        // layer only — Esri keeps labels in a second layer, and at 130px with
        // zoomLevelOffset -3 they're unreadable anyway.
        if (L.Control && L.Control.MiniMap) {
          const miniLayer = basemapLayers(isDark, { minZoom: 4, maxZoom: 12 })[0];
          new L.Control.MiniMap(miniLayer, {
            toggleDisplay: true, position: 'bottomright',
            width: 130, height: 130, zoomLevelOffset: -3,
            aimingRectOptions: { color: '#4FA3C7', weight: 1, opacity: 0.8 },
            shadowRectOptions: { color: '#4FA3C7', weight: 1, opacity: 0.4, fillOpacity: 0.05 }
          }).addTo(mapInstance);
        }
        // Keep callout cards locked to a fixed pixel offset from their dots as the user pans/zooms.
        mapInstance.on('zoom move zoomend moveend viewreset', repositionCallouts);
      }
      // Leaflet needs a size hint after the drawer's transform settles.
      setTimeout(() => mapInstance.invalidateSize(), 320);
      // First-open legend defaults: shown on desktop, collapsed on mobile.
      const legend = document.getElementById('map-legend');
      if (legend && !legend.dataset.initialized) {
        renderLegend();
        if (matchMedia('(min-width: 700px)').matches) legend.classList.add('open');
        legend.dataset.initialized = '1';
      }
      await refreshHomeCoords();
      await renderMapMarkers();
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.getElementById('map-drawer').classList.contains('open')) toggleMap();
      if (e.key === 'Escape' && document.getElementById('brief-drawer').classList.contains('open')) toggleBrief();
    });

    // === Daily-brief drawer ====================================================
    // Fetches data/daily-briefs/latest.md from the public mirror and renders
    // it as HTML inside the drawer. The latest.md file is overwritten daily by
    // the freshet-daily-brief Claude routine alongside the dated brief.
    const BRIEF_URL_BASE = 'https://raw.githubusercontent.com/aachtenberg/ottawa-river-freshet/main/data/daily-briefs/latest.md';
    let briefLoaded = false;

    async function loadBrief() {
      const body = document.getElementById('brief-body');
      body.innerHTML = '<div class="brief-drawer-loading">Loading…</div>';
      // Cache-buster: raw.githubusercontent.com's CDN holds files for ~5 min
      // and ignores `cache: 'no-store'`. Per-hour buster means the dashboard
      // always sees a fresh brief within an hour of the routine writing it,
      // without hammering the CDN on every drawer open.
      const cacheBust = new Date().toISOString().slice(0, 13).replace(':', '-'); // YYYY-MM-DDTHH
      const url = `${BRIEF_URL_BASE}?_=${cacheBust}`;
      try {
        const r = await fetch(url, { cache: 'no-store' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const md = await r.text();
        if (typeof marked === 'undefined') {
          body.innerHTML = '<div class="brief-drawer-loading">Markdown library failed to load. <a href="' + BRIEF_URL + '" target="_blank">Open raw brief →</a></div>';
          return;
        }
        // GFM mode for tables; line breaks treated as paragraphs (gfm default).
        marked.setOptions({ gfm: true, breaks: false });
        body.innerHTML = marked.parse(md);
        // Update subtitle with the brief's "Generated automatically at HH:MM UTC" line.
        const m = md.match(/^# Daily brief — (\d{4}-\d{2}-\d{2})/m);
        const t = md.match(/Generated automatically at ([\d:]+ UTC)/);
        const sub = document.getElementById('brief-subtitle');
        if (sub) sub.textContent = (m ? m[1] : 'latest') + (t ? ` · generated ${t[1]}` : '');
        briefLoaded = true;
      } catch (e) {
        body.innerHTML = `<div class="brief-drawer-loading">Could not load the daily brief: ${e.message}<br><br><a href="${BRIEF_URL}" target="_blank">Open raw brief →</a></div>`;
      }
    }

    function toggleBrief() {
      const drawer = document.getElementById('brief-drawer');
      const backdrop = document.getElementById('brief-backdrop');
      if (drawer.classList.contains('open')) {
        drawer.classList.remove('open');
        backdrop.classList.remove('open');
        drawer.setAttribute('aria-hidden', 'true');
        return;
      }
      drawer.setAttribute('aria-hidden', 'false');
      drawer.classList.add('open');
      backdrop.classList.add('open');
      // Re-fetch each open so users see the latest brief without a full page reload.
      loadBrief();
    }

    function toggleBriefFullscreen() {
      document.getElementById('brief-drawer').classList.toggle('fullscreen');
    }

    // Initial UI sync — must run after all module-level declarations (mapLang etc).
    applyThemeIcon();
    applyPageLang();
    activateTab(location.hash.slice(1) || 'overview');

    // Initial load
    fetchData();

    // Auto-refresh every 10 minutes
    setInterval(fetchData, 10 * 60 * 1000);

    // Update "X min ago" every minute without re-fetching
    setInterval(() => {
      if (lastDataTimestamp) {
        renderStatus('live', liveStatusHTML(lastDataTimestamp));
      }
    }, 60000);
    </script>

    </body>
    </html>
  nginx.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files /index.html =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Read-only proxy to PostgREST for long-term river history.
        # Only GET is allowed so browsers can't write through this path.
        # Override the upstream via the env-substituted hostname or a config patch
        # for your deployment. Default points at the docker-compose service name.
        location /history/ {
            if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
            proxy_pass http://postgrest:3000/;
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";
            proxy_read_timeout 30s;
        }

        gzip on;
        gzip_types text/html text/css application/javascript application/json;
        gzip_min_length 1024;
    }
