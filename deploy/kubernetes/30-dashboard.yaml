      <div class="section-subtitle" style="margin-bottom: 8px;">The familiar form. Magnitude differences (upstream = thinner river, downstream = bigger) and day-to-day changes are both readable, but you have to mentally trace each line to spot the wave moving downstream.</div>
      <div style="position: relative; height: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;">
        <canvas id="flow-multiline"></canvas>
      </div>

      <!-- Viz 2: Stacked small multiples -->
      <div class="section-title" style="margin-top: 22px; font-size: 13px;">2 · Stacked small multiples <span style="font-weight:400;color:var(--text-muted);font-size:11px;">· each panel = one station · top is upstream, bottom is downstream</span></div>
      <div class="section-subtitle" style="margin-bottom: 8px;">The page itself becomes a map of the river. Watch the peak march down the stack — what you see at the top arrives at the bottom several days later.</div>
      <div id="flow-smallmultiples" style="background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 0;"></div>

      <!-- Viz 3: Hovmöller heatmap -->
      <div class="section-title" style="margin-top: 22px; font-size: 13px;">3 · Hovmöller heatmap <span style="font-weight:400;color:var(--text-muted);font-size:11px;">· station × day · color = flow (per-station normalized)</span></div>
      <div class="section-subtitle" style="margin-bottom: 8px;">A meteorologist's tool, repurposed. Stations stack vertically (upstream at top), days run left-to-right. A diagonal stripe of bright cells <em>is</em> the freshet wave moving through the system — its slope tells you the direction. A textbook upper-basin snowmelt freshet would slope <em>down</em> and to the right (upper stations peak first, lower later). On longer windows that include 2026 you'll see the opposite: the stripe slopes <em>up</em> and to the right because the lower-basin tributaries (Gatineau, Madawaska, etc.) peaked around Apr 21-22 while upper-basin Témiscaming didn't peak until May 2. The slope <em>is</em> the story of where the water came from. Each row is normalized to its own station so smaller upstream stations stay legible alongside Carillon.</div>
      <div id="flow-hovmoller" style="background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px;"></div>

