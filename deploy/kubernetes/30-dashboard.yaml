    <div class="tab-panel active" data-tab="overview">
    <section id="summary-box" class="hero skeleton" data-station-id="1195" aria-label="Lac Coulonge">Loading…</section>

    <h2 class="section-title" style="margin-top: 0; margin-bottom: 12px;" data-i18n="watch_points">Watch points</h2>
    <div class="watch-cards" id="cards"></div>

    <section aria-labelledby="corr-h">
    <div class="corr-head">
      <div>
        <h2 class="section-title" id="corr-h" data-i18n="corridor">The corridor right now</h2>
        <p class="section-subtitle" data-i18n="corridor_sub">Change, not elevation, shows a pulse moving downstream. Colour only ever means flood state; arrows and bars are plain ink.</p>
      </div>
      <div class="seg" id="corridor-mode" role="group" aria-label="Compare against">
        <button type="button" data-mode="live" aria-pressed="true" data-i18n="corr_live">Live gauges</button>
        <button type="button" data-mode="orrpb" aria-pressed="false" data-i18n="corr_orrpb_btn">ORRPB 24:00 h</button>
      </div>
    </div>
    <div class="corr-wrap" id="corridor-table"><p class="corr-msg" style="padding: 14px 16px;">Loading…</p></div>
    <p class="corr-foot" id="corridor-foot"></p>
    </section>

    <div class="range-picker" id="range-picker">
      <span class="label" data-i18n="window">Window</span>
      <button class="range-btn" data-hours="1">1h</button>
      <button class="range-btn" data-hours="6">6h</button>
      <button class="range-btn" data-hours="12">12h</button>
      <button class="range-btn" data-hours="24">24h</button>
      <button class="range-btn active" data-hours="72">72h</button>
      <button class="range-btn" data-hours="168">7d</button>
      <button class="range-btn" data-hours="336">14d</button>
      <button class="range-btn" data-hours="720">30d</button>
      <button class="range-btn" data-hours="1440">60d</button>
    </div>

    <div class="section-title" id="wa-title">Upstream</div>
    <div class="section-subtitle" id="wa-info">—</div>
    <div class="chart-wrap"><div class="chart-container"><canvas id="waChart"></canvas></div></div>
    <div class="thresholds" id="wa-legend"></div>

    <div class="section-title" style="margin-top: 24px;" id="lc-title">Lac Coulonge (Ottawa River)</div>
    <div class="section-subtitle" id="lc-info">—</div>
    <div class="chart-wrap"><div class="chart-container"><canvas id="lcChart"></canvas></div></div>
    <div class="thresholds" id="lc-legend"></div>

    <div class="section-title" style="margin-top: 24px;" id="cr-title">Downstream</div>
    <div class="section-subtitle" id="cr-info">—</div>
    <div class="chart-wrap"><div class="chart-container"><canvas id="crChart"></canvas></div></div>
    <div class="thresholds" id="cr-legend"></div>

    <div id="local-gauge-strip" class="deactivated-strip" hidden></div>

    <div class="property">
      <h3 data-i18n="property_t">Property thresholds &amp; surveyed flood lines</h3>
      <div id="thresh-list" class="skeleton">Loading…</div>
    </div>

    <section class="freeze-tracker" aria-labelledby="freeze-h">
      <h2 class="section-title" id="freeze-h" data-i18n="freeze_h">Basin freeze &amp; precipitation outlook</h2>
      <p class="section-subtitle" data-i18n="freeze_sub">Overnight lows + 48 h precipitation across the basin. The freeze-night counter uses upstream stations only (snowmelt signal); downstream rows are local forecast for visitors watching the lower-corridor gauges.</p>
      <p id="freeze-summary" class="freeze-lede skeleton">Loading weather…</p>
      <div class="corr-wrap" id="freeze-grid"></div>
      <p class="corr-foot" data-i18n="freeze_foot">Shaded cells are overnight lows below 0 °C. Last night is observed; later nights are forecast (Open-Meteo).</p>
    </section>
    </div> <!-- /tab-panel overview -->

    <div class="tab-panel" data-tab="forecast">
      <div class="forecast">
        <h3 data-i18n="forecast_t">Season-end forecast — chance of crossing each threshold</h3>
        <div class="sub" id="forecast-sub" data-i18n="forecast_sub">Bayesian posterior (V3): this winter's seasonal prior, continuously updated by the lake's day-to-day trajectory. The bar is today's chance the annual peak crosses each line; the tick marks where the pre-freshet prior started, so the bar visibly tightens as the season resolves.</div>
        <div id="freshet-forecast" class="skeleton">Loading forecast…</div>
      </div>
    </div>

    <div class="tab-panel" data-tab="stations">
      <div class="section-title" style="margin-top: 4px;">All stations — corridor view</div>
      <div class="section-subtitle">Each card has its own time-series chart, daily change, flood-state badge, ORRPB reference label, percentile (where available), and 48 h precipitation forecast at the nearest weather station. Click a card to open the full detail. <strong>Low-water flags</strong> (↓ fast drop, below seasonal median, near seasonal low) are <em>informational, boater-beware</em> advisories — there is no official minimum-navigable level and conditions vary locally.</div>
      <div class="range-picker" id="range-picker-stations">
        <span class="label" data-i18n="window">Window</span>
        <button class="range-btn" data-hours="1">1h</button>
        <button class="range-btn" data-hours="6">6h</button>
        <button class="range-btn" data-hours="12">12h</button>
        <button class="range-btn" data-hours="24">24h</button>
        <button class="range-btn active" data-hours="72">72h</button>
        <button class="range-btn" data-hours="168">7d</button>
        <button class="range-btn" data-hours="336">14d</button>
        <button class="range-btn" data-hours="720">30d</button>
        <button class="range-btn" data-hours="1440">60d</button>
      </div>
      <div class="stations-grid" id="stations-grid"></div>
    </div>

    <div class="tab-panel" data-tab="river">
      <div class="section-title" style="margin-top: 4px;">River profile — upstream to downstream (N → S)</div>
      <div class="section-subtitle">The Ottawa River corridor at a glance, headwaters to outlet. Each gauge shows its current level, 24 h change, a trend sparkline, and a low-water status band. <strong>Status colours</strong> are <em>informational, boater-beware</em>: green normal · amber below seasonal median / dropping · orange near seasonal low / fast drop · red record-low territory or very fast drop. There is no official minimum-navigable level and conditions vary locally. Click a row for the full gauge detail.</div>
      <div class="river-ends"><span>↑ Upstream · North (Témiscaming)</span><span>Downstream · South (Carillon outlet) ↓</span></div>
      <div class="river-list" id="river-list"></div>
    </div>

    <div class="tab-panel" data-tab="reservoirs">
      <div class="section-title" style="margin-top: 4px;">Reservoir storage — basin-wide</div>
      <div class="section-subtitle">
        Percent-full of the major Ottawa River basin reservoirs. When upper-basin reservoirs approach 90%, operators lose discretion to absorb new inflow — that's the signal a freshet pulse will pass through to Lac Coulonge instead of being held back.
        Level data: <a href="https://www.ottawariver.ca/conditions/?display=reservoir" target="_blank">ORRPB conditions page</a>, scraped daily. Operating limits: same ORRPB pages (per-location System Constraints tables). Storage capacities: <a href="https://ottawariver.ca/wp-content/uploads/2020/10/ICOLD-CANADA-CASE_STUDY_OTTAWA_RIVER_WATERSHED.pdf" target="_blank">ORRPB / ICOLD-Canada case study (2020), Table 1</a> — a single authoritative source listing usable storage for all 13 principal cascade reservoirs.
        <button id="reservoir-methodology-btn" onclick="document.getElementById('reservoir-methodology').style.display = document.getElementById('reservoir-methodology').style.display === 'block' ? 'none' : 'block'" style="background:transparent;border:none;color:var(--blue);font-size:11px;cursor:pointer;padding:0;margin-left:6px;text-decoration:underline">How is percent-full calculated?</button>
        <div id="reservoir-methodology" style="display:none;margin-top:8px;padding:10px 12px;background:var(--surface-2);border-radius:6px;font-size:11px;line-height:1.55;color:var(--text-muted);">
          <p style="margin-bottom:6px;"><strong>Percent full</strong> is estimated using the difference between the published high and low operating limits for each reservoir. The low operating limit represents the minimum level at which a generating station or dam can maintain outflow under normal operating conditions.</p>
          <p style="margin-bottom:6px;">A simple linear approximation is applied across this operating range to estimate how full a reservoir is at a given level. This provides a reasonable point-in-time estimate of percent full based solely on water level relative to the operating limits.</p>
          <p style="margin-bottom:6px;">Reservoir level data is captured as a point-in-time measurement, while official daily values are typically finalized using 24-hour averaged data. As a result, the percent full displayed on cards reflects current conditions, but the reported daily percent-full value may lag slightly.</p>
          <p style="margin-bottom:6px;">Official calculation methods used by reservoir operators may differ and may incorporate additional operational or hydrological factors. For authoritative information, consult the respective reservoir operators. Methodology adapted from Contributor B's community-published reservoir gauge.</p>
          <p style="margin:0;"><strong>Storage volumes</strong> shown on each card (e.g. "1,687 / 1,863 M m³") use the usable-storage capacity from Table 1 of the ORRPB / ICOLD-Canada case study (2020) — the single authoritative cascade-regulator source for all 13 principal reservoirs. Click the "[source]" link in any card's detail view to open the citation. The Rapide-7 gauge reads Reservoir Decelles, which the Rapide-7 dam impounds; the case study lists it as Decelles (371 M m³).</p>
          <p style="margin:6px 0 0;"><strong>24 h change</strong> on each card is day-over-day, in percentage points of the operating band, between ORRPB's published daily values. Gauges built from point-in-time readings (taken at a different hour) can show a different one-day figure for the same reservoir.</p>
          <p style="margin:6px 0 0;"><strong>Cascade storage (proxy chart)</strong> is a different calculation from the cards. ORRPB publishes total water stored in the 13 principal reservoirs only as a picture (p.4 of its annual Spring Freshet Review). The chart estimates that total from the same ORRPB daily levels and operating bands, but applies a <em>convex</em> fill curve — a reservoir's surface shrinks as it empties, so a linear percent-full overstates volume at low levels by about 1 billion m³ across the cascade. The curve's exponent and scale were fitted to ORRPB's 2026 chart; the calibration shown under the chart is stored with the data so the provenance travels with the number. It is an estimate of their chart, not a reproduction, and ORRPB's 10th–90th percentile band is not available to us. Method and cross-check: <a href="https://github.com/aachtenberg/ottawa-river-freshet/blob/main/data/community-notes/2026-11-03_orrpb_freshet_review_crosscheck.md" target="_blank" rel="noopener">community note, 2026-11-03</a>.</p>
        </div>
        <span id="reservoir-status-line" style="display:block; margin-top:6px; font-size:11px; color:var(--text-faint);"></span>
        <span id="reservoir-calibration-warning" style="display:none; margin-top:4px; font-size:11px; color:var(--orange);">⚠ Operating limits are starting estimates from operator documentation — not yet calibrated. Percent-full numbers may drift ± a few points until limits are finalized.</span>
      </div>
      <div class="section-title" style="margin-top: 14px; font-size: 13px;">Cascade storage — proxy <span style="font-weight:400;color:var(--text-muted);font-size:11px;">· 13 principal reservoirs · billion m³ · the counterpart of ORRPB's "water stored in principal reservoirs" chart</span></div>
