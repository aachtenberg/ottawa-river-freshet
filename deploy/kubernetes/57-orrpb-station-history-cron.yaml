# ORRPB per-station historical-record scraper — POSTs the "table view, daily"
# form on every ottawariver.ca/location/<slug>/ page and upserts the four
# series ORRPB publishes there (observed, 1991-2020 median, per-day historic
# high/low with year) → orrpb_station_history. Covers the 13 main-stem
# stations and the 12 principal reservoirs; the reservoir pages also carry a
# "System Constraints" table → orrpb_station_limits. Those two tables feed
# the reservoir_storage_proxy views (cascade storage in Mm³, the counterpart
# of ORRPB's annual "water stored in principal reservoirs" chart) that the
# dashboard's Reservoirs tab plots.
#
# The schema for all of that lives in the timescaledb-bootstrap ConfigMap
# (10-timescaledb.yaml). TimescaleDB only runs that file on the first boot of
# an empty PVC, so this CronJob applies it again in an init container before
# each run — the file is idempotent (IF NOT EXISTS / ON CONFLICT / CREATE OR
# REPLACE), and that is how an existing deployment picks up new tables and
# views without a manual psql step.
---
# Script ConfigMap — kept in sync with ingesters/orrpb-station-history/
# (scrape.py + its orrpb_http.py helper) by scripts/sync-k8s-embeds.py.
# If you edit the source, regenerate with:
#   kubectl create configmap orrpb-station-history-script \
#     --from-file=scrape.py=../../ingesters/orrpb-station-history/scrape.py \
#     --from-file=orrpb_http.py=../../ingesters/orrpb-station-history/orrpb_http.py \
#     -n freshet --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: ConfigMap
metadata:
  name: orrpb-station-history-script
  namespace: freshet
data:
  scrape.py: |
    """ORRPB per-station historical-record scraper.

    Pulls the 13-month "Table view, Daily" data for every monitored location
    on ottawariver.ca and upserts into the orrpb_station_history hypertable
    via PostgREST.

    Each per-station table contains 4 data rows: Observed (current year),
    Median (1991-2020 P50), Historic High (per-day max over record with year
    tag), and Historic Low (per-day min with year tag). The chart's green
    80% normal-range band is NOT in the table response.

    The endpoint is a POST to /location/<slug>/ with form params
    reading-type, data-display, data-type. We hit it twice per station
    (levels and flows) for the stations that publish flows. Stations that
    only publish levels (Mattawa, Pembroke, Lake Coulonge, Chats Lake,
    Gatineau, Thurso, Grenville) return an empty or unchanged response on
    discharge requests and are skipped.

    The 12 principal-reservoir pages (dozois … poisson-blanc) use the same
    template and are scraped the same way (OTTAW-28). Their pages also carry a
    "System Constraints" table (operating / navigation / recreation level
    limits), which is upserted into orrpb_station_limits, one row per
    (station, category).

    Stdlib-only (urllib + html.parser) to match the reservoir-ingest /
    orrpb-river-ingest pattern.

    Env vars: POSTGREST_URL, SCRAPE_USER_AGENT, ORRPB_BASE,
              ORRPB_STATIONS (override CSV of slug:metric pairs),
              ORRPB_SLEEP_S (sleep between requests, default 1.5s),
              ORRPB_DATE_START / ORRPB_DATE_END (YYYY-MM-DD; optional explicit
              window for a one-off backfill, e.g. 2025-01-01 / 2025-12-31).
    """
    from __future__ import annotations

    import json
    import os
    import re
    import sys
    import time
    import urllib.parse
    import urllib.request
    from datetime import datetime, timezone
    from html.parser import HTMLParser

    from orrpb_http import fetch_text

    ORRPB_BASE = os.environ.get("ORRPB_BASE", "https://www.ottawariver.ca/location")
    POSTGREST = os.environ.get("POSTGREST_URL", "http://postgrest:3000")
    USER_AGENT = os.environ.get(
        "SCRAPE_USER_AGENT",
        "freshet-xgrunt-com/1.0 (+https://freshet.xgrunt.com; community flood monitoring)",
    )
    SLEEP_S = float(os.environ.get("ORRPB_SLEEP_S", "1.5"))

    # (slug, metrics_to_fetch) where metrics is a subset of ('levels', 'discharges').
    # Slugs match ORRPB's location-URL segments. Metric availability follows the
    # conditions-page tables: every station has levels; flows are available only
    # at the dam sites in the cascade.
    DEFAULT_STATIONS: list[tuple[str, tuple[str, ...]]] = [
        ("temiscaming",   ("levels", "discharges")),
        ("otto-holden",   ("levels", "discharges")),
        ("mattawa",       ("levels",)),
        ("des-joachims",  ("levels", "discharges")),
        ("pembroke",      ("levels",)),
        ("coulonge",      ("levels",)),
        ("chenaux",       ("levels", "discharges")),
        ("chats-falls",   ("levels", "discharges")),
        ("britannia",     ("levels", "discharges")),
        ("hull",          ("levels",)),
        ("thurso",        ("levels",)),
        ("grenville",     ("levels",)),
        ("carillon",      ("levels", "discharges")),
        # Principal reservoirs (OTTAW-28). Same page template, same 4-row table,
        # plus a "System Constraints" operating-limits table (see parse_limits).
        # Slugs are the /location/ segments from the reservoir page's dropdown.
        # des-joachims is shared with the main-stem list above (same page) and
        # timiskaming-haileybury has no history form at all, so neither is here.
        ("dozois",        ("levels", "discharges")),
        ("rapide-7",      ("levels", "discharges")),
        ("quinze",        ("levels", "discharges")),
        ("lady-evelyn",   ("levels", "discharges")),
        ("kipawa",        ("levels", "discharges")),
        ("timiskaming",   ("levels", "discharges")),
        ("bark-lake",     ("levels", "discharges")),
        ("cabonga",       ("levels", "discharges")),
        ("baskatong",     ("levels", "discharges")),
        ("mitchinamecus", ("levels", "discharges")),
        ("kiamika",       ("levels", "discharges")),
        ("poisson-blanc", ("levels", "discharges")),
    ]

    # Optional explicit window for one-off backfills (the form accepts any range;
    # the default is ORRPB's own ~13-month window ending next month). Leave unset
    # for the cron.
    DATE_START = os.environ.get("ORRPB_DATE_START", "").strip()
    DATE_END = os.environ.get("ORRPB_DATE_END", "").strip()


    def stations_from_env() -> list[tuple[str, tuple[str, ...]]]:
        raw = os.environ.get("ORRPB_STATIONS", "").strip()
        if not raw:
            return DEFAULT_STATIONS
        out: list[tuple[str, tuple[str, ...]]] = []
        for entry in raw.split(","):
            entry = entry.strip()
            if not entry:
                continue
            if ":" in entry:
                slug, metrics_csv = entry.split(":", 1)
                metrics = tuple(m.strip() for m in metrics_csv.split("+") if m.strip())
            else:
                slug, metrics = entry, ("levels", "discharges")
            out.append((slug.strip(), metrics))
        return out


    class TableExtractor(HTMLParser):
        """Capture every <table>'s rows of cells (cell = list of text fragments)."""

        def __init__(self) -> None:
            super().__init__()
            self.tables: list[list[list[list[str]]]] = []
            self._t: list[list[list[str]]] | None = None
            self._r: list[list[str]] | None = None
            self._c: list[str] | None = None

        def handle_starttag(self, tag: str, attrs):  # type: ignore[override]
            if tag == "table":
                self._t = []
                self.tables.append(self._t)
            elif tag == "tr" and self._t is not None:
                self._r = []
                self._t.append(self._r)
            elif tag in ("td", "th") and self._r is not None:
                self._c = []
                self._r.append(self._c)

        def handle_endtag(self, tag: str) -> None:  # type: ignore[override]
            if tag == "table":
                self._t = None
            elif tag == "tr":
                self._r = None
            elif tag in ("td", "th"):
                self._c = None

        def handle_data(self, data: str) -> None:  # type: ignore[override]
            if self._c is not None:
                self._c.append(data)


    def cell_text(cell: list[str]) -> str:
        if not cell:
            return ""
        return re.sub(r"\s+", " ", "".join(cell).strip())


    def find_data_table(tables: list[list[list[list[str]]]]) -> list[list[list[str]]] | None:
        """Return the data table (the one whose first column lists Observed/Median rows)."""
        for tbl in tables:
            if not tbl:
                continue
            labels = {cell_text(row[0]).strip() for row in tbl if row}
            if "Observed" in labels and "Median" in labels:
                return tbl
        return None


    HI_LO_RE = re.compile(r"(-?[\d,]+(?:\.\d+)?)\s*\(?(\d{4})\)?")
    NUM_RE = re.compile(r"^-?[\d,]+(?:\.\d+)?$")


    def _to_float(s: str) -> float:
        """Parse a numeric cell allowing thousands separators (e.g. '2,200')."""
        return float(s.replace(",", ""))


    def parse_table(
        tbl: list[list[list[str]]],
        station: str,
        metric_col: str,
    ) -> list[dict]:
        """Walk the table and emit one row per calendar date with all four series.

        metric_col is 'level_m' or 'flow_cms'. We collapse the four parallel rows
        (Observed/Median/Historic High/Historic Low) into a single record per date.
        """
        if not tbl or not tbl[0]:
            return []

        # Header row carries date columns. The first cell may be 'Date/Time' or empty.
        header = tbl[0]
        dates: list[str] = []
        for cell in header[1:]:
            txt = cell_text(cell)
            m = re.match(r"^(\d{4})-(\d{2})-(\d{2})$", txt)
            if m:
                dates.append(txt)
            else:
                dates.append("")  # placeholder so column index stays aligned

        if not any(dates):
            return []

        # Index data rows by their label.
        row_by_label: dict[str, list[list[str]]] = {}
        for row in tbl[1:]:
            if not row:
                continue
            label = cell_text(row[0])
            row_by_label[label] = row[1:]

        out_by_date: dict[str, dict] = {}
        for i, d in enumerate(dates):
            if not d:
                continue
            rec = {
                "time": d,
                "station": station,
                "metric": metric_col,
                "observed": None,
                "median": None,
                "historic_high_value": None,
                "historic_high_year": None,
                "historic_low_value": None,
                "historic_low_year": None,
            }
            for label, values in row_by_label.items():
                if i >= len(values):
                    continue
                txt = cell_text(values[i])
                if not txt:
                    continue
                if label == "Observed":
                    if NUM_RE.match(txt):
                        rec["observed"] = _to_float(txt)
                elif label == "Median":
                    if NUM_RE.match(txt):
                        rec["median"] = _to_float(txt)
                elif label == "Historic High":
                    m = HI_LO_RE.search(txt)
                    if m:
                        rec["historic_high_value"] = _to_float(m.group(1))
                        rec["historic_high_year"] = int(m.group(2))
                elif label == "Historic Low":
                    m = HI_LO_RE.search(txt)
                    if m:
                        rec["historic_low_value"] = _to_float(m.group(1))
                        rec["historic_low_year"] = int(m.group(2))
            # Skip dates with no usable data at all.
            if any(rec[k] is not None for k in
                   ("observed", "median", "historic_high_value", "historic_low_value")):
                out_by_date[d] = rec
        return list(out_by_date.values())


    def fetch_table_html(slug: str, reading_type: str) -> str:
        url = f"{ORRPB_BASE}/{slug}/"
        form = {
            "reading-type": reading_type,    # levels | discharges
            "data-display": "table",
            "data-type":    "daily",
        }
        if DATE_START:
            form["date-start"] = DATE_START
        if DATE_END:
            form["date-end"] = DATE_END
        body = urllib.parse.urlencode(form).encode("utf-8")
        req = urllib.request.Request(
            url,
            data=body,
            method="POST",
            headers={
                "User-Agent": USER_AGENT,
                "Accept": "text/html,application/xhtml+xml",
                "Content-Type": "application/x-www-form-urlencoded",
            },
        )
        return fetch_text(req, timeout=30)


    def post_rows(table: str, rows: list[dict]) -> int:
        if not rows:
            return 0
        body = json.dumps(rows).encode("utf-8")
        req = urllib.request.Request(
            f"{POSTGREST}/{table}",
            data=body,
            method="POST",
            headers={
                "Content-Type": "application/json",
                "Prefer": "resolution=merge-duplicates,return=minimal",
            },
        )
        with urllib.request.urlopen(req, timeout=30) as r:
            return len(rows)


    LIMIT_NUM_RE = re.compile(r"-?\d+(?:\.\d+)?")


    def find_limits_table(tables: list[list[list[list[str]]]]) -> list[list[list[str]]] | None:
        """Return the 'System Constraints' table (header has Lower/Upper Limit columns).

        Reservoir pages carry it; most river-station pages do not, in which case
        None is returned and nothing is posted.
        """
        for tbl in tables:
            for row in tbl[:3]:
                texts = [cell_text(c) for c in row]
                if any(t.startswith("Lower Limit") for t in texts) and \
                   any(t.startswith("Upper Limit") for t in texts):
                    return tbl
        return None


    def parse_limits(tbl: list[list[list[str]]], station: str) -> list[dict]:
        """Rows look like ['Operation', 'All Year', '207.60', '223.14'] or
        ['Navigation', '15 May - 15 Oct', '178.65', ''] with an occasional '*'
        footnote marker on a number. One record per (station, category)."""
        out: list[dict] = []
        for row in tbl:
            cells = [cell_text(c) for c in row]
            if len(cells) < 4 or not cells[0] or cells[0] in ("Category", "System Constraints"):
                continue
            if cells[0].startswith("Lower Limit") or cells[1].startswith("Lower Limit"):
                continue
            vals = []
            flagged = False
            for raw in cells[2:4]:
                m = LIMIT_NUM_RE.search(raw)
                vals.append(float(m.group(0)) if m else None)
                flagged = flagged or ("*" in raw)
            if vals[0] is None and vals[1] is None:
                continue
            out.append({
                "station": station,
                "category": cells[0],
                "period": cells[1] or None,
                "lower_m": vals[0],
                "upper_m": vals[1],
                "footnoted": flagged,
                "scraped_at": datetime.now(timezone.utc).isoformat(),
            })
        return out


    def scrape_station(slug: str, reading_type: str) -> tuple[list[dict], list[dict]]:
        """Return (history rows, operating-limit rows) parsed from one page fetch."""
        metric_col = "level_m" if reading_type == "levels" else "flow_cms"
        html = fetch_table_html(slug, reading_type)
        parser = TableExtractor()
        parser.feed(html)
        tbl = find_data_table(parser.tables)
        rows = parse_table(tbl, slug, metric_col) if tbl is not None else []
        limits: list[dict] = []
        if reading_type == "levels":  # the limits table is identical on both views
            try:
                ltbl = find_limits_table(parser.tables)
                if ltbl is not None:
                    limits = parse_limits(ltbl, slug)
            except Exception as exc:  # never let a reshaped limits table cost us the history rows
                print(f"  [WARN] {slug}/limits: parse failed: {type(exc).__name__}: {exc}",
                      file=sys.stderr)
        return rows, limits


    def main() -> int:
        stations = stations_from_env()
        print(f"Scraping {len(stations)} stations from {ORRPB_BASE} "
              f"(sleep {SLEEP_S:.1f}s between requests"
              + (f", window {DATE_START or '…'}..{DATE_END or '…'}" if DATE_START or DATE_END else "")
              + ")")
        total_rows = 0
        total_limits = 0
        failures: list[str] = []
        for slug, metrics in stations:
            for reading_type in metrics:
                label = f"{slug}/{reading_type}"
                try:
                    rows, limits = scrape_station(slug, reading_type)
                except Exception as exc:
                    failures.append(label)
                    print(f"  [FAIL] {label}: {type(exc).__name__}: {exc}", file=sys.stderr)
                    time.sleep(SLEEP_S)
                    continue
                if not rows:
                    print(f"  [SKIP] {label}: no data rows parsed")
                else:
                    posted = post_rows("orrpb_station_history", rows)
                    total_rows += posted
                    print(f"  [OK]   {label}: {posted} rows upserted "
                          f"(dates {rows[0]['time']} -> {rows[-1]['time']})")
                if limits:
                    try:
                        total_limits += post_rows("orrpb_station_limits", limits)
                        print(f"  [OK]   {slug}/limits: {len(limits)} operating-limit rows upserted")
                    except Exception as exc:  # limits are a bonus; never fail the history scrape
                        print(f"  [WARN] {slug}/limits: {type(exc).__name__}: {exc}", file=sys.stderr)
                time.sleep(SLEEP_S)

        print(f"\nTotal upserted: {total_rows} rows across "
              f"{sum(len(m) for _, m in stations)} (station, metric) pairs, "
              f"{total_limits} operating-limit rows")
        if failures:
            print(f"Failures: {len(failures)} -> {', '.join(failures)}", file=sys.stderr)
            # Don't exit nonzero on partial failure; ORRPB occasionally returns
            # 500s for individual locations. The whole-job fail mode is "got
            # zero rows for everything".
        if total_rows == 0:
            print("Got zero rows across all stations - bailing nonzero.", file=sys.stderr)
            return 2
        return 0


    if __name__ == "__main__":
        sys.exit(main())
  orrpb_http.py: |
    """Shared ottawariver.ca fetch for the ORRPB scrapers: retry 5xx and network
    errors, spaced past the cluster DNS cache.

    www.ottawariver.ca is a CNAME into QUIC.cloud's CDN, which answers by resolver
    location. On 2026-10-08 Google DNS (8.8.8.8) handed out a CDN node,
    199.59.247.242, that returned 520 "Origin Server Unavailable" to every request,
    while 1.1.1.1 / 9.9.9.9 / the router resolved to a node that served 200.
    CoreDNS forwards to each node's /etc/resolv.conf, and one node lists 8.8.8.8,
    so a pod got the dead node on roughly half its lookups. reservoir-ingest failed
    7 of 8 runs.

    The job's own backoffLimit didn't help: the pod restarts within CoreDNS's 30s
    cache and resolves to the same dead node again. Waiting past the cache gets a
    fresh lookup, and a fair chance of a working node, on each attempt.

    Shipped into each scraper's ConfigMap next to the script, so `import
    orrpb_http` resolves from the script's own directory (/app).
    """
    import http.client
    import os
    import sys
    import time
    import urllib.error
    import urllib.request

    # At least one attempt: 0 would skip the loop and hand the caller None.
    ATTEMPTS = max(1, int(os.environ.get("ORRPB_FETCH_ATTEMPTS", "5")))
    # CoreDNS `cache 30` caps answers at 30s; wait a little longer than that.
    RETRY_WAIT_S = float(os.environ.get("ORRPB_FETCH_RETRY_WAIT_S", "35"))


    def fetch_text(req, timeout=30):
        """urlopen(req) and return the decoded body, retrying 5xx and network
        errors. 4xx raises at once: that's a real answer, not a bad edge node.

        Retries replay the request, so pass only requests that are safe to repeat.
        The station-history POST qualifies: it's the read-only table-view form
        (reading-type / data-display / data-type), not a write."""
        for attempt in range(1, ATTEMPTS + 1):
            try:
                with urllib.request.urlopen(req, timeout=timeout) as r:
                    return r.read().decode("utf-8", errors="replace")
            except urllib.error.HTTPError as e:
                if e.code < 500:
                    raise
                err = e
            # HTTPException covers a body cut short mid-read (IncompleteRead).
            except (urllib.error.URLError, http.client.HTTPException,
                    TimeoutError, ConnectionError) as e:
                err = e
            if attempt == ATTEMPTS:
                raise err
            print(f"  {req.full_url}: {err} (attempt {attempt}/{ATTEMPTS}); "
                  f"retrying in {RETRY_WAIT_S:.0f}s", file=sys.stderr, flush=True)
            time.sleep(RETRY_WAIT_S)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: orrpb-station-history
  namespace: freshet
spec:
  # Daily, idempotent upsert. ORRPB refreshes mid-afternoon Eastern; this is
  # the last of the ORRPB scraper trio (reservoir-ingest 21:30,
  # orrpb-river-ingest 21:40, this 21:50 UTC) so the three never hit
  # ottawariver.ca at the same time. About 75 s per run at the default 1.5 s
  # sleep between the 45+ requests.
  schedule: "50 21 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: ensure-schema
              image: postgres:16-alpine
              command:
                - sh
                - -c
                - >-
                  PGPASSWORD="$POSTGRES_PASSWORD"
                  psql -h timescaledb.freshet.svc.cluster.local
                  -U "$POSTGRES_USER" -d "$POSTGRES_DB"
                  -v ON_ERROR_STOP=1 -f /sql/bootstrap.sql
              envFrom:
                - secretRef: { name: timescaledb-credentials }
              volumeMounts:
                - name: sql
                  mountPath: /sql
                  readOnly: true
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits:   { cpu: 200m, memory: 128Mi }
          containers:
            - name: scrape
              image: python:3.12-alpine
              command: ["python", "/app/scrape.py"]
              env:
                - name: POSTGREST_URL
                  value: http://postgrest.freshet.svc.cluster.local:3000
                # ORRPB_STATIONS overrides the built-in station list (CSV of
                # slug[:levels+discharges]); ORRPB_DATE_START / ORRPB_DATE_END
                # (YYYY-MM-DD) widen the window for a one-off backfill.
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits:   { cpu: 200m, memory: 128Mi }
          volumes:
            - name: script
              configMap: { name: orrpb-station-history-script }
            - name: sql
              configMap: { name: timescaledb-bootstrap }
